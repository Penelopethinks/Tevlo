<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b8f86">
  <meta name="description" content="Tevlo is a real-time messaging app with friends, group chats, media, reactions, and customizable chat themes.">
  <title>Tevlo — Messages</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{

    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
    button,input,textarea{font:inherit}
    button{cursor:pointer;border:0}
    .hidden{display:none!important}
    .app{min-height:100vh}
    .auth-wrap{min-height:100vh;display:grid;place-items:center;padding:28px}
    .auth-card{width:min(440px,100%);background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:30px}
    .logo{font-weight:800;letter-spacing:-.04em;font-size:40px;color:var(--teal)}
    .tagline{color:var(--muted);margin:4px 0 26px}
    .tabs{display:flex;gap:6px;background:#edf4f0;padding:4px;border-radius:14px;margin-bottom:20px}
    .tab{flex:1;padding:11px;border-radius:10px;background:transparent;color:var(--muted);font-weight:700}
    .tab.active{background:#fff;color:var(--teal);box-shadow:0 4px 14px rgba(18,54,39,.08)}
    label{font-size:13px;font-weight:700;color:#506060;display:block;margin:13px 0 7px}
    input,textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:0;background:#fbfdfc;color:var(--text)}
    input:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,143,138,.10)}
    .primary{background:var(--teal);color:#fff;border-radius:14px;padding:13px 16px;font-weight:800;width:100%;margin-top:16px}
    .secondary{background:#e9f5ef;color:var(--teal);border-radius:14px;padding:11px 14px;font-weight:800}
    .ghost{background:transparent;color:var(--muted);padding:9px 10px;border-radius:10px}

    .error{color:var(--danger);background:#fff1f3;border:1px solid #ffd5da;padding:10px 12px;border-radius:12px;margin-top:12px;font-size:13px}
    .info{color:#246d6a;background:#e8f8f6;border:1px solid #caebe7;padding:10px 12px;border-radius:12px;margin-top:12px;font-size:13px}
    .shell{height:100vh;display:flex;overflow:hidden}
    .sidebar{width:380px;min-width:380px;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column}
    .side-head{padding:22px 18px 12px;display:flex;align-items:center;justify-content:space-between}

    .search-wrap{padding:4px 14px 10px}

    .avatar img{width:100%;height:100%;object-fit:cover}
    .online-dot{position:absolute;right:0;bottom:1px;width:13px;height:13px;background:var(--teal);border:3px solid #fff;border-radius:50%}
    .conv-body{min-width:0;flex:1}
    .conv-top{display:flex;justify-content:space-between;gap:10px}

    .settings-card{border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:14px}

    .switch:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.15)}

      .sidebar{width:100%;min-width:0}

      .shell.chat-open .sidebar{display:none}
      .shell.chat-open .main{display:flex}

      .bubble{max-width:84%}

    .auth-card{border-radius:24px}
    .shell{background:var(--bg)}
    .sidebar{box-shadow:6px 0 22px rgba(18,54,39,.04)}
    .side-title{color:#163b2a}
    .conv{transition:background .16s ease, transform .16s ease}

    .filter-tabs{display:flex;gap:5px;padding:2px 14px 10px}.filter-tab{flex:1;background:transparent;color:var(--muted);padding:8px 6px;border-radius:10px;font-size:12px;font-weight:800}.filter-tab.active{background:var(--teal-2);color:var(--teal-dark)}

    .choice-list{display:grid;gap:8px;margin-top:14px}.choice-row{background:#f3f7f5;border:1px solid transparent;padding:12px 14px;border-radius:12px;text-align:left;font-weight:700}.choice-row.selected{border-color:var(--teal);background:var(--teal-2);color:var(--teal-dark)}
    .settings-card{border:1px solid var(--line);border-radius:16px;padding:4px 14px;background:#fbfdfc;margin-top:14px}.switch{width:42px;height:24px;border-radius:999px;background:#d8e1dc;position:relative;transition:.2s}.switch:after{content:"";position:absolute;width:18px;height:18px;top:3px;left:3px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);transition:.2s}.switch.on{background:var(--teal)}.switch.on:after{left:21px}.notification-list{display:grid;gap:8px;margin:14px 0}.notification-row{display:flex;gap:10px;padding:12px;background:#f5f9f6;border-radius:14px}.notif-dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--teal-2);color:var(--teal);font-weight:900}.notification-row small{color:var(--muted);font-size:10px}.profile-bio{color:var(--muted);margin:8px 0 0;line-height:1.45}

<script>
(() => {
  const SUPABASE_URL = "https://kcybwrdtnlflevndmzfn.supabase.co";

  async function signup(){

      const {data:p}=await sb.from("profiles").select("*").in("id",ids);

  async function loadConversations(){
    const uid=state.user.id;
    const {data:members,error}=await sb.from("tevlo_conversation_members").select("conversation_id").eq("user_id",uid);
    if(error){toast(error.message);return}

    const {data:convs}=await sb.from("tevlo_conversations").select("*").in("id",ids).order("updated_at",{ascending:false});

    for(const c of convs||[]){ if(!c.is_group){ const {data:m}=await sb.from("tevlo_conversation_members").select("user_id").eq("conversation_id",c.id).neq("user_id",uid).maybeSingle(); if(m) otherIds.push(m.user_id);}}
    let pmap={};

    });
  }

  let pendingFiles=[];
  let recorder=null,recordChunks=[],recordStream=null;
  function previewFiles(files){pendingFiles=files.slice(0,6);const el=$("#attachmentPreview");if(!el)return;el.innerHTML=pendingFiles.length?`<div class="attachment-preview"><b>${pendingFiles.length} attachment${pendingFiles.length>1?'s':''}</b><span>${pendingFiles.map(f=>esc(f.name)).join(', ')}</span><button class="ghost" id="clearAttachments">Clear</button></div>`:'';$("#clearAttachments")?.addEventListener("click",()=>{pendingFiles=[];$("#mediaInput").value='';$("#attachmentPreview").innerHTML=''});}
  async function uploadFile(file,conversationId){
    if(!SUPABASE_READY)return null;
    const ext=(file.name.split('.').pop()||'bin').toLowerCase();
    const path=`${conversationId}/${state.user.id}/${crypto.randomUUID()}.${ext}`;
    const {error}=await sb.storage.from('tevlo-media').upload(path,file,{upsert:false,contentType:file.type||undefined});
    if(error)throw error;
    return path;
  }
  async function toggleRecorder(){
    if(recorder && recorder.state==='recording'){recorder.stop();return;}
    if(!navigator.mediaDevices?.getUserMedia){toast('Voice messages are not supported in this browser.');return;}
    try{
      recordStream=await navigator.mediaDevices.getUserMedia({audio:true});recordChunks=[];recorder=new MediaRecorder(recordStream);
      recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};
      recorder.onstop=async()=>{try{const blob=new Blob(recordChunks,{type:'audio/webm'});const f=new File([blob],`voice-${Date.now()}.webm`,{type:'audio/webm'});pendingFiles.push(f);previewFiles(pendingFiles);}finally{recordStream?.getTracks().forEach(t=>t.stop());recordStream=null;$("#recordBtn")?.classList.remove('recording');}};
      recorder.start();$("#recordBtn").classList.add('recording');toast('Recording voice message… tap 🎙 again to stop.');
    }catch(e){toast('Microphone permission was not granted.');}
  }

  async function getMediaUrl(path){

    return error?null:data?.signedUrl||null;
  }

        else if(url)content=`<a class="media-card file-card" href="${esc(url)}" target="_blank" rel="noopener"><span class="file-icon">↧</span><span>${esc(m.body||'File')}</span></a>`;

  async function sendCurrent(){
    const input=$("#composerText"), body=input.value.trim();
    const c=state.conversations.find(x=>x.id===state.active); if(!c)return;
    if(!body && !pendingFiles.length)return;
    if(body.length>4000){toast("Message is too long.");return}
    if(!SUPABASE_READY){
      const messageBody=body || pendingFiles.map(f=>`📎 ${f.name}`).join(' · ');

      (demoData.messages[c.id] ||= []).push(msg); c.last_message=messageBody;c.updated_at=msg.created_at;input.value='';delete state.drafts[c.id];localStorage.setItem('tevlo_drafts',JSON.stringify(state.drafts));pendingFiles=[];$("#attachmentPreview").innerHTML='';autoSize();state.messages.push(msg);renderMessages();renderConversationList();return;

        const ttl=state.disappear[c.id]||0;const expires_at=ttl?new Date(Date.now()+ttl*1000).toISOString():null;await sb.from('tevlo_messages').insert({conversation_id:c.id,sender_id:state.user.id,body:file.name,type,media_url:path,reply_to_id:state.replyTo||null,expires_at});
      }
      input.value='';delete state.drafts[c.id];localStorage.setItem('tevlo_drafts',JSON.stringify(state.drafts));pendingFiles=[];$("#attachmentPreview").innerHTML='';$("#mediaInput").value='';autoSize();state.replyTo=null;

  let typingTimer;

  function subscribeRealtime(){
    if(!SUPABASE_READY)return;
    if(state.channel)sb.removeChannel(state.channel);
    state.channel=sb.channel("tevlo-global", {config:{broadcast:{self:false}}})
      .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},payload=>{
        if(payload.new.conversation_id===state.active && payload.new.sender_id!==state.user.id){state.messages.push(payload.new);renderMessages();markRead(state.active)}else if(payload.new.sender_id!==state.user.id){state.unread.add(payload.new.conversation_id);pushNotification('New message','You received a new Tevlo message.')}const c=state.conversations.find(x=>x.id===payload.new.conversation_id);if(c){c.last_message=payload.new.body;c.updated_at=payload.new.created_at;renderConversationList();updateNotifBadge()}
      })
      .on("broadcast",{event:"typing"},payload=>{
        if(payload.payload?.user_id!==state.user?.id && state.active){
          $("#typingLabel").textContent="Typing…";clearTimeout(window.__typ);window.__typ=setTimeout(()=>$("#typingLabel").textContent="",1500);
        }
      }).subscribe();
  }

  async function markRead(conversationId){
    if(!SUPABASE_READY)return;
    await sb.from("tevlo_conversation_members").update({last_read_at:new Date().toISOString()}).eq("conversation_id",conversationId).eq("user_id",state.user.id);
  }

  async function markOnline(){
    if(!SUPABASE_READY||!state.user)return;
    await sb.from("profiles").update({last_seen:new Date().toISOString()}).eq("id",state.user.id);
    setInterval(()=>sb.from("profiles").update({last_seen:new Date().toISOString()}).eq("id",state.user.id),30000);
  }

  function persistList(key,list){state[key]=list;localStorage.setItem('tevlo_'+key,JSON.stringify(list))}
  function togglePin(id){persistList('pinned',state.pinned.includes(id)?state.pinned.filter(x=>x!==id):[...state.pinned,id]);renderApp();if(state.active)openConversation(id)}
  function toggleFavorite(id){persistList('favorites',state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id]);renderApp();if(state.active)openConversation(id)}
  function themeModal(c){showModal(`<div class="modal-head"><h2>Chat appearance</h2><button class="ghost" data-close>✕</button></div><p class="stat">Choose a theme for ${esc(c.name)}.</p><div class="theme-grid">${[['mint','Mint'],['forest','Forest'],['emerald','Emerald'],['sage','Sage'],['deep','Deep Green']].map(x=>`<button class="theme-choice theme-${x[0]}" data-theme="${x[0]}"><span></span><b>${x[1]}</b></button>`).join('')}</div>`);document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{state.chatThemes[c.id]=b.dataset.theme;localStorage.setItem('tevlo_chat_themes',JSON.stringify(state.chatThemes));closeModal();openConversation(c.id)})}
  function disappearModal(c){const cur=state.disappear[c.id]||0;showModal(`<div class="modal-head"><h2>Disappearing messages</h2><button class="ghost" data-close>✕</button></div><p class="stat">Choose how long new messages stay visible.</p><div class="choice-list">${[[0,'Off'],[300,'5 minutes'],[3600,'1 hour'],[86400,'1 day']].map(x=>`<button class="choice-row ${cur===x[0]?'selected':''}" data-disappear="${x[0]}">${x[1]}</button>`).join('')}</div>`);document.querySelectorAll('[data-disappear]').forEach(b=>b.onclick=()=>{state.disappear[c.id]=Number(b.dataset.disappear);localStorage.setItem('tevlo_disappear',JSON.stringify(state.disappear));closeModal();toast(b.textContent+' set.')})}
  function settingsModal(){showModal(`<div class="modal-head"><h2>Settings</h2><button class="ghost" data-close>✕</button></div><div class="settings-card"><div class="settings-row"><div><b>Online status</b><div class="stat">Show when you are online.</div></div><button class="switch ${state.online!==false?'on':''}" id="setOnline"></button></div><div class="settings-row"><div><b>Browser notifications</b><div class="stat">Get alerts for new messages.</div></div><button class="switch ${state.notifications?'on':''}" id="setNotify"></button></div><div class="settings-row"><div><b>Dark mode</b><div class="stat">Use a darker interface.</div></div><button class="switch ${localStorage.getItem('tevlo_dark')==='true'?'on':''}" id="setDark"></button></div><div class="settings-row"><div><b>Read receipts</b><div class="stat">Let friends know when you have read messages.</div></div><button class="switch ${state.readReceipts?'on':''}" id="setRead"></button></div><div class="settings-row"><div><b>Friend requests</b><div class="stat">Allow people to send you friend requests.</div></div><button class="switch ${state.allowRequests?'on':''}" id="setRequests"></button></div></div><button class="primary" id="settingsProfile">Open profile</button><button class="ghost auth-link" id="settingsSignout">Sign out</button>`);$('#setOnline').onclick=()=>{state.online=!state.online;localStorage.setItem('tevlo_online',String(state.online));location.reload()};$('#setNotify').onclick=async()=>{state.notifications=!state.notifications;localStorage.setItem('tevlo_notifications',String(state.notifications));if(state.notifications&&window.Notification?.permission==='default')await Notification.requestPermission();closeModal();toast(state.notifications?'Notifications enabled.':'Notifications disabled.')};$('#setDark').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('tevlo_dark',String(document.body.classList.contains('dark')));closeModal()};$('#setRead').onclick=()=>{state.readReceipts=!state.readReceipts;localStorage.setItem('tevlo_read_receipts',String(state.readReceipts));closeModal();toast(state.readReceipts?'Read receipts enabled.':'Read receipts disabled.')};$('#setRequests').onclick=()=>{state.allowRequests=!state.allowRequests;localStorage.setItem('tevlo_allow_requests',String(state.allowRequests));closeModal();toast(state.allowRequests?'Friend requests enabled.':'Friend requests disabled.')};$('#settingsProfile').onclick=()=>{closeModal();profileModal()};$('#settingsSignout').onclick=async()=>{if(SUPABASE_READY)await sb.auth.signOut();location.reload()}}
  function pushNotification(title,body){state.notificationsList.unshift({id:Date.now(),title,body,at:new Date().toISOString()});state.notificationsList=state.notificationsList.slice(0,30);localStorage.setItem('tevlo_notifications_list',JSON.stringify(state.notificationsList));if(state.notifications&&window.Notification?.permission==='granted')new Notification(title,{body})}
  function updateNotifBadge(){const el=$('#notifBadge');if(el){const n=state.notificationsList.length;el.textContent=n>9?'9+':(n||'');el.style.display=n?'grid':'none'}}
  function notificationsModal(){showModal(`<div class="modal-head"><h2>Notifications</h2><button class="ghost" data-close>✕</button></div><div class="notification-list">${state.notificationsList.length?state.notificationsList.map(n=>`<div class="notification-row"><div class="notif-dot">•</div><div><b>${esc(n.title)}</b><div class="stat">${esc(n.body)}</div><small>${fmtTime(n.at)}</small></div></div>`).join(''):`<div class="empty" style="height:180px"><div>No notifications yet.</div></div>`}</div><button class="ghost auth-link" id="clearNotifications">Clear all</button>`);$('#clearNotifications').onclick=()=>{state.notificationsList=[];localStorage.removeItem('tevlo_notifications_list');closeModal();updateNotifBadge()}}

  function peopleModal(){
    showModal(`<div class="modal-head"><h2>Find people</h2><button class="ghost" data-close>✕</button></div>
      <label>Search by name</label><input id="peopleSearch" placeholder="Search for a friend">
      <div id="peopleResults" style="margin-top:10px"></div>`);
    const render=async()=>{
      const q=$("#peopleSearch").value.trim();
      if(q.length<2){$("#peopleResults").innerHTML=`<div class="stat">Type at least 2 letters.</div>`;return;}
      if(!SUPABASE_READY){
        const results=demoData.people.filter(x=>x.id!=="me"&&x.name.toLowerCase().includes(q.toLowerCase()));
        $("#peopleResults").innerHTML=results.length?results.map(x=>`<div class="user-result">${avatarHtml(x)}<div class="grow"><b>${esc(x.name)}</b><div class="stat">${esc(x.bio||"")}</div></div><button class="secondary" data-friend="${x.id}">Add friend</button></div>`).join(""):`<div class="stat">No people found.</div>`;
        return;
      }
      const {data,error}=await sb.from("profiles").select("*").ilike("real_name",`%${q}%`).neq("id",state.user.id).limit(20);
      if(error){$("#peopleResults").innerHTML=`<div class="error">${esc(error.message)}</div>`;return;}
      const friendSet=new Set(state.friends||[]);
      $("#peopleResults").innerHTML=(data||[]).length?(data||[]).map(x=>{
        const label=friendSet.has(x.id)?"Friends":"Add friend";
        return `<div class="user-result">${avatarHtml(x)}<div class="grow"><b>${esc(x.name)}</b><div class="stat">${esc(x.bio||"")}</div></div><button class="secondary" data-friend="${x.id}" ${friendSet.has(x.id)?"disabled":""}>${label}</button></div>`;
      }).join(""):`<div class="stat">No people found.</div>`;
    };
    $("#peopleSearch").oninput=render;
    $("#peopleResults").onclick=async e=>{
      const b=e.target.closest("[data-friend]"); if(!b || b.disabled)return;
      const id=b.dataset.friend;
      if(!state.allowRequests){toast('Friend requests are disabled in Settings.');return}
      if(!SUPABASE_READY){toast("Preview mode: connect Supabase to send requests.");return;}
      const {error}=await sb.from("tevlo_friendships").insert({requester_id:state.user.id,addressee_id:id,status:"pending"});
      if(error)toast(error.message);else{toast("Friend request sent.");b.disabled=true;b.textContent="Requested";}
    };
    render();
  }

  function newChatModal(){
    showModal(`<div class="modal-head"><h2>New message</h2><button class="ghost" data-close>✕</button></div>
      <label>Find anyone on Tevlo</label><input id="friendSearch" placeholder="Search by name">
      <div id="friendResults" style="margin-top:10px"></div>
      <div class="settings-section"><b>Create group</b><p class="stat">Groups can contain you plus up to 19 friends.</p><button class="secondary" id="createGroupBtn">Create group</button></div>`);
    const render=async()=>{
      const q=$("#friendSearch").value.trim();
      if(q.length<2){$("#friendResults").innerHTML=`<div class="stat">Type at least 2 letters to find someone.</div>`;return;}
      if(!SUPABASE_READY){
        const results=demoData.people.filter(x=>x.id!=="me"&&x.name.toLowerCase().includes(q.toLowerCase()));
        $("#friendResults").innerHTML=results.length?results.map(p=>`<div class="user-result" data-person="${p.id}">${avatarHtml(p)}<div class="grow"><b>${esc(p.name)}</b><div class="stat">${esc(p.bio||"")}</div></div><button class="secondary">Message</button></div>`).join(""):`<div class="stat">No people found.</div>`;return;
      }
      const {data,error}=await sb.from("profiles").select("*").ilike("real_name",`%${q}%`).neq("id",state.user.id).limit(20);
      if(error){$("#friendResults").innerHTML=`<div class="error">${esc(error.message)}</div>`;return;}
      $("#friendResults").innerHTML=(data||[]).length?(data||[]).map(p=>`<div class="user-result" data-person="${p.id}">${avatarHtml({...p,name:p.real_name})}<div class="grow"><b>${esc(p.real_name||"Tevlo user")}</b><div class="stat">${esc(p.bio||"")}</div></div><button class="secondary">Message</button></div>`).join(""):`<div class="stat">No people found.</div>`;
    };
    $("#friendSearch").oninput=render;render();
    $("#friendResults").onclick=e=>{const el=e.target.closest("[data-person]");if(el)startConversation(el.dataset.person)};
    $("#createGroupBtn").onclick=groupModal;
  }

  async function startConversation(personId){
    closeModal();
    const person=state.peopleById?.[personId];
    if(!SUPABASE_READY){
      let c=state.conversations.find(x=>x.friend_id===personId);
      if(!c){c={id:"demo-"+Date.now(),name:person.name,friend_id:personId,is_group:false,last_message:"",updated_at:new Date().toISOString(),profile:person};state.conversations.unshift(c);demoData.messages[c.id]=[]}
      state.active=c.id;renderConversationList();openConversation(c.id);return;
    }
    const {data,error}=await sb.rpc("tevlo_create_direct_conversation",{friend_user_id:personId});
    if(error){toast(error.message);return}
    await loadConversations();const c=state.conversations.find(x=>x.id===data);if(c)openConversation(c.id);
  }

  function groupModal(){
    showModal(`<div class="modal-head"><h2>Create group</h2><button class="ghost" data-close>✕</button></div>
      <label>Group name</label><input id="groupName" placeholder="Weekend plans">
      <label>Choose friends</label><div id="groupFriends"></div><button class="primary" id="createGroup" style="margin-top:14px">Create group</button>`);
    $("#groupFriends").innerHTML=state.friends.map(id=>{const p=state.peopleById?.[id];return p?`<label class="friend-row"><input type="checkbox" value="${p.id}" style="width:auto"><span>${avatarHtml(p,false)}<b>${esc(p.name)}</b></label>`:""}).join("");
    $("#groupFriends").addEventListener('change',e=>{const checked=[...document.querySelectorAll('#groupFriends input:checked')]; if(checked.length>19){e.target.checked=false;toast('Groups can have up to 20 people total.');}});
    $("#createGroup").onclick=async()=>{
      const name=$("#groupName").value.trim()||"New group";
      const members=[...document.querySelectorAll("#groupFriends input:checked")].map(x=>x.value);
      if(!members.length){toast("Pick at least one friend.");return}
      if(members.length>19){toast("Groups can have up to 20 people total.");return}
      if(!SUPABASE_READY){toast("Connect Supabase to create real groups.");return}
      const {data,error}=await sb.rpc("tevlo_create_group_conversation",{group_name:name,member_ids:members});
      if(error){toast(error.message);return}
      closeModal();await loadConversations();openConversation(data);
    };
  }

  async function requestsModal(){
    showModal(`<div class="modal-head"><h2>Friend requests</h2><button class="ghost" data-close>✕</button></div><div id="requestList"></div>`);
    if(!state.requests.length){$("#requestList").innerHTML=`<div class="stat">No pending requests.</div>`;return}
    if(!SUPABASE_READY){$("#requestList").innerHTML=`<div class="stat">Preview mode has no real requests.</div>`;return}
    const ids=state.requests.map(r=>r.requester_id);
    const {data:p}=await sb.from("profiles").select("*").in("id",ids);const map=Object.fromEntries((p||[]).map(x=>[x.id,{...x,name:x.real_name}]));
    $("#requestList").innerHTML=state.requests.map(r=>{const p=map[r.requester_id];return `<div class="user-result">${avatarHtml(p)}<div class="grow"><b>${esc(p?.name||"Someone")}</b><div class="stat">Wants to be your friend</div></div><button class="secondary" data-accept="${r.id}">Accept</button></div>`}).join("");
    $("#requestList").onclick=async e=>{const b=e.target.closest("[data-accept]");if(!b)return;const {error}=await sb.from("tevlo_friendships").update({status:"accepted"}).eq("id",b.dataset.accept);if(error)toast(error.message);else{toast("Friend added.");closeModal();await loadFriends();await loadConversations();renderApp();}};
  }

  function profileModal(){
    const p=state.profile||{};
    showModal(`<div class="modal-head"><h2>Profile</h2><button class="ghost" data-close>✕</button></div>
      <div class="profile-cover"><div class="profile-avatar-wrap">${avatarHtml(p,true,state.online!==false)}</div></div>
      <div class="profile-body"><h3 style="margin:0 0 4px">${esc(p.name)}</h3><div class="stat">${p.username?`@${esc(p.username)} · `:""}${esc(p.email||"")}</div><div class="stat">${state.friends?.length||0} friends</div></div>
      <label>Display name</label><input id="pName" value="${esc(p.name||"")}">
      <label>Username</label><input id="pUsername" value="${esc(p.username||"")}" placeholder="yourusername" maxlength="30">
      <label>Profile photo URL</label><input id="pAvatar" value="${esc(p.avatar_url||"")}" placeholder="https://…">
      <label>Bio</label><textarea id="pBio" rows="3">${esc(p.bio||"")}</textarea>
      <div class="settings-card"><div class="settings-row"><span class="status-choice"><span class="status-dot ${state.online===false?'offline':''}"></span> Show me as online</span><button class="switch ${state.online!==false?'on':''}" id="onlineSwitch" aria-label="Toggle online status"></button></div>
      <div class="settings-row"><span>Browser notifications</span><button class="switch ${state.notifications?'on':''}" id="notifySwitch" aria-label="Toggle notifications"></button></div></div>
      <button class="primary" id="saveProfile">Save changes</button>`);
    $("#onlineSwitch").onclick=()=>{state.online=state.online===false?true:false;$("#onlineSwitch").classList.toggle('on',state.online);document.querySelector('.status-dot')?.classList.toggle('offline',!state.online)};
    $("#notifySwitch").onclick=async()=>{state.notifications=!state.notifications;$("#notifySwitch").classList.toggle('on',state.notifications); if(state.notifications && window.Notification?.permission==='default') await window.Notification.requestPermission();};
    $("#saveProfile").onclick=async()=>{localStorage.setItem('tevlo_online',String(state.online));localStorage.setItem('tevlo_notifications',String(state.notifications));
      const name=$("#pName").value.trim();const username=$("#pUsername").value.trim().replace(/^@/,"");const avatar_url=$("#pAvatar").value.trim();const bio=$("#pBio").value.trim();
      if(!name){toast("Name is required.");return}
      if(username && !/^[a-zA-Z0-9_.-]{2,30}$/.test(username)){toast("Username can use letters, numbers, dots, dashes, and underscores.");return}
      if(!SUPABASE_READY){state.profile={...state.profile,name,username,avatar_url,bio};closeModal();renderApp();return}
      const {error}=await sb.from("profiles").update({real_name:name,username:username||null,avatar_url,bio}).eq("id",state.user.id);
      if(error){toast(error.code==='23505'?'That username is already taken.':error.message);return}
      state.profile={...state.profile,name,username,avatar_url,bio};toast("Profile saved.");closeModal();renderApp();
    };
  }

  async function removeFriend(c){
    if(!SUPABASE_READY){toast("Preview mode.");return}
    if(!confirm(`Remove ${c.name} as a friend?`))return;
    const other=c.profile?.id; if(!other)return;
    const {error}=await sb.from("tevlo_friendships").delete().or(`and(requester_id.eq.${state.user.id},addressee_id.eq.${other}),and(requester_id.eq.${other},addressee_id.eq.${state.user.id})`);
    if(error)toast(error.message);else{toast("Friend removed.");await loadFriends();await loadConversations();renderApp()}
  }
  async function blockUser(c){if(!SUPABASE_READY){toast("Preview mode.");return} const other=c.profile?.id;if(!other)return;const {error}=await sb.from("tevlo_blocks").upsert({blocker_id:state.user.id,blocked_id:other});if(error)toast(error.message);else toast("User blocked.");}
  async function reportUser(c){if(!SUPABASE_READY){toast("Preview mode.");return} const other=c.profile?.id;if(!other)return;const reason=prompt("Why are you reporting this user?")||"";const {error}=await sb.from("tevlo_reports").insert({reporter_id:state.user.id,reported_id:other,reason:reason.slice(0,500)});toast(error?"Could not submit report.":"Report submitted.");}

  async function messageActions(msgId){
    const m=state.messages.find(x=>x.id===msgId); if(!m || m.sender_id!==state.user?.id)return;
    const age=Date.now()-new Date(m.created_at).getTime();
    if(age>15*60*1000){toast("Messages can only be edited for 15 minutes.");return;}
    const action=prompt("Type EDIT to edit, or DELETE to delete this message.");
    if(!action)return;
    if(action.toUpperCase()==="DELETE"){
      if(!confirm("Delete this message for everyone?"))return;
      if(SUPABASE_READY){
        const {error}=await sb.from("tevlo_messages").update({body:"Message deleted",deleted_at:new Date().toISOString()}).eq("id",msgId).eq("sender_id",state.user.id);
        if(error){toast(error.message);return}
        const idx=state.messages.findIndex(x=>x.id===msgId); if(idx>=0)state.messages[idx].body="Message deleted";
      }else{
        m.body="Message deleted";
      }
      renderMessages();return;
    }
    if(action.toUpperCase()==="EDIT"){
      const next=prompt("Edit your message:",m.body);
      if(next===null)return;
      const body=next.trim();if(!body)return;
      if(SUPABASE_READY){
        const {error}=await sb.from("tevlo_messages").update({body,edited_at:new Date().toISOString()}).eq("id",msgId).eq("sender_id",state.user.id);
        if(error){toast(error.message);return}
      }
      m.body=body;m.edited_at=new Date().toISOString();renderMessages();
    }
  }

  function showReactionPicker(msgId){
    const old=$(".reaction-pop"); old?.remove();
    const p=document.createElement("div");p.className="reaction-pop";p.style.cssText="position:fixed;z-index:70;background:white;border:1px solid #e2e8e8;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.12);padding:6px;display:flex;gap:4px";
    p.innerHTML=["❤️","😂","👍","😮","😢","🎉"].map(x=>`<button style="background:#f4f7f7;border-radius:10px;padding:7px" data-react="${x}">${x}</button>`).join("");
    document.body.appendChild(p);const el=document.querySelector(`[data-msg="${CSS.escape(msgId)}"]`);const r=el?.getBoundingClientRect();p.style.left=(r?Math.min(r.left,innerWidth-250):100)+"px";p.style.top=(r?Math.max(10,r.top-52):100)+"px";
    p.onclick=async e=>{const x=e.target.dataset.react;if(!x)return;if(SUPABASE_READY){const {error}=await sb.from("tevlo_message_reactions").upsert({message_id:msgId,user_id:state.user.id,reaction:x});if(error)toast(error.message)}toast(x);p.remove()};
    setTimeout(()=>document.addEventListener("click",()=>p.remove(),{once:true}),0);
  }

  function showModal(inner){
    const b=document.createElement("div");b.className="modal-backdrop";b.id="modal";b.innerHTML=`<div class="modal">${inner}</div>`;document.body.appendChild(b);
    b.querySelector("[data-close]")?.addEventListener("click",closeModal);b.addEventListener("click",e=>{if(e.target===b)closeModal()});
  }
  function closeModal(){$("#modal")?.remove()}

  function setup(){
    if(!SUPABASE_READY){renderAuth("login","Tevlo could not connect to its login service. Refresh the page and try again.");return;}
    if(localStorage.getItem('tevlo_dark')==='true')document.body.classList.add('dark');
    state.notifications=localStorage.getItem('tevlo_notifications')==='true';
    if(!SUPABASE_READY){state.user=demoData.profile;state.profile={...demoData.profile,name:demoData.profile.name,email:demoData.profile.email};state.friends=demoData.friends;state.peopleById=Object.fromEntries(demoData.people.map(p=>[p.id,p]));state.conversations=demoData.conversations;renderAuth();return}
    sb.auth.getSession().then(async({data})=>{if(data.session)await afterAuth(data.session.user);else renderAuth()});
    sb.auth.onAuthStateChange(async(event,session)=>{if(event==="SIGNED_IN"&&session)await afterAuth(session.user)});
  }

  setup();
})();
</script>
</body>
</html>
