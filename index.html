lign-items:flex-end}.composer textarea{resize:none;max-height:140px;border:0;background:#eef5f1;border-radius:20px;padding:12px 14px;flex:1}.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}.send{background:var(--teal);color:#fff;font-size:18px}.attach{background:#e9f5ef;color:var(--teal)}.emoji-panel,.sticker-panel{position:absolute;bottom:66px;left:12px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px;padding:10px;display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.picker-wrap{position:relative}.emoji-panel button,.sticker-panel button{background:#f5f8f8;border-radius:10px;padding:8px}.modal-backdrop{position:fixed;inset:0;background:rgba(10,20,20,.35);display:grid;place-items:center;padding:18px;z-index:30}.modal{width:min(680px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:24px;padding:22px;box-shadow:0 18px 60px rgba(18,54,39,.16)}.modal h2{margin:0 0 12px}.modal-head{display:flex;justify-content:space-between;align-items:center}.user-result,.friend-row{display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px}.user-result:hover,.friend-row:hover{background:#f5f8f8}.grow{flex:1}.profile-grid{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center}.big-avatar{width:120px;height:120px;border-radius:32px}.stat{font-size:13px;color:var(--muted)}.settings-section{padding:14px 0;border-top:1px solid var(--line)}.settings-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0}.chat-menu{position:absolute;right:14px;top:62px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px rgba(18,54,39,.14);padding:6px;z-index:10}.chat-menu button{display:block;width:100%;text-align:left;padding:10px 12px;background:#fff;border-radius:10px}.chat-menu button:hover{background:#f3f7f7}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#172525;color:#fff;padding:11px 15p <script>
(()=>{
const SUPABASE_URL="https://kcybwrdtnlflevndmzfn.supabase.co";
const SUPABASE_KEY="sb_publishable_XhOq8P5tdMgjWDKZEvgsgg_hcALWg48";
let sb=null;
const root=document.getElementById('root');
const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),initials=n=>(String(n||"?").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"?"),fmtTime=d=>new Intl.DateTimeFormat([], {hour:'numeric',minute:'2-digit'}).format(new Date(d));
let state={user:null,profile:null,conversations:[],active:null,messages:[],friends:[],requests:[],peopleById:{},typing:false,channel:null,search:"",online:true,notifications:false,filter:'all',pinned:new Set(JSON.parse(localStorage.getItem('tevlo_pinned')||'[]')),favorites:new Set(JSON.parse(localStorage.getItem('tevlo_favorites')||'[]')),drafts:JSON.parse(localStorage.getItem('tevlo_drafts')||'{}'),replyTo:null,attachment:null};
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}
function avatarHtml(p,big=false,online=false){const cl=big?'avatar big-avatar':'avatar';return `<div class="${cl}">${p?.avatar_url?`<img src="${esc(p.avatar_url)}" alt="">`:esc(initials(p?.name||p?.real_name))}${online?'<span class="online-dot"></span>':''}</div>`}
function renderAuth(mode='login',message=''){root.innerHTML=`<div class="auth-wrap"><div class="auth-card"><div class="logo">Tevlo</div><div class="tagline">Private conversations. Beautifully simple.</div><div class="tabs"><button class="tab ${mode==='login'?'active':''}" id="loginTab">Log in</button><button class="tab ${mode==='signup'?'active':''}" id="signupTab">Create account</button></div><form id="authForm">${mode==='signup'?'<label>Name</label><input id="name" autocomplete="name" required placeholder="Your name">':''}<label>Email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><label>Password</label><input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="At least 6 characters"><button class="primary">${mode==='login'?'Log in':'Create account'}</button>${mode==='login'?'<button type="button" class="ghost" id="forgot" style="width:100%;margin-top:8px">Forgot password?</button>':''}${message?`<div class="${message.startsWith('Success')?'info':'error'}">${esc(message)}</div>`:''}</form></div></div>`;$('#loginTab').onclick=()=>renderAuth('login');$('#signupTab').onclick=()=>renderAuth('signup');$('#forgot')?.addEventListener('click',forgotPassword);$('#authForm').onsubmit=e=>{e.preventDefault();mode==='login'?login():signup()}}
async function login(){const email=$('#email').value.trim(),password=$('#password').value;setBusy(true);const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){setBusy(false);renderAuth('login','Login failed. Check your email and password.');return}await afterAuth(data.user)}
async function signup(){const name=$('#name').value.trim(),email=$('#email').value.trim(),password=$('#password').value;if(!name){renderAuth('signup','Please enter your name.');return}setBusy(true);const {data,error}=await sb.auth.signUp({email,password,options:{data:{name}}});if(error){setBusy(false);renderAuth('signup',error.message);return}if(data.user&&!data.session){renderAuth('login','Success: check your email for a confirmation link, then log in.');return}if(data.user)await afterAuth(data.user)}
async function forgotPassword(){const email=$('#email')?.value.trim();if(!email){toast('Enter your email first.');return}const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href});toast(error?'Could not send reset email.':'Password reset email sent.')}
function setBusy(b){const btn=$('.primary');if(btn)btn.disabled=b}
async function afterAuth(user){state.user=user;const {data:p,error}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(error){toast(error.message);renderAuth();return}if(!p){const nm=user.user_metadata?.name||user.email?.split('@')[0]||'New user';const base=nm.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,24)||'user';const ins=await sb.from('profiles').insert({id:user.id,username:base+'_'+user.id.slice(0,8),real_name:nm,avatar_url:'',bio:'',last_seen:new Date().toISOString(),online:true,account_type:'real'});if(ins.error){toast(ins.error.message);return}state.profile={id:user.id,username:base+'_'+user.id.slice(0,8),real_name:nm,avatar_url:'',bio:''}}else state.profile=p;await loadFriends();await loadConversations();subscribeRealtime();await markOnline();renderApp()}
async function loadFriends(){const uid=state.user.id;const {data}=await sb.from('tevlo_friendships').select('id,requester_id,addressee_id,status').or(`requester_id.eq.${uid},addressee_id.eq.${uid}`).eq('status','accepted');const ids=(data||[]).map(x=>x.requester_id===uid?x.addressee_id:x.requester_id);const {data:p}=ids.length?await sb.from('profiles').select('*').in('id',ids):{data:[]};state.peopleById=Object.fromEntries((p||[]).map(x=>[x.id,{...x,name:x.real_name}]));state.friends=ids;const {data:req}=await sb.from('tevlo_friendships').select('id,requester_id,addressee_id,status,created_at').eq('addressee_id',uid).eq('status','pending');state.requests=req||[]}
async function loadConversations(){const uid=state.user.id;const {data:members,error}=await sb.from('tevlo_conversation_members').select('conversation_id,last_read_at').eq('user_id',uid);if(error){toast(error.message);return}const ids=(members||[]).map(x=>x.conversation_id);if(!ids.length){state.conversations=[];return}const {data:convs}=await sb.from('tevlo_conversations').select('*').in('id',ids).order('updated_at',{ascending:false});const otherIds=[];for(const c of convs||[]){if(!c.is_group){const {data:m}=await sb.from('tevlo_conversation_members').select('user_id').eq('conversation_id',c.id).neq('user_id',uid).maybeSingle();if(m)otherIds.push(m.user_id)}}const {data:p}=otherIds.length?await sb.from('profiles').select('*').in('id',otherIds):{data:[]};const pmap=Object.fromEntries((p||[]).map(x=>[x.id,{...x,name:x.real_name}]));state.conversations=(convs||[]).map(c=>c.is_group?{...c,name:c.name||'Group chat',profile:null}:{...c,profile:pmap[c.other_user_id]||null,name:pmap[c.other_user_id]?.name||'Conversation'})}
function renderApp(){root.innerHTML=`<div class="app"><div class="shell" id="shell"><aside class="sidebar"><div class="side-head"><div><div class="side-title">Tevlo</div><div class="stat">Messages</div></div><div style="display:flex;gap:6px"><button class="icon-btn" id="peopleBtn" title="Find people">👥</button><button class="icon-btn" id="newChat" title="New message">✎</button></div></div><div class="search-wrap"><input id="searchPeople" placeholder="Search conversations or people"></div>${state.requests.length?`<div class="requests"><button class="request-banner" id="requestsBtn"><span>Friend requests</span><b>${state.requests.length}</b></button></div>`:''}<div style="padding:0 14px 8px;display:flex;gap:6px;flex-wrap:wrap">${['all','unread','groups','favorites'].map(x=>`<button class="ghost filterBtn" data-filter="${x}" style="background:${state.filter===x?'#e9f5ef':'transparent'};color:${state.filter===x?'var(--teal)':'var(--muted)'}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><div class="conversation-list" id="conversationList"></div><div style="padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px"><button class="secondary" id="profileBtn" style="flex:1;text-align:left">👤 ${esc(state.profile?.real_name||state.profile?.username||'Profile')}</button><button class="ghost" id="settingsBtn">⚙</button><button class="ghost" id="signoutBtn">Sign out</button></div></aside><main class="main" id="mainPane"><div class="empty"><div class="empty-card"><div class="empty-icon">💬</div><h2 style="color:var(--text);margin-bottom:8px">Your messages</h2><p>Choose a conversation or start a new one. Tevlo keeps your conversations organized, private, and easy to use.</p><button class="primary" id="emptyNew" style="width:auto">New message</button></div></div></main></div></div>`;$('#conversationList').addEventListener('click',e=>{const el=e.target.closest('[data-conv]');if(el)openConversation(el.dataset.conv)});$('#searchPeople').oninput=e=>{state.search=e.target.value.toLowerCase();renderConversationList()};$('#newChat').onclick=newChatModal;$('#emptyNew').onclick=newChatModal;$('#peopleBtn').onclick=peopleModal;$('#profileBtn').onclick=profileModal;$('#settingsBtn').onclick=settingsModal;$('#signoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};$('#requestsBtn')?.addEventListener('click',requestsModal);document.querySelectorAll('.filterBtn').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;renderConversationList()});renderConversationList()}
function renderConversationList(){const q=state.search||'';let list=(state.conversations||[]).filter(c=>c.name?.toLowerCase().includes(q));if(state.filter==='groups')list=list.filter(c=>c.is_group);if(state.filter==='favorites')list=list.filter(c=>state.favorites.has(c.id));if(state.filter==='unread')list=list.filter(c=>c.unread_count>0);list.sort((a,b)=>(state.pinned.has(b.id)-state.pinned.has(a.id))||new Date(b.updated_at||0)-new Date(a.updated_at||0));$('#conversationList').innerHTML=list.length?list.map(c=>`<div class="conv ${state.active===c.id?'active':''}" data-conv="${c.id}">${c.profile?avatarHtml(c.profile,false,true):avatarHtml({name:c.name})}<div class="conv-body"><div class="conv-top"><div class="conv-name">${state.pinned.has(c.id)?'📌 ':''}${state.favorites.has(c.id)?'★ ':''}${esc(c.name)}</div><div class="conv-time">${c.updated_at?fmtTime(c.updated_at):''}</div></div><div class="conv-preview">${esc(c.last_message||'No messages yet')}</div></div></div>`).join(''):`<div class="empty" style="height:240px"><div><div style="font-size:34px">🌿</div><p>${q?'No matches':'No conversations yet.'}</p></div></div>`}
async function openConversation(id){state.active=id;document.querySelector('.shell')?.classList.add('chat-open');renderConversationList();const c=state.conversations.find(x=>x.id===id);if(!c)return;const {data,error}=await sb.from('tevlo_messages').select('*').eq('conversation_id',id).is('deleted_at',null).order('created_at',{ascending:true});if(error){toast(error.message);return}state.messages=(data||[]).filter(m=>!m.expires_at||new Date(m.expires_at)>new Date());state.replyTo=null;state.attachment=null;renderChat(c);await markRead(id)}
function renderChat(c){const profile=c.profile;root.querySelector('#mainPane').innerHTML=`<div style="position:relative;height:100%;display:flex;flex-direction:column"><header class="chat-head"><button class="icon-btn mobile-only" id="backBtn">‹</button>${profile?avatarHtml(profile,false,true):avatarHtml({name:c.name})}<div><div class="chat-title">${esc(c.name)}</div><div class="chat-sub">${c.is_group?'Group chat':'Online'}</div></div><div class="head-actions"><button class="ghost" id="chatSearchBtn" title="Search">⌕</button><button class="ghost" id="chatThemeBtn" title="Theme">🎨</button><button class="ghost" id="chatMenuBtn">•••</button></div><div class="chat-menu hidden" id="chatMenu"><button id="pinChat">${state.pinned.has(c.id)?'📌 Unpin':'📌 Pin'} conversation</button><button id="favoriteChat">${state.favorites.has(c.id)?'★ Remove favorite':'★ Add favorite'}</button><button id="muteChat">🔕 Mute conversation</button>${!c.is_group?'<button id="removeFriend">👤 Remove friend</button><button id="blockUser">🚫 Block</button><button id="reportUser">⚑ Report</button>':''}</div></header><div class="messages" id="messages"></div><div class="typing" id="typingLabel"></div><div id="attachmentPreview"></div><div class="composer"><div class="picker-wrap"><button class="round attach" id="plusBtn">＋</button><div class="emoji-panel hidden" id="emojiPanel">${['😀','😂','😍','🥹','👍','❤️','😭','😮','🎉','✨','😊','🙌','🔥','👏','💚','🌿','😎','🤗'].map(x=>`<button data-emoji="${x}">${x}</button>`).join('')}</div></div><textarea id="composerText" rows="1" placeholder="Message"></textarea><div class="picker-wrap"><button class="round attach" id="emojiBtn">☺</button><div class="sticker-panel hidden" id="stickerPanel">${['💚','💬','✨','😊','😂','🙌','🌟','🎉','🫶','👍','💫','🐶'].map(x=>`<button data-sticker="${x}">${x}</button>`).join('')}</div></div><button class="round attach" id="mediaBtn" title="Attach photo, video, or file">📎</button><button class="round attach" id="voiceBtn" title="Voice message">🎙</button><button class="round send" id="sendBtn">↑</button><input type="file" id="mediaInput" class="media-input" accept="image/*,video/*,audio/*,.pdf,.txt,.doc,.docx,.zip"></div></div>`;renderMessages();$('#backBtn')?.addEventListener('click',()=>document.querySelector('.shell').classList.remove('chat-open'));$('#sendBtn').onclick=sendCurrent;$('#composerText').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendCurrent()}});$('#composerText').addEventListener('input',()=>{autoSize();saveDraft();sendTyping()});$('#composerText').value=state.drafts[c.id]||'';autoSize();$('#plusBtn').onclick=()=>{$('#emojiPanel').classList.toggle('hidden');$('#stickerPanel').classList.add('hidden')};$('#emojiBtn').onclick=()=>{$('#stickerPanel').classList.toggle('hidden');$('#emojiPanel').classList.add('hidden')};$('#emojiPanel').onclick=e=>{const x=e.target.dataset.emoji;if(x){insertText(x);$('#emojiPanel').classList.add('hidden')}};$('#stickerPanel').onclick=e=>{const x=e.target.dataset.sticker;if(x){insertText(x);$('#stickerPanel').classList.add('hidden')}};$('#mediaBtn').onclick=()=>$('#mediaInput').click();$('#mediaInput').onchange=e=>prepareAttachment(e.target.files[0]);$('#voiceBtn').onclick=startVoice;$('#chatMenuBtn').onclick=()=>$('#chatMenu').classList.toggle('hidden');$('#pinChat').onclick=()=>toggleSet(state.pinned,c.id,'pinned');$('#favoriteChat').onclick=()=>toggleSet(state.favorites,c.id,'favorites');$('#muteChat').onclick=()=>{toast('Conversation muted.');closeMenu()};$('#removeFriend')?.addEventListener('click',()=>removeFriend(c));$('#blockUser')?.addEventListener('click',()=>blockUser(c));$('#reportUser')?.addEventListener('click',()=>reportUser(c));$('#chatSearchBtn').onclick=()=>searchMessages(c);$('#chatThemeBtn').onclick=()=>chatThemeModal(c)}
function autoSize(){const t=$('#composerText');if(!t)return;t.style.height='auto';t.style.height=Math.min(140,t.scrollHeight)+'px'}
function insertText(x){const t=$('#composerText');t.value+=x;t.focus();autoSize();saveDraft()}
function saveDraft(){const c=state.conversations.find(x=>x.id===state.active);if(!c)return;const v=$('#composerText')?.value||'';state.drafts[c.id]=v;localStorage.setItem('tevlo_drafts',JSON.stringify(state.drafts))}
function renderMessages(){const wrap=$('#messages');if(!wrap)return;if(!state.messages.length){wrap.innerHTML=`<div class="empty" style="height:100%"><div><div class="empty-icon">🌿</div><h3>Start the conversation</h3><p>Say hello and send your first message.</p></div></div>`;return}wrap.innerHTML=state.messages.map(m=>{const mine=m.sender_id===state.user?.id;const status=mine?(m.read_at?'✓✓ Read':m.delivered_at?'✓✓ Delivered':'✓ Sent'):'';let content='';if(m.type==='image'&&m.media_url)content=`<div class="media-card"><img src="${esc(m.media_url)}" alt="Shared image"></div>`;else if(m.type==='video'&&m.media_url)content=`<div class="media-card"><video src="${esc(m.media_url)}" controls></video></div>`;else if(m.type==='audio'&&m.media_url)content=`<div class="media-card audio-card"><audio src="${esc(m.media_url)}" controls></audio></div>`;else if(m.type==='file'&&m.media_url)content=`<div class="media-card file-card"><div class="file-icon">📎</div><div><b>${esc(m.body||'Shared file')}</b><div class="stat">File attachment</div></div></div>`;else content=esc(m.body||'');const expire=m.expires_at?` · disappears ${fmtTime(m.expires_at)}`:'';return `<div class="row ${mine?'mine':'theirs'}" data-msg="${m.id}"><div><div class="bubble">${m.reply_to_id?'<div class="reply-chip">Replying to a message</div>':''}${content}</div><div class="meta">${fmtTime(m.created_at)}${m.edited_at?' · edited':''}${expire} ${status}</div></div></div>`}).join('');wrap.scrollTop=wrap.scrollHeight}
async function sendCurrent(){const input=$('#composerText'),body=input.value.trim();if(!body&&!state.attachment)return;const c=state.conversations.find(x=>x.id===state.active);if(!c)return;const type=state.attachment?.typeGroup||'text';let mediaUrl=state.attachment?.url||null;let expiresAt=null;const ttl=localStorage.getItem('tevlo_expiry_'+c.id);if(ttl)expiresAt=new Date(Date.now()+Number(ttl)*60000).toISOString();const payload={conversation_id:c.id,sender_id:state.user.id,body:body.slice(0,4000)||state.attachment?.name||'',type,media_url:mediaUrl,reply_to_id:state.replyTo||null,expires_at:expiresAt};const {error}=await sb.from('tevlo_messages').insert(payload);if(error){toast(error.message);return}input.value='';state.replyTo=null;state.attachment=null;delete state.drafts[c.id];localStorage.setItem('tevlo_drafts',JSON.stringify(state.drafts));$('#attachmentPreview').innerHTML='';autoSize();await openConversation(c.id)}
function prepareAttachment(file){if(!file)return;state.attachment={file,typeGroup:file.type.startsWith('image/')?'image':file.type.startsWith('video/')?'video':file.type.startsWith('audio/')?'audio':'file',name:file.name,url:URL.createObjectURL(file)};$('#attachmentPreview').innerHTML=`<div class="attachment-preview"><span>📎</span><b>${esc(file.name)}</b><button class="ghost" onclick="cancelAttachment()">Remove</button></div>`}
window.cancelAttachment=()=>{state.attachment=null;$('#attachmentPreview').innerHTML=''};
function startVoice(){if(!navigator.mediaDevices?.getUserMedia){toast('Voice recording is not available here.');return}toast('Voice recording is ready to connect to storage.')}
let typingTimer;async function sendTyping(){if(!state.active||!state.channel)return;clearTimeout(typingTimer);await state.channel.send({type:'broadcast',event:'typing',payload:{user_id:state.user.id}});typingTimer=setTimeout(()=>{},800)}
function subscribeRealtime(){if(state.channel)sb.removeChannel(state.channel);state.channel=sb.channel('tevlo-global',{config:{broadcast:{self:false}}}).on('postgres_changes',{event:'INSERT',schema:'public',table:'tevlo_messages'},payload=>{if(payload.new.conversation_id===state.active&&payload.new.sender_id!==state.user.id){if(!payload.new.expires_at||new Date(payload.new.expires_at)>new Date()){state.messages.push(payload.new);renderMessages();markRead(state.active)}}const c=state.conversations.find(x=>x.id===payload.new.conversation_id);if(c){c.last_message=payload.new.body;c.updated_at=payload.new.created_at;renderConversationList()}}).on('broadcast',{event:'typing'},payload=>{if(payload.payload?.user_id!==state.user.id&&state.active){const el=$('#typingLabel');if(el){el.textContent='Typing…';clearTimeout(window.__typ);window.__typ=setTimeout(()=>el.textContent='',1500)}}}).subscribe()}
async function markRead(conversationId){await sb.from('tevlo_conversation_members').update({last_read_at:new Date().toISOString()}).eq('conversation_id',conversationId).eq('user_id',state.user.id)}
async function markOnline(){await sb.from('profiles').update({last_seen:new Date().toISOString(),online:true}).eq('id',state.user.id);setInterval(()=>sb.from('profiles').update({last_seen:new Date().toISOString(),online:true}).eq('id',state.user.id),30000)}
async function peopleModal(){showModal(`<div class="modal-head"><h2>Find people</h2><button class="ghost" data-close>✕</button></div><label>Search by name or @username</label><input id="peopleSearch" placeholder="Search for someone"><div id="peopleResults" style="margin-top:10px"></div>`);const render=async()=>{const q=$('#peopleSearch').value.trim();if(q.length<2){$('#peopleResults').innerHTML='<div class="stat">Type at least 2 letters.</div>';return}const {data,error}=await sb.from('profiles').select('*').or(`real_name.ilike.%${q}%,username.ilike.%${q}%`).neq('id',state.user.id).limit(20);if(error){$('#peopleResults').innerHTML=`<div class="error">${esc(error.message)}</div>`;return}$('#peopleResults').innerHTML=(data||[]).length?(data||[]).map(x=>`<div class="user-result" data-person="${x.id}">${avatarHtml(x)}<div class="grow"><b>${esc(x.real_name||x.username)}</b><div class="stat">@${esc(x.username||'')}</div><div class="stat">${esc(x.bio||'')}</div></div><button class="secondary" data-message="${x.id}">Message</button><button class="ghost" data-friend="${x.id}">Add friend</button></div>`).join(''):'<div class="stat">No people found.</div>'};$('#peopleSearch').oninput=render;$('#peopleResults').onclick=async e=>{const msg=e.target.closest('[data-message]');if(msg){await startConversation(msg.dataset.message);closeModal();return}const b=e.target.closest('[data-friend]');if(!b)return;const id=b.dataset.friend;const {error}=await sb.from('tevlo_friendships').insert({requester_id:state.user.id,addressee_id:id,status:'pending'});toast(error?error.message:'Friend request sent.')};render()}
async function newChatModal(){showModal(`<div class="modal-head"><h2>New message</h2><button class="ghost" data-close>✕</button></div><label>Search anyone</label><input id="newSearch" placeholder="Name or @username"><div id="newResults" style="margin-top:10px"></div><div class="settings-section"><b>Create a group</b><p class="stat">Choose friends and create a group chat with up to 20 people.</p><button class="secondary" id="createGroupBtn">Create group</button></div>`);$('#newSearch').oninput=searchAnyone;$('#createGroupBtn').onclick=groupModal}
async function searchAnyone(){const q=$('#newSearch').value.trim();if(q.length<2){$('#newResults').innerHTML='<div class="stat">Type at least 2 letters.</div>';return}const {data}=await sb.from('profiles').select('*').or(`real_name.ilike.%${q}%,username.ilike.%${q}%`).neq('id',state.user.id).limit(20);$('#newResults').innerHTML=(data||[]).map(x=>`<div class="user-result" data-person="${x.id}">${avatarHtml(x)}<div class="grow"><b>${esc(x.real_name||x.username)}</b><div class="stat">@${esc(x.username||'')}</div></div></div>`).join('')||'<div class="stat">No people found.</div>';$('#newResults').onclick=e=>{const el=e.target.closest('[data-person]');if(el)startConversation(el.dataset.person)}}
async function startConversation(personId){const {data,error}=await sb.rpc('tevlo_create_direct_conversation',{target_user_id:personId});if(error){toast(error.message);return}await loadConversations();const c=state.conversations.find(x=>x.id===data);if(c){closeModal();openConversation(c.id)}}
function groupModal(){showModal(`<div class="modal-head"><h2>Create group</h2><button class="ghost" data-close>✕</button></div><label>Group name</label><input id="groupName" placeholder="Weekend plans"><label>Choose friends</label><div id="groupFriends"></div><button class="primary" id="createGroup" style="margin-top:14px">Create group</button>`);$('#groupFriends').innerHTML=state.friends.map(id=>{const p=state.peopleById[id];return p?`<label class="friend-row"><input type="checkbox" value="${p.id}" style="width:auto"><span>${avatarHtml(p,false)}</span><b>${esc(p.name||p.real_name)}</b></label>`:''}).join('')||'<div class="stat">Add friends first.</div>';$('#createGroup').onclick=async()=>{const members=[...document.querySelectorAll('#groupFriends input:checked')].map(x=>x.value);if(members.length>19){toast('Groups can have up to 20 people including you.');return}const name=$('#groupName').value.trim()||'New group';const {data,error}=await sb.rpc('tevlo_create_group_conversation',{group_name:name,member_ids:members});if(error){toast(error.message);return}closeModal();await loadConversations();openConversation(data)}}
function requestsModal(){showModal(`<div class="modal-head"><h2>Friend requests</h2><button class="ghost" data-close>✕</button></div><div id="requestList"></div>`);if(!state.requests.length){$('#requestList').innerHTML='<div class="stat">No pending requests.</div>';return}const ids=state.requests.map(r=>r.requester_id);sb.from('profiles').select('*').in('id',ids).then(({data:p})=>{const map=Object.fromEntries((p||[]).map(x=>[x.id,x]));$('#requestList').innerHTML=state.requests.map(r=>{const p=map[r.requester_id];return `<div class="user-result">${avatarHtml(p)}<div class="grow"><b>${esc(p?.real_name||p?.username||'Someone')}</b><div class="stat">Wants to be your friend</div></div><button class="secondary" data-accept="${r.id}">Accept</button></div>`}).join('');$('#requestList').onclick=async e=>{const b=e.target.closest('[data-accept]');if(!b)return;const {error}=await sb.from('tevlo_friendships').update({status:'accepted'}).eq('id',b.dataset.accept);if(error)toast(error.message);else{closeModal();await loadFriends();await loadConversations();renderApp()}}})}
function profileModal(){const p=state.profile||{};showModal(`<div class="modal-head"><h2>Profile</h2><button class="ghost" data-close>✕</button></div><div class="profile-cover"><div class="profile-avatar-wrap">${avatarHtml(p,true)}</div></div><div class="profile-body"><h2 style="margin-bottom:2px">${esc(p.real_name||'')}</h2><div class="stat">@${esc(p.username||'')}</div><p class="stat">${esc(p.bio||'')}</p><label>Display name</label><input id="pName" value="${esc(p.real_name||'')}"><label>Username</label><input id="pUser" value="${esc(p.username||'')}"><label>Bio</label><textarea id="pBio" rows="3">${esc(p.bio||'')}</textarea><label>Profile photo URL</label><input id="pAvatar" value="${esc(p.avatar_url||'')}" placeholder="https://..."><button class="primary" id="saveProfile">Save changes</button></div>`);$('#saveProfile').onclick=async()=>{const real_name=$('#pName').value.trim(),username=$('#pUser').value.trim().replace(/^@/,''),bio=$('#pBio').value.trim(),avatar_url=$('#pAvatar').value.trim();if(!real_name||!username){toast('Name and username are required.');return}const {data,error}=await sb.from('profiles').update({real_name,username,bio,avatar_url}).eq('id',state.user.id).select().single();if(error){toast(error.message);return}state.profile=data;toast('Profile saved.');closeModal();renderApp()}}
function settingsModal(){showModal(`<div class="modal-head"><h2>Settings</h2><button class="ghost" data-close>✕</button></div><div class="settings-card"><h3>Privacy</h3><div class="settings-row"><span>Show online status</span><button id="onlineSwitch" class="switch ${state.online?'on':''}"></button></div><div class="settings-row"><span>Read receipts</span><button id="readSwitch" class="switch on"></button></div><div class="settings-row"><span>Allow message requests</span><button class="switch on"></button></div></div><div class="settings-card"><h3>Appearance</h3><div class="settings-row"><span>Dark mode</span><button id="darkSwitch" class="switch"></button></div></div><div class="settings-card"><h3>Notifications</h3><div class="settings-row"><span>Browser notifications</span><button id="notifyBtn" class="secondary">${state.notifications?'Enabled':'Enable'}</button></div></div>`);$('#onlineSwitch').onclick=async()=>{state.online=!state.online;$('#onlineSwitch').classList.toggle('on',state.online);await sb.from('profiles').update({online:state.online}).eq('id',state.user.id)};$('#darkSwitch').onclick=()=>{document.body.classList.toggle('dark');$('#darkSwitch').classList.toggle('on');localStorage.setItem('tevlo_dark',document.body.classList.contains('dark'))};$('#notifyBtn').onclick=async()=>{if(!('Notification'in window)){toast('Notifications are not supported here.');return}const p=await Notification.requestPermission();state.notifications=p==='granted';$('#notifyBtn').textContent=state.notifications?'Enabled':'Enable'}}
function chatThemeModal(c){showModal(`<div class="modal-head"><h2>Chat theme</h2><button class="ghost" data-close>✕</button></div><p class="stat">Choose a look for this conversation.</p><div class="theme-grid">${[['forest','Forest Green','linear-gradient(135deg,#0b6844,#39b77c)'],['emerald','Emerald','linear-gradient(135deg,#0a7a50,#80cfa8)'],['mint','Mint','linear-gradient(135deg,#d8f4e6,#89cfae)'],['deep','Deep Green','linear-gradient(135deg,#073d29,#138a5b)'],['teal','Teal Green','linear-gradient(135deg,#08736f,#42b99a)'],['sage','Soft Sage','linear-gradient(135deg,#dceee4,#96b8a3)']].map(([id,n,g])=>`<button class="theme-choice" data-theme="${id}"><div class="theme-swatch" style="background:${g}"></div><b>${n}</b></button>`).join('')}</div>`);document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{c.theme=b.dataset.theme;localStorage.setItem('tevlo_theme_'+c.id,c.theme);toast('Theme saved.');closeModal()})}
function searchMessages(c){showModal(`<div class="modal-head"><h2>Search messages</h2><button class="ghost" data-close>✕</button></div><input id="msgSearch" placeholder="Search in ${esc(c.name)}"><div id="msgResults" style="margin-top:10px"></div>`);$('#msgSearch').oninput=e=>{const q=e.target.value.toLowerCase();$('#msgResults').innerHTML=state.messages.filter(m=>(m.body||'').toLowerCase().includes(q)).map(m=>`<div class="settings-section"><b>${esc(m.body)}</b><div class="stat">${fmtTime(m.created_at)}</div></div>`).join('')||'<div class="stat">No messages found.</div>'}}
async function removeFriend(c){const other=c.profile?.id;if(!other)return;if(!confirm(`Remove ${c.name} as a friend?`))return;const {error}=await sb.from('tevlo_friendships').delete().or(`and(requester_id.eq.${state.user.id},addressee_id.eq.${other}),and(requester_id.eq.${other},addressee_id.eq.${state.user.id})`);toast(error?'Could not remove friend.':'Friend removed.');if(!error){await loadFriends();await loadConversations();renderApp()}}
async function blockUser(c){const other=c.profile?.id;if(!other)return;const {error}=await sb.from('tevlo_blocks').upsert({blocker_id:state.user.id,blocked_id:other});toast(error?error.message:'User blocked.');closeMenu()}
async function reportUser(c){const other=c.profile?.id;if(!other)return;const reason=prompt('Why are you reporting this user?')||'';const {error}=await sb.from('tevlo_reports').insert({reporter_id:state.user.id,reported_id:other,reason:reason.slice(0,500)});toast(error?'Could not submit report.':'Report submitted.');closeMenu()}
function toggleSet(set,id,key){set.has(id)?set.delete(id):set.add(id);localStorage.setItem('tevlo_'+key,JSON.stringify([...set]));renderConversationList();closeMenu()}
function closeMenu(){$('#chatMenu')?.classList.add('hidden')}
function showModal(inner){const b=document.createElement('div');b.className='modal-backdrop';b.id='modal';b.innerHTML=`<div class="modal">${inner}</div>`;document.body.appendChild(b);b.querySelector('[data-close]')?.addEventListener('click',closeModal);b.addEventListener('click',e=>{if(e.target===b)closeModal()})}
function closeModal(){$('#modal')?.remove()}
function boot(){renderAuth('login');try{if(window.supabase&&window.supabase.createClient){sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}})}else{toast('Tevlo connection service is still loading. Refresh this page if needed.');return}sb.auth.getSession().then(async({data})=>{if(data.session)await afterAuth(data.session.user)}).catch(e=>{console.error(e);toast('Could not restore your session. Please log in.')});sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session)afterAuth(session.user)})}catch(e){console.error(e);toast('Tevlo could not start. Refresh the page and try again.')}}
if(localStorage.getItem('tevlo_dark')==='true')document.body.classList.add('dark');boot();
})();
</script>
</body>
</html>
