function startDemo(){state.profile=demoData.profile;state.peopleById=Object.fromEntries(demoData.people.map(p=>[p.id,p]));state.friends=demoData.friends;state.conversations=demoData.conversations.map(c=>({...c,profile:state.peopleById[c.friend_id]}))}
async function loadFriends(){const uid=state.user.id;const {data}=await sb.from('tevlo_friendships').select('id,requester_id,addressee_id,status').or(`requester_id.eq.${uid},addressee_id.eq.${uid}`).eq('status','accepted');const ids=(data||[]).map(x=>x.requester_id===uid?x.addressee_id:x.requester_id);if(ids.length){const {data:p}=await sb.from('profiles').select('*').in('id',ids);state.peopleById=Object.fromEntries((p||[]).map(x=>[x.id,{...x,name:x.real_name}])) ;state.friends=ids}else{state.peopleById={};state.friends=[]}const {data:req}=await sb.from('tevlo_friendships').select('id,requester_id,addressee_id,status,created_at').eq('addressee_id',uid).eq('status','pending');state.requests=req||[]}
async function loadConversations(){const uid=state.user.id;const {data:members,error}=await sb.from('tevlo_conversation_members').select('conversation_id').eq('user_id',uid);if(error)return toast(error.message);const ids=(members||[]).map(x=>x.conversation_id);if(!ids.length){state.conversations=[];return}const {data:convs,error:ce}=await sb.from('tevlo_conversations').select('*').in('id',ids).order('updated_at',{ascending:false});if(ce)return toast(ce.message);const others={};for(const c of convs||[]){if(!c.is_group){const {data:m}=await sb.from('tevlo_conversation_members').select('user_id').eq('conversation_id',c.id).neq('user_id',uid).maybeSingle();if(m)others[c.id]=m.user_id}}const otherIds=[...new Set(Object.values(others))];let pmap={};if(otherIds.length){const {data:p}=await sb.from('profiles').select('*').in('id',otherIds);pmap=Object.fromEntries((p||[]).map(x=>[x.id,{...x,name:x.real_name}]))}state.conversations=(convs||[]).map(c=>c.is_group?{...c,name:c.name||'Group chat',profile:null}:{...c,profile:pmap[others[c.id]]||null,name:pmap[others[c.id]]?.name||'Conversation',other_user_id:others[c.id]})}
function renderApp(){root.innerHTML=`<div class="app"><div class="shell" id="shell"><aside class="sidebar"><div class="side-head"><div><div class="side-title">Tevlo</div><div class="tagline" style="margin:0">Just talk.</div></div><div class="head-icon-group"><button class="icon-btn" id="notificationsBtn" title="Notifications">🔔</button><button class="icon-btn" id="peopleBtn" title="Find people">👥</button><button class="icon-btn" id="newChat" title="New message">✎</button></div></div><div class="search-wrap"><input id="searchPeople" placeholder="Search conversations or people"></div><div class="filter-tabs"><button data-filter="all" class="filter-tab active">All</button><button data-filter="unread" class="filter-tab">Unread</button><button data-filter="groups" class="filter-tab">Groups</button><button data-filter="favorites" class="filter-tab">Favorites</button></div>${state.requests.length?`<div class="requests"><button class="request-banner" id="requestsBtn"><span>Friend requests</span><b>${state.requests.length}</b></button></div>`:''}<div class="conversation-list" id="conversationList"></div><div class="sidebar-foot"><button class="profile-mini" id="profileBtn">${avatarHtml(state.profile,false,state.online)}<span><b>${esc(state.profile?.name||state.profile?.real_name||'Profile')}</b><small>${state.profile?.username?`@${esc(state.profile.username)}`:'Account'}</small></span></button><button class="icon-btn small" id="settingsBtn" title="Settings">⚙</button></div></aside><main class="main" id="mainPane"><div class="empty"><div class="empty-card"><div class="empty-icon">💬</div><h2 style="color:var(--text);margin-bottom:8px">Your messages</h2><p>Choose a conversation or start a new one.</p><button class="primary" id="emptyNew" style="width:auto">＋ New message</button></div></div></main></div></div>`;$('#conversationList').addEventListener('click',e=>{const el=e.target.closest('[data-conv]');if(el)openConversation(el.dataset.conv)});$('#searchPeople').oninput=e=>{state.search=e.target.value.toLowerCase();renderConversationList()};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;document.querySelectorAll('.filter-tab').forEach(x=>x.classList.toggle('active',x===b));renderConversationList()});$('#newChat').onclick=newChatModal;$('#emptyNew').onclick=newChatModal;$('#peopleBtn').onclick=peopleModal;$('#profileBtn').onclick=profileModal;$('#settingsBtn').onclick=settingsModal;$('#notificationsBtn').onclick=notificationsModal;$('#requestsBtn')?.addEventListener('click',requestsModal);renderConversationList()}
function renderConversationList(){let list=(state.conversations||[]).filter(c=>(c.name||'').toLowerCase().includes(state.search||''));if(state.filter==='groups')list=list.filter(c=>c.is_group);if(state.filter==='favorites')list=list.filter(c=>state.favorites.includes(c.id));if(state.filter==='unread')list=list.filter(c=>state.unread.has(c.id));list.sort((a,b)=>(state.pinned.includes(b.id)-state.pinned.includes(a.id))||(new Date(b.updated_at||0)-new Date(a.updated_at||0)));$('#conversationList').innerHTML=list.length?list.map(c=>{const unread=state.unread.has(c.id),fav=state.favorites.includes(c.id),pin=state.pinned.includes(c.id);return `<div class="conv ${state.active===c.id?'active':''}" data-conv="${esc(c.id)}">${c.profile?avatarHtml(c.profile,false):avatarHtml({name:c.name},false)}<div class="conv-body"><div class="conv-top"><div class="conv-name">${esc(c.name)} ${fav?'<span class="mini-star">★</span>':''}${pin?'<span class="mini-pin">⌖</span>':''}</div><div class="conv-time">${c.updated_at?fmtTime(c.updated_at):''}</div></div><div class="conv-preview">${esc(c.last_message||'No messages yet')}</div></div>${unread?'<span class="unread-dot"></span>':''}</div>`}).join(''):`<div class="empty" style="height:240px"><div><div style="font-size:34px">🌿</div><p>${state.search?'No matches':'No conversations here yet.'}</p></div></div>`}
async function openConversation(id){state.active=id;$('.shell')?.classList.add('chat-open');const c=state.conversations.find(x=>x.id===id);if(!c)return;if(SUPABASE_READY){const {data,error}=await sb.from('tevlo_messages').select('*').eq('conversation_id',id).is('deleted_at',null).or(`expires_at.is.null,expires_at.gt.${new Date().toISOString()}`).order('created_at',{ascending:true});if(error)return toast(error.message);state.messages=data||[]}else state.messages=demoData.messages[id]||[];state.unread.delete(id);renderConversationList();await renderChat(c);await markRead(id)}
async function renderChat(c){const profile=c.profile,theme=state.chatThemes[c.id]||'mint';$('#mainPane').innerHTML=`<div style="position:relative;height:100%;display:flex;flex-direction:column"><header class="chat-head"><button class="icon-btn mobile-only" id="backBtn">‹</button>${profile?avatarHtml(profile,false,profile.online):avatarHtml({name:c.name})}<div><div class="chat-title">${esc(c.name)}</div><div class="chat-sub">${c.is_group?'Group chat':'Tevlo conversation'}</div></div><div class="head-actions"><button class="ghost" id="searchChatBtn" title="Search messages">⌕</button><button class="ghost" id="chatMenuBtn" title="Chat options">•••</button></div><div class="chat-menu hidden" id="chatMenu"><button id="favoriteBtn">★ ${state.favorites.includes(c.id)?'Remove favorite':'Add to favorites'}</button><button id="pinBtn">⌖ ${state.pinned.includes(c.id)?'Unpin conversation':'Pin conversation'}</button><button id="themeBtn">🎨 Chat theme</button><button id="disappearBtn">⏳ Disappearing messages</button><button id="clearDraft">🧹 Clear draft</button><button id="muteChat">🔕 Mute conversation</button><button id="removeFriend">👤 Remove friend</button><button id="blockUser">🚫 Block</button><button id="reportUser">⚑ Report</button></div></header><div class="chat-search-bar hidden" id="chatSearchBar"><input id="chatSearchInput" placeholder="Search in this chat"><button class="ghost" id="closeChatSearch">✕</button></div><div class="messages theme-${theme}" id="messages"></div><div class="typing" id="typingLabel"></div><div id="attachmentPreview"></div><div class="composer"><div class="composer-tools"><input id="mediaInput" class="media-input" type="file" accept="image/*,video/*,audio/*,.pdf,.txt,.doc,.docx" multiple><button class="tool-round" id="mediaBtn" title="Photo, video or file">＋</button><button class="tool-round" id="recordBtn" title="Voice message">🎙</button><div class="picker-wrap"><button class="tool-round" id="plusBtn" title="Emoji">☺</button><div class="emoji-panel hidden" id="emojiPanel">${['😀','😂','😍','🥹','👍','❤️','😭','😮','🎉','✨','😊','🙌','🔥','👏','💙','🩵','😎','🤗'].map(x=>`<button data-emoji="${x}">${x}</button>`).join('')}</div></div></div><textarea id="composerText" rows="1" placeholder="Message"></textarea><div class="picker-wrap"><button class="tool-round" id="stickerBtn" title="Stickers">✨</button><div class="sticker-panel hidden" id="stickerPanel">${['🩵','💬','✨','😊','😂','🙌','🌟','🎉','🫶','👍','💫','🐶'].map(x=>`<button data-sticker="${x}">${x}</button>`).join('')}</div></div><button class="round send" id="sendBtn">↑</button></div></div>`;await renderMessages();$('#searchChatBtn').onclick=()=>{$('#chatSearchBar').classList.remove('hidden');$('#chatSearchInput').focus()};$('#closeChatSearch').onclick=()=>{$('#chatSearchBar').classList.add('hidden');$('#chatSearchInput').value='';renderMessages()};$('#chatSearchInput').oninput=renderMessages;$('#backBtn')?.addEventListener('click',()=>$('.shell').classList.remove('chat-open'));$('#sendBtn').onclick=sendCurrent;$('#composerText').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendCurrent()}});$('#composerText').value=state.drafts[c.id]||'';autoSize();$('#composerText').addEventListener('input',()=>{autoSize();state.drafts[c.id]=$('#composerText').value;localStorage.setItem('tevlo_drafts',JSON.stringify(state.drafts));sendTyping()});$('#plusBtn').onclick=()=>{$('#emojiPanel').classList.toggle('hidden');$('#stickerPanel').classList.add('hidden')};$('#stickerBtn').onclick=()=>{$('#stickerPanel').classList.toggle('hidden');$('#emojiPanel').classList.add('hidden')};$('#emojiPanel').onclick=e=>{const x=e.target.dataset.emoji;if(x){insertText(x);$('#emojiPanel').classList.add('hidden')}};$('#stickerPanel').onclick=e=>{const x=e.target.dataset.sticker;if(x){insertText(x);$('#stickerPanel').classList.add('hidden')}};$('#mediaBtn').onclick=()=>$('#mediaInput').click();$('#mediaInput').onchange=e=>previewFiles([...e.target.files]);$('#recordBtn').onclick=toggleRecorder;$('#chatMenuBtn').onclick=()=>$('#chatMenu').classList.toggle('hidden');$('#favoriteBtn').onclick=()=>toggleFavorite(c.id);$('#pinBtn').onclick=()=>togglePin(c.id);$('#themeBtn').onclick=()=>themeModal(c);$('#disappearBtn').onclick=()=>disappearModal(c);$('#clearDraft').onclick=()=>{delete state.drafts[c.id];localStorage.setItem('tevlo_drafts',JSON.stringify(state.drafts));$('#composerText').value='';autoSize();toast('Draft cleared.')};$('#muteChat').onclick=()=>toast('Conversation muted.');$('#removeFriend').onclick=()=>removeFriend(c);$('#blockUser').onclick=()=>blockUser(c);$('#reportUser').onclick=()=>reportUser(c);$('#messages').onclick=e=>{const r=e.target.closest('[data-react-msg]'),rp=e.target.closest('[data-reply-msg]'),more=e.target.closest('[data-more-msg]'),m=e.target.closest('[data-msg]');if(!m)return;if(r){e.stopPropagation();showReactionPicker(r.dataset.reactMsg);return}if(rp){e.stopPropagation();setReplyTo(rp.dataset.replyMsg);return}if(more){e.stopPropagation();messageActions(more.dataset.moreMsg);return}if(e.target.closest('.bubble'))showReactionPicker(m.dataset.msg)}}
function previewFiles(files){pendingFiles=files.slice(0,6);const el=$('#attachmentPreview');if(!el)return;el.innerHTML=pendingFiles.length?`<div class="attachment-preview"><b>${pendingFiles.length} attachment${pendingFiles.length>1?'s':''}</b><span>${pendingFiles.map(f=>esc(f.name)).join(', ')}</span><button class="ghost" id="clearAttachments">Clear</button></div>`:'';$('#clearAttachments')?.addEventListener('click',()=>{pendingFiles=[];$('#mediaInput').value='';$('#attachmentPreview').innerHTML=''})}
async function uploadFile(file,conversationId){if(!SUPABASE_READY)return null;const ext=(file.name.split('.').pop()||'bin').toLowerCase(),path=`${conversationId}/${state.user.id}/${crypto.randomUUID()}.${ext}`;const {error}=await sb.storage.from('tevlo-media').upload(path,file,{upsert:false,contentType:file.type||undefined});if(error)throw error;return path}
async function toggleRecorder(){if(recorder&&recorder.state==='recording'){recorder.stop();return}if(!navigator.mediaDevices?.getUserMedia)return toast('Voice messages are not supported in this browser.');try{recordStream=await navigator.mediaDevices.getUserMedia({audio:true});recordChunks=[];recorder=new MediaRecorder(recordStream);recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};recorder.onstop=async()=>{try{const blob=new Blob(recordChunks,{type:'audio/webm'});pendingFiles.push(new File([blob],`voice-${Date.now()}.webm`,{type:'audio/webm'}));previewFiles(pendingFiles)}finally{recordStream?.getTracks().forEach(t=>t.stop());recordStream=null;$('#recordBtn')?.classList.remove('recording')}};recorder.start();$('#recordBtn').classList.add('recording');toast('Recording voice message… tap 🎙 again to stop.')}catch(e){toast('Microphone permission was not granted.')}}

async function renderMessages(){const wrap=$('#messages');if(!wrap)return;const q=($('#chatSearchInput')?.value||'').toLowerCase();const visible=state.messages.filter(m=>!q||String(m.body||'').toLowerCase().includes(q));if(!visible.length){wrap.innerHTML='<div class="empty" style="height:100%"><div><div class="empty-icon">🩵</div><h3>Start the conversation</h3><p>Say hi and send your first message.</p></div></div>';return}const rows=[];for(const m of visible){const mine=m.sender_id===state.user?.id||m.sender_id==='me';let content=esc(m.body);if(m.media_url){const url=await getMediaUrl(m.media_url);if(url&&m.type==='image')content=`<div class="media-card"><img src="${esc(url)}" alt="Attachment"></div>${content?`<div style="margin-top:6px">${content}</div>`:''}`;else if(url&&m.type==='video')content=`<div class="media-card"><video src="${esc(url)}" controls playsinline></video>${content?`<div style="margin-top:6px">${content}</div>`:''}`;else if(url&&m.type==='audio')content=`<div class="media-card audio-card"><audio src="${esc(url)}" controls></audio></div>${content?`<div style="margin-top:6px">${content}</div>`:''}`;else if(url)content=`<a class="media-card file-card" href="${esc(url)}" target="_blank" rel="noopener"><span class="file-icon">↧</span><span>${esc(m.body||'File')}</span></a>`}rows.push(`<div class="row ${mine?'mine':'theirs'}" data-msg="${esc(m.id)}"><div class="message-stack"><div class="bubble">${m.reply_to_id?'<div class="reply-chip">Replying to a message</div>':''}${content}</div><div class="message-actions"><button class="mini-action" data-react-msg="${esc(m.id)}">☺</button><button class="mini-action" data-reply-msg="${esc(m.id)}">↩</button>${mine?`<button class="mini-action" data-more-msg="${esc(m.id)}">•••</button>`:''}</div><div class="meta">${fmtTime(m.created_at)}${m.edited_at?' · edited':''}${m.read_at?' · Read':''}</div></div></div>`)}wrap.innerHTML=rows.join('');wrap.scrollTop=wrap.scrollHeight}
async function sendCurrent(){const input=$('#composerText'),body=input?.value.trim(),c=state.conversations.find(x=>x.id===state.active);if(!c)return;if(!body&&!pendingFiles.length)return;if(body.length>4000)return toast('Message is too long.');if(!SUPABASE_READY){const msg={id:'demo-'+Date.now(),sender_id:'me',body:body||pendingFiles.map(f=>`📎 ${f.name}`).join(' · '),created_at:new Date().toISOString(),type:pendingFiles.length?'file':'text'};(demoData.messages[c.id] ||= []).push(msg);c.last_message=msg.body;c.updated_at=msg.created_at;state.messages.push(msg);input.value='';pendingFiles=[];$('#attachmentPreview').innerHTML='';delete state.drafts[c.id];localStorage.setItem('tevlo_drafts',JSON.stringify(state.drafts));autoSize();await renderMessages();renderConversationList();return}try{const ttl=state.disappear[c.id]||0;if(body){const {error}=await sb.from('tevlo_messages').insert({conversation_id:c.id,sender_id:state.user.id,body,type:'text',reply_to_id:state.replyTo||null,expires_at:ttl?new Date(Date.now()+ttl*1000).toISOString():null});if(error)throw error}for(const file of pendingFiles){const path=await uploadFile(file,c.id),type=file.type.startsWith('image/')?'image':file.type.startsWith('video/')?'video':file.type.startsWith('audio/')?'audio':'file';const {error}=await sb.from('tevlo_messages').insert({conversation_id:c.id,sender_id:state.user.id,body:file.name,type,media_url:path,reply_to_id:state.replyTo||null,expires_at:ttl?new Date(Date.now()+ttl*1000).toISOString():null});if(error)throw error}input.value='';delete state.drafts[c.id];localStorage.setItem('tevlo_drafts',JSON.stringify(state.drafts));pendingFiles=[];$('#attachmentPreview').innerHTML='';$('#mediaInput').value='';state.replyTo=null;autoSize();await openConversation(c.id)}catch(e){console.error(e);toast(e?.message||'Could not send the message.')}}
function sendTyping(){if(!SUPABASE_READY||!state.channel||!state.active)return;clearTimeout(typingTimer);state.channel.send({type:'broadcast',event:'typing',payload:{user_id:state.user.id}}).catch(()=>{})}
function subscribeRealtime(){if(!SUPABASE_READY)return;if(state.channel)sb.removeChannel(state.channel);state.channel=sb.channel('tevlo-global',{config:{broadcast:{self:false}}});state.channel.on('postgres_changes',{event:'INSERT',schema:'public',table:'tevlo_messages'},payload=>{if(payload.new.sender_id===state.user.id)return;const c=state.conversations.find(x=>x.id===payload.new.conversation_id);if(c){c.last_message=payload.new.body;c.updated_at=payload.new.created_at;if(state.active===payload.new.conversation_id){state.messages.push(payload.new);renderMessages();markRead(state.active)}else{state.unread.add(payload.new.conversation_id);pushNotification('New message','You received a new Tevlo message.')}renderConversationList()}}).on('broadcast',{event:'typing'},payload=>{if(payload.payload?.user_id!==state.user.id&&state.active){$('#typingLabel').textContent='Typing…';setTimeout(()=>$('#typingLabel').textContent='',1200)}}).subscribe()}

function themeModal(c){showModal(`<div class="modal-head"><h2>Chat appearance</h2><button class="ghost" data-close>✕</button></div><p class="stat">Choose a theme for ${esc(c.name)}.</p><div class="theme-grid">${[['mint','Mint'],['forest','Forest'],['emerald','Emerald'],['sage','Sage'],['deep','Deep Green']].map(x=>`<button class="theme-choice ${state.chatThemes[c.id]===x[0]?'active':''}" data-theme="${x[0]}"><span class="theme-${x[0]}"></span><b>${x[1]}</b></button>`).join('')}</div>`);document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{state.chatThemes[c.id]=b.dataset.theme;localStorage.setItem('tevlo_chat_themes',JSON.stringify(state.chatThemes));closeModal();openConversation(c.id)})}
function disappearModal(c){const cur=state.disappear[c.id]||0;showModal(`<div class="modal-head"><h2>Disappearing messages</h2><button class="ghost" data-close>✕</button></div><p class="stat">Choose how long new messages stay visible.</p><div class="choice-list">${[[0,'Off'],[300,'5 minutes'],[3600,'1 hour'],[86400,'1 day']].map(x=>`<button class="choice-row ${cur===x[0]?'selected':''}" data-disappear="${x[0]}">${x[1]}</button>`).join('')}</div>`);document.querySelectorAll('[data-disappear]').forEach(b=>b.onclick=()=>{state.disappear[c.id]=Number(b.dataset.disappear);localStorage.setItem('tevlo_disappear',JSON.stringify(state.disappear));closeModal();toast(b.textContent+' set.')})}
function settingsModal(){showModal(`<div class="modal-head"><h2>Settings</h2><button class="ghost" data-close>✕</button></div><div class="settings-card"><div class="settings-row"><div><b>Online status</b><div class="stat">Show when you are online.</div></div><button class="switch ${state.online?'on':''}" id="setOnline"></button></div><div class="settings-row"><div><b>Browser notifications</b><div class="stat">Get alerts for new messages.</div></div><button class="switch ${state.notifications?'on':''}" id="setNotify"></button></div><div class="settings-row"><div><b>Dark mode</b><div class="stat">Use a darker interface.</div></div><button class="switch ${document.body.classList.contains('dark')?'on':''}" id="setDark"></button></div><div class="settings-row"><div><b>Read receipts</b><div class="stat">Let friends know when you have read messages.</div></div><button class="switch ${state.readReceipts?'on':''}" id="setRead"></button></div><div class="settings-row"><div><b>Friend requests</b><div class="stat">Allow people to send you requests.</div></div><button class="switch ${state.allowRequests?'on':''}" id="setRequests"></button></div></div><button class="primary" id="settingsProfile">Open profile</button><button class="ghost" id="settingsSignout">Sign out</button>`);$('#setOnline').onclick=()=>{state.online=!state.online;localStorage.setItem('tevlo_online',String(state.online));closeModal();renderApp()};$('#setNotify').onclick=async()=>{state.notifications=!state.notifications;localStorage.setItem('tevlo_notifications',String(state.notifications));if(state.notifications&&window.Notification?.permission==='default')await Notification.requestPermission();closeModal();toast(state.notifications?'Notifications enabled.':'Notifications disabled.')};$('#setDark').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('tevlo_dark',String(document.body.classList.contains('dark')));closeModal()};$('#setRead').onclick=()=>{state.readReceipts=!state.readReceipts;localStorage.setItem('tevlo_read_receipts',String(state.readReceipts));closeModal()};$('#setRequests').onclick=()=>{state.allowRequests=!state.allowRequests;localStorage.setItem('tevlo_allow_requests',String(state.allowRequests));closeModal()};$('#settingsProfile').onclick=()=>{closeModal();profileModal()};$('#settingsSignout').onclick=async()=>{if(SUPABASE_READY)await sb.auth.signOut();location.reload()}}
function notificationsModal(){showModal(`<div class="modal-head"><h2>Notifications</h2><button class="ghost" data-close>✕</button></div>${state.notificationsList.length?state.notificationsList.map(n=>`<div class="settings-section"><b>${esc(n.title)}</b><div class="stat">${esc(n.body)}</div><div class="stat">${fmtTime(n.created_at)}</div></div>`).join(''):'<p class="stat">No notifications yet.</p>'}`)}
function pushNotification(title,body){state.notificationsList.unshift({title,body,created_at:new Date().toISOString()});state.notificationsList=state.notificationsList.slice(0,30);localStorage.setItem('tevlo_notifications_list',JSON.stringify(state.notificationsList));if(state.notifications&&window.Notification?.permission==='granted')new Notification(title,{body})}
async function peopleModal(){showModal(`<div class="modal-head"><h2>Find people</h2><button class="ghost" data-close>✕</button></div><input id="friendSearch" placeholder="Search by name"><div id="friendResults" style="margin-top:10px"></div><div style="margin-top:18px"><button class="secondary" id="createGroupBtn">＋ Create group</button></div>`);const render=async()=>{const q=$('#friendSearch').value.trim();if(!q){$('#friendResults').innerHTML='<div class="stat">Type a name to find someone.</div>';return}if(!SUPABASE_READY){const data=demoData.people.filter(p=>p.id!==state.user.id&&p.name.toLowerCase().includes(q.toLowerCase()));$('#friendResults').innerHTML=data.map(p=>`<div class="user-result" data-person="${p.id}">${avatarHtml(p)}<div class="grow"><b>${esc(p.name)}</b><div class="stat">${esc(p.bio||'')}</div></div><button class="secondary">Message</button></div>`).join('')||'<div class="stat">No people found.</div>';return}const {data,error}=await sb.from('profiles').select('*').ilike('real_name',`%${q}%`).neq('id',state.user.id).limit(20);if(error)return $('#friendResults').innerHTML=`<div class="error">${esc(error.message)}</div>`;$('#friendResults').innerHTML=(data||[]).map(p=>`<div class="user-result" data-person="${p.id}">${avatarHtml({...p,name:p.real_name})}<div class="grow"><b>${esc(p.real_name||'Tevlo user')}</b><div class="stat">@${esc(p.username||'')}</div></div><button class="secondary">Message</button></div>`).join('')||'<div class="stat">No people found.</div>'};$('#friendSearch').oninput=render;$('#friendSearch').focus();$('#friendResults').onclick=e=>{const el=e.target.closest('[data-person]');if(el)startConversation(el.dataset.person)};$('#createGroupBtn').onclick=groupModal}
async function startConversation(personId){closeModal();const person=state.peopleById?.[personId]||demoData.people.find(p=>p.id===personId);if(!SUPABASE_READY){let c=state.conversations.find(x=>x.friend_id===personId);if(!c){c={id:'demo-'+Date.now(),name:person?.name||'Conversation',friend_id:personId,is_group:false,last_message:'',updated_at:new Date().toISOString(),profile:person};state.conversations.unshift(c);demoData.messages[c.id]=[]}openConversation(c.id);return}const {data,error}=await sb.rpc('tevlo_create_direct_conversation',{friend_user_id:personId});if(error)return toast(error.message);await loadConversations();openConversation(data)}
function groupModal(){showModal(`<div class="modal-head"><h2>Create group</h2><button class="ghost" data-close>✕</button></div><label>Group name</label><input id="groupName" placeholder="Weekend plans"><label>Choose friends</label><div id="groupFriends"></div><button class="primary" id="createGroup">Create group</button>`);$('#groupFriends').innerHTML=state.friends.map(id=>{const p=state.peopleById?.[id];return p?`<label class="friend-row"><input type="checkbox" value="${p.id}" style="width:auto"><span style="display:flex;align-items:center;gap:8px">${avatarHtml(p)}<b>${esc(p.name||p.real_name)}</b></span></label>`:''}).join('')||'<div class="stat">Add friends first to make a group.</div>';$('#createGroup').onclick=async()=>{const name=$('#groupName').value.trim()||'New group',members=[...document.querySelectorAll('#groupFriends input:checked')].map(x=>x.value);if(!members.length)return toast('Pick at least one friend.');if(!SUPABASE_READY)return toast('Connect Supabase to create real groups.');const {data,error}=await sb.rpc('tevlo_create_group_conversation',{group_name:name,member_ids:members});if(error)return toast(error.message);closeModal();await loadConversations();openConversation(data)}}
async function requestsModal(){showModal(`<div class="modal-head"><h2>Friend requests</h2><button class="ghost" data-close>✕</button></div><div id="requestList"></div>`);if(!state.requests.length)return $('#requestList').innerHTML='<div class="stat">No pending requests.</div>';if(!SUPABASE_READY)return $('#requestList').innerHTML='<div class="stat">Preview mode has no real requests.</div>';const ids=state.requests.map(r=>r.requester_id),{data:people}=await sb.from('profiles').select('*').in('id',ids);$('#requestList').innerHTML=state.requests.map(r=>{const p=(people||[]).find(x=>x.id===r.requester_id);return `<div class="friend-row"><div class="grow"><b>${esc(p?.real_name||'Someone')}</b></div><button class="secondary" data-accept="${r.id}">Accept</button><button class="ghost" data-decline="${r.id}">Decline</button></div>`}).join('');$('#requestList').onclick=async e=>{const a=e.target.closest('[data-accept]'),d=e.target.closest('[data-decline]');if(a){const {error}=await sb.from('tevlo_friendships').update({status:'accepted'}).eq('id',a.dataset.accept).eq('addressee_id',state.user.id);if(error)return toast(error.message);await loadFriends();closeModal();renderApp()}if(d){await sb.from('tevlo_friendships').delete().eq('id',d.dataset.decline).eq('addressee_id',state.user.id);await loadFriends();closeModal();renderApp()}}}
function profileModal(){const p=state.profile||{};showModal(`<div class="modal-head"><h2>Profile</h2><button class="ghost" data-close>✕</button></div><div class="profile-cover"><div class="profile-avatar-wrap">${avatarHtml(p,true,state.online)}</div></div><div class="profile-body"><div class="profile-grid"><div></div><div><h2 style="margin:0">${esc(p.name||p.real_name||'Your profile')}</h2><div class="stat">@${esc(p.username||'username')}</div><p>${esc(p.bio||'')}</p></div></div><label>Display name</label><input id="profileName" value="${esc(p.name||p.real_name||'')}"><label>Username</label><input id="profileUsername" value="${esc(p.username||'')}"><label>Bio</label><textarea id="profileBio" rows="3">${esc(p.bio||'')}</textarea><button class="primary" id="saveProfile">Save profile</button></div>`);$('#saveProfile').onclick=async()=>{const name=$('#profileName').value.trim(),username=$('#profileUsername').value.trim().replace(/^@/,'').toLowerCase(),bio=$('#profileBio').value.trim();if(!name||!username)return toast('Name and username are required.');if(!SUPABASE_READY){state.profile={...state.profile,name,username,bio};closeModal();renderApp();return}const {error}=await sb.from('profiles').update({real_name:name,username,bio}).eq('id',state.user.id);if(error)return toast(error.message);state.profile={...state.profile,real_name:name,name,username,bio};closeModal();renderApp();toast('Profile saved.')}}
async function removeFriend(c){if(!SUPABASE_READY)return toast('Demo mode.');const other=c.other_user_id||c.profile?.id;if(!other)return toast('This is a group chat.');const {error}=await sb.from('tevlo_friendships').delete().or(`and(requester_id.eq.${state.user.id},addressee_id.eq.${other}),and(requester_id.eq.${other},addressee_id.eq.${state.user.id})`);if(error)return toast(error.message);toast('Friend removed.')}
async function blockUser(c){if(!SUPABASE_READY)return toast('Demo mode.');const other=c.other_user_id||c.profile?.id;if(!other)return;const {error}=await sb.from('tevlo_blocks').upsert({blocker_id:state.user.id,blocked_id:other});toast(error?'Could not block user.':'User blocked.')}
async function reportUser(c){if(!SUPABASE_READY)return toast('Demo mode.');const other=c.other_user_id||c.profile?.id;if(!other)return;const reason=prompt('Why are you reporting this user?')||'';const {error}=await sb.from('tevlo_reports').insert({reporter_id:state.user.id,reported_id:other,reason:reason.slice(0,500)});toast(error?'Could not submit report.':'Report submitted.')}
function setReplyTo(msgId){const msg=state.messages.find(x=>x.id===msgId);state.replyTo=msgId;const input=$('#composerText');if(input){input.placeholder=`Replying to: ${(msg?.body||'message').slice(0,60)}`;input.focus()}toast('Replying to message.')}
async function messageActions(msgId){const m=state.messages.find(x=>x.id===msgId);if(!m)return;const action=prompt('Type edit, delete, or cancel');if(action==='delete'){if(!SUPABASE_READY){m.body='Message deleted';return renderMessages()}const {error}=await sb.from('tevlo_messages').update({body:'Message deleted',deleted_at:new Date().toISOString()}).eq('id',msgId).eq('sender_id',state.user.id);if(error)return toast(error.message);openConversation(state.active)}else if(action==='edit'){const body=prompt('Edit message',m.body);if(body===null)return;if(!SUPABASE_READY){m.body=body;m.edited_at=new Date().toISOString();return renderMessages()}const {error}=await sb.from('tevlo_messages').update({body,edited_at:new Date().toISOString()}).eq('id',msgId).eq('sender_id',state.user.id);if(error)return toast(error.message);openConversation(state.active)}}
function showReactionPicker(msgId){document.querySelector('.reaction-picker')?.remove();const p=document.createElement('div');p.className='reaction-picker';p.style.left='50%';p.style.bottom='84px';p.innerHTML=['❤️','👍','😂','😮','😢','🎉'].map(x=>`<button data-react="${x}">${x}</button>`).join('');document.body.appendChild(p);p.onclick=async e=>{const x=e.target.dataset.react;if(!x)return;if(SUPABASE_READY){const {error}=await sb.from('tevlo_message_reactions').upsert({message_id:msgId,user_id:state.user.id,reaction:x});if(error)return toast(error.message)}toast(x);p.remove()};setTimeout(()=>p.remove(),5000)}
function setup(){if(localStorage.getItem('tevlo_dark')==='true')document.body.classList.add('dark');renderAuth('login');if(!SUPABASE_READY)return;sb.auth.getSession().then(async({data,error})=>{if(error)return toast('Could not restore your session. Please log in.');if(data.session)await afterAuth(data.session.user)}).catch(()=>toast('Could not connect to login service.'));sb.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_IN'&&session)await afterAuth(session.user);if(event==='SIGNED_OUT')renderAuth('login')})}
setup();
let tevloSending=false;
async function tevloReliableSend(){
 if(tevloSending)return;
 if(!SUPABASE_READY){if(typeof sendCurrent==='function')return sendCurrent();return;}
 const input=$("#composerText"),c=state.conversations?.find(x=>x.id===state.active),body=(input?.value||"").trim();
 if(!input||!c||!body)return;
 tevloSending=true;const btn=$("#sendBtn");if(btn){btn.disabled=true;btn.textContent="…";}
 try{const ttl=state.disappear?.[c.id]||0;const {error}=await sb.from("tevlo_messages").insert({conversation_id:c.id,sender_id:state.user.id,body,type:"text",reply_to_id:state.replyTo||null,expires_at:ttl?new Date(Date.now()+ttl*1000).toISOString():null});if(error)throw error;input.value="";if(state.drafts){delete state.drafts[c.id];localStorage.setItem("tevlo_drafts",JSON.stringify(state.drafts));}state.replyTo=null;input.placeholder="Message";if(typeof autoSize==='function')autoSize();await openConversation(c.id)}catch(err){console.error(err);toast("Could not send: "+(err?.message||"Please try again."))}finally{tevloSending=false;if(btn){btn.disabled=false;btn.textContent="↑";}}}

document.addEventListener("click",async e=>{const b=e.target.closest("button,[data-conv],[data-person],[data-filter]");if(!b)return;const id=b.id;
 if(id==="sendBtn"){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();await tevloReliableSend();return}
 if(id==="newChat"||id==="emptyNew"){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();newChatModal();return}
 if(id==="peopleBtn"){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();peopleModal();return}
 if(id==="profileBtn"){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();profileModal();return}
 if(id==="settingsBtn"){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();settingsModal();return}
 if(id==="notificationsBtn"){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();notificationsModal();return}
 if(id==="requestsBtn"){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();requestsModal();return}
 const conv=b.closest("[data-conv]");if(conv){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();openConversation(conv.dataset.conv);return}
 const person=b.closest("[data-person]");if(person){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();startConversation(person.dataset.person);return}
 const filter=b.closest("[data-filter]");if(filter){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();state.filter=filter.dataset.filter;document.querySelectorAll('.filter-tab').forEach(x=>x.classList.toggle('active',x===filter));renderConversationList();return}
 const call={
 backBtn:()=>document.querySelector('.shell')?.classList.remove('chat-open'),
 searchChatBtn:()=>{$('#chatSearchBar')?.classList.remove('hidden');$('#chatSearchInput')?.focus()},
 closeChatSearch:()=>{$('#chatSearchBar')?.classList.add('hidden');if($('#chatSearchInput'))$('#chatSearchInput').value='';renderMessages()},
 plusBtn:()=>{$('#emojiPanel')?.classList.toggle('hidden');$('#stickerPanel')?.classList.add('hidden')},
 stickerBtn:()=>{$('#stickerPanel')?.classList.toggle('hidden');$('#emojiPanel')?.classList.add('hidden')},
 mediaBtn:()=>$('#mediaInput')?.click(),recordBtn:()=>toggleRecorder(),chatMenuBtn:()=>$('#chatMenu')?.classList.toggle('hidden'),favoriteBtn:()=>toggleFavorite(state.active),pinBtn:()=>togglePin(state.active),
 themeBtn:()=>{const c=state.conversations?.find(x=>x.id===state.active);if(c)themeModal(c)},disappearBtn:()=>{const c=state.conversations?.find(x=>x.id===state.active);if(c)disappearModal(c)},
 clearDraft:()=>{const c=state.conversations?.find(x=>x.id===state.active);if(c){delete state.drafts[c.id];localStorage.setItem('tevlo_drafts',JSON.stringify(state.drafts));if($('#composerText'))$('#composerText').value='';autoSize();toast('Draft cleared.')}},
 muteChat:()=>toast('Conversation muted.'),removeFriend:()=>{const c=state.conversations?.find(x=>x.id===state.active);if(c)removeFriend(c)},blockUser:()=>{const c=state.conversations?.find(x=>x.id===state.active);if(c)blockUser(c)},reportUser:()=>{const c=state.conversations?.find(x=>x.id===state.active);if(c)reportUser(c)}};
 if(call[id]){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();call[id]();return}
},true);
document.addEventListener("keydown",e=>{if(e.target?.id==="composerText"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();tevloReliableSend()}},true);

})();
</script>
</body>
