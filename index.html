<script>
(()=>{
const SUPABASE_URL="https://kcybwrdtnlflevndmzfn.supabase.co";
const SUPABASE_KEY="sb_publishable_XhOq8P5tdMgjWDKZEvgsgg_hcALWg48";
const SUPABASE_READY=true;
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}});
const $=(s,r=document)=>r.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),initials=n=>(String(n||"?").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"?"),fmtTime=d=>new Intl.DateTimeFormat([], {hour:'numeric',minute:'2-digit'}).format(new Date(d));
let state={user:null,profile:null,conversations:[],active:null,messages:[],friends:[],requests:[],typing:false,channel:null,search:"",online:true,notifications:false,filter:'all',pinned:new Set(JSON.parse(localStorage.getItem('tevlo_pinned')||'[]')),favorites:new Set(JSON.parse(localStorage.getItem('tevlo_favorites')||'[]')),theme:'default',drafts:JSON.parse(localStorage.getItem('tevlo_drafts')||'{}')};
function toast(msg){const el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}
function avatarHtml(p,big=false,online=false){const cl=big?'avatar big-avatar':'avatar';return `<div class="${cl}">${p?.avatar_url?`<img src="${esc(p.avatar_url)}" alt="">`:esc(initials(p?.name||p?.real_name))}${online?'<span class="online-dot"></span>':''}</div>`}
function renderAuth(mode='login',message=''){document.title='Tevlo — Log in';$('#root').innerHTML=`<div class="auth-wrap"><div class="auth-card"><div class="logo">Tevlo</div><div class="tagline">Private conversations. Beautifully simple.</div><div class="tabs"><button class="tab ${mode==='login'?'active':''}" id="loginTab">Log in</button><button class="tab ${mode==='signup'?'active':''}" id="signupTab">Create account</button></div><form id="authForm">${mode==='signup'?'<label>Name</label><input id="name" autocomplete="name" required placeholder="Your name">':''}<label>Email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><label>Password</label><input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="At least 6 characters"><button class="primary">${mode==='login'?'Log in':'Create account'}</button>${mode==='login'?'<button type="button" class="ghost" id="forgot" style="width:100%;margin-top:8px">Forgot password?</button>':''}${message?`<div class="${message.startsWith('Success')?'info':'error'}">${esc(message)}</div>`:''}</form></div></div>`;$('#loginTab').onclick=()=>renderAuth('login');$('#signupTab').onclick=()=>renderAuth('signup');$('#forgot')?.addEventListener('click',forgotPassword);$('#authForm').onsubmit=e=>{e.preventDefault();mode==='login'?login():signup()}}
async function login(){setBusy(true);const email=$('#email').value.trim(),password=$('#password').value;const {data,error}=await sb.auth.signInWithPassword({email,password});setBusy(false);if(error){renderAuth('login',error.status===400?'Login failed. Check your email and password.':error.message);return}await afterAuth(data.user)}
async function signup(){const name=$('#name').value.trim(),email=$('#email').value.trim(),password=$('#password').value;if(!name){renderAuth('signup','Please enter your name.');return}setBusy(true);const {data,error}=await sb.auth.signUp({email,password,data:{name}});setBusy(false);if(error){renderAuth('signup',error.message);return}if(data.user){const {error:pe}=await sb.from('profiles').upsert({id:data.user.id,real_name:name,username:(name.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,20)||'user')+'_'+data.user.id.slice(0,6),avatar_url:'',bio:'',last_seen:new Date().toISOString(),account_type:'real'});if(pe){toast(pe.message)}}renderAuth('login',data.session?'Success: your account is ready.':'Success: check your email for a confirmation link, then log in.')}
async function forgotPassword(){const email=$('#email')?.value.trim();if(!email){toast('Enter your email first.');return}const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href});toast(error?error.message:'Password reset email sent.')}
function setBusy(b){const btn=$('.primary');if(btn){btn.disabled=b;btn.textContent=b?'Please wait…':'Log in'}}
async function afterAuth(user){state.user=user;let {data:p}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(!p){const nm=user.user_metadata?.name||user.email?.split('@')[0]||'New user';await sb.from('profiles').upsert({id:user.id,real_name:nm,username:(nm.toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,20)||'user')+'_'+user.id.slice(0,6),avatar_url:'',bio:'',last_seen:new Date().toISOString(),account_type:'real'});const r=await sb.from('profiles').select('*').eq('id',user.id).single();p=r.data}state.profile={...p,name:p.real_name,email:user.email||'',username:p.username||''};await loadFriends();await loadConversations();subscribeRealtime();markOnline();renderApp()}
async function loadFriends(){const uid=state.user.id;const {data}=await sb.from('tevlo_friendships').select('*').or(`requester_id.eq.${uid},addressee_id.eq.${uid}`).eq('status','accepted');const ids=(data||[]).map(x=>x.requester_id===uid?x.addressee_id:x.requester_id);const {data:p}=ids.length?await sb.from('profiles').select('*').in('id',ids):{data:[]};state.peopleById=Object.fromEntries((p||[]).map(x=>[x.id,{...x,name:x.real_name}]));state.friends=ids;const {data:req}=await sb.from('tevlo_friendships').select('*').eq('addressee_id',uid).eq('status','pending');state.requests=req||[]}
async function loadConversations(){const uid=state.user.id;const {data:members,error}=await sb.from('tevlo_conversation_members').select('conversation_id').eq('user_id',uid);if(error){toast(error.message);return}const ids=(members||[]).map(x=>x.conversation_id);if(!ids.length){state.conversations=[];return}const {data:convs}=await sb.from('tevlo_conversations').select('*').in('id',ids).order('updated_at',{ascending:false});const allMembers={};for(const c of convs||[]){const {data:m}=await sb.from('tevlo_conversation_members').select('user_id').eq('conversation_id',c.id);allMembers[c.id]=m||[]}const otherIds=[...new Set(Object.values(allMembers).flat().map(x=>x.user_id).filter(id=>id!==uid))];const {data:p}=otherIds.length?await sb.from('profiles').select('*').in('id',otherIds):{data:[]};const pmap=Object.fromEntries((p||[]).map(x=>[x.id,{...x,name:x.real_name}]));state.conversations=(convs||[]).map(c=>{if(c.is_group)return {...c,name:c.name||'Group chat'};const oid=(allMembers[c.id]||[]).find(x=>x.user_id!==uid)?.user_id;return {...c,other_user_id:oid,profile:pmap[oid]||null,name:pmap[oid]?.name||'Conversation'}})}
function renderApp(){document.title='Tevlo — Messages';$('#root').innerHTML=`<div class="app"><div class="shell" id="shell"><aside class="sidebar"><div class="side-head"><div><div class="logo" style="font-size:28px">Tevlo</div><div class="stat">Messages</div></div><div style="display:flex;gap:6px"><button class="icon-btn" id="peopleBtn" title="Find people">👥</button><button class="icon-btn" id="newChat" title="New message">✎</button></div></div><div class="search-wrap"><input id="searchPeople" placeholder="Search conversations or people"></div>${state.requests.length?`<div class="requests"><button class="request-banner" id="requestsBtn"><span>Friend requests</span><b>${state.requests.length}</b></button></div>`:''}<div class="conversation-list" id="conversationList"></div><div style="padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px"><button class="secondary" id="profileBtn" style="flex:1;text-align:left">👤 ${esc(state.profile?.name||'Profile')}</button><button class="ghost" id="settingsBtn">⚙</button></div></aside><main class="main" id="mainPane"><div class="empty"><div class="empty-card"><div class="empty-icon">💬</div><h2 style="color:var(--text);margin-bottom:8px">Your messages</h2><p>Start a private conversation or find someone on Tevlo.</p><button class="primary" id="emptyNew" style="width:auto">New message</button></div></div></main></div></div>`;$('#conversationList').onclick=e=>{const el=e.target.closest('[data-conv]');if(el)openConversation(el.dataset.conv)};$('#searchPeople').oninput=e=>{state.search=e.target.value.toLowerCase();renderConversationList()};$('#newChat').onclick=newChatModal;$('#emptyNew').onclick=newChatModal;$('#peopleBtn').onclick=peopleModal;$('#requestsBtn')?.addEventListener('click',requestsModal);$('#profileBtn').onclick=profileModal;$('#settingsBtn').onclick=settingsModal;renderConversationList()}
function renderConversationList(){const q=state.search||'';let list=(state.conversations||[]).filter(c=>c.name?.toLowerCase().includes(q));if(state.filter==='unread')list=list.filter(c=>c.has_unread);if(state.filter==='groups')list=list.filter(c=>c.is_group);if(state.filter==='favorites')list=list.filter(c=>state.favorites.has(c.id));list.sort((a,b)=>{const ap=state.pinned.has(a.id)?1:0,bp=state.pinned.has(b.id)?1:0;return bp-ap||new Date(b.updated_at||0)-new Date(a.updated_at||0)});$('#conversationList').innerHTML=`<div style="display:flex;gap:6px;padding:4px 6px 10px;overflow:auto"><button class="secondary" style="padding:7px 10px" onclick="window.setFilter('all')">All</button><button class="ghost" style="padding:7px 10px" onclick="window.setFilter('unread')">Unread</button><button class="ghost" style="padding:7px 10px" onclick="window.setFilter('groups')">Groups</button><button class="ghost" style="padding:7px 10px" onclick="window.setFilter('favorites')">Favorites</button></div>`+(list.length?list.map(c=>`<div class="conv ${state.active===c.id?'active':''}" data-conv="${c.id}">${c.profile?avatarHtml(c.profile,false,isRecentlyOnline(c.profile)):avatarHtml({name:c.name})}<div class="conv-body"><div class="conv-top"><div class="conv-name">${state.pinned.has(c.id)?'📌 ':''}${state.favorites.has(c.id)?'⭐ ':''}${esc(c.name)}</div><div class="conv-time">${c.updated_at?fmtTime(c.updated_at):''}</div></div><div class="conv-preview">${esc(c.last_message||'No messages yet')}</div></div></div>`).join(''):`<div class="empty" style="height:220px"><div><div style="font-size:34px">🩵</div><p>${q?'No matches':'No conversations yet.'}</p></div></div>`)}
window.setFilter=f=>{state.filter=f;renderConversationList()};function isRecentlyOnline(p){return p?.last_seen&&Date.now()-new Date(p.last_seen).getTime()<90000}
async function openConversation(id){state.active=id;$('#shell').classList.add('chat-open');renderConversationList();const c=state.conversations.find(x=>x.id===id);if(!c)return;const {data,error}=await sb.from('tevlo_messages').select('*').eq('conversation_id',id).is('deleted_at',null).order('created_at',{ascending:true});if(error){toast(error.message);return}state.messages=data||[];state.replyTo=null;renderChat(c);await markRead(id);loadReactions()}

function renderMessages(){const wrap=$('#messages');if(!wrap)return;if(!state.messages.length){wrap.innerHTML='<div class="empty" style="height:100%"><div><div class="empty-icon">🩵</div><h3>Start the conversation</h3><p>Say hi and send your first message.</p></div></div>';return}wrap.innerHTML=state.messages.map(m=>{const mine=m.sender_id===state.user.id;let body=esc(m.body||'');if(m.media_url){if(m.type==='image')body+=`<div class="media-card"><img src="${esc(m.media_url)}" alt="Shared photo"></div>`;else if(m.type==='video')body+=`<div class="media-card"><video controls src="${esc(m.media_url)}"></video></div>`;else if(m.type==='audio')body+=`<div class="media-card audio-card"><audio controls src="${esc(m.media_url)}" style="width:100%"></audio></div>`;else body+=`<div class="media-card file-card"><div class="file-icon">📎</div><a href="${esc(m.media_url)}" target="_blank" rel="noopener">Open file</a></div>`}return `<div class="row ${mine?'mine':'theirs'}" data-msg="${m.id}"><div><div class="bubble">${m.reply_to_id?'<div class="reply-chip">Replying to a message</div>':''}${body}</div><div class="meta">${fmtTime(m.created_at)}${m.edited_at?' · edited':''}${mine?' · '+(m.read_at?'Read':'Delivered'):''}</div><div class="reaction-line" data-reactions="${m.id}"></div></div></div>`}).join('');wrap.scrollTop=wrap.scrollHeight;wrap.onclick=e=>{const m=e.target.closest('[data-msg]');if(!m)return;if(e.target.closest('.bubble'))messageContext(m.dataset.msg)};}

function searchChatModal(convId){const c=state.conversations.find(x=>x.id===convId);showModal(`<div class="modal-head"><h2>Search conversation</h2><button class="ghost" data-close>✕</button></div><input id="chatSearch" placeholder="Search messages"><div id="chatResults" style="margin-top:12px"></div>`);$('#chatSearch').oninput=()=>{const q=$('#chatSearch').value.toLowerCase();$('#chatResults').innerHTML=state.messages.filter(m=>(m.body||'').toLowerCase().includes(q)).map(m=>`<div class="settings-row"><span>${esc(m.body)}</span><span class="stat">${fmtTime(m.created_at)}</span></div>`).join('')||'<div class="stat">No matching messages.</div>'}}
function showModal(inner){const b=document.createElement('div');b.className='modal-backdrop';b.id='modal';b.innerHTML=`<div class="modal">${inner}</div>`;document.body.appendChild(b);b.querySelector('[data-close]')?.addEventListener('click',closeModal);b.addEventListener('click',e=>{if(e.target===b)closeModal()})}function closeModal(){$('#modal')?.remove()}
async function removeFriend(c){if(!c.profile?.id)return;if(!confirm(`Remove ${c.name} as a friend?`))return;const other=c.profile.id;const {error}=await sb.from('tevlo_friendships').delete().or(`and(requester_id.eq.${state.user.id},addressee_id.eq.${other}),and(requester_id.eq.${other},addressee_id.eq.${state.user.id})`);if(error)toast(error.message);else{toast('Friend removed.');await loadFriends();await loadConversations();renderApp()}}
async function blockUser(c){const other=c.profile?.id;if(!other)return;const {error}=await sb.from('tevlo_blocks').upsert({blocker_id:state.user.id,blocked_id:other});toast(error?error.message:'User blocked.')}}async function reportUser(c){const other=c.profile?.id;if(!other)return;const reason=prompt('Why are you reporting this user?')||'';const {error}=await sb.from('tevlo_reports').insert({reporter_id:state.user.id,reported_id:other,reason:reason.slice(0,500)});toast(error?'Could not submit report.':'Report submitted.')}
function setup(){state.notifications=localStorage.getItem('tevlo_notifications')==='true';state.online=localStorage.getItem('tevlo_online')!=='false';state.themeByConv=JSON.parse(localStorage.getItem('tevlo_themes')||'{}');if(localStorage.getItem('tevlo_dark')==='true')document.body.classList.add('dark');sb.auth.getSession().then(async({data})=>{if(data.session)await afterAuth(data.session.user);else renderAuth('login')});sb.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_IN'&&session)await afterAuth(session.user)})}
setup();
})();
</script>
