html,body{background:#061b12!important;color:#ecfff5!important}
.auth-wrap{background:radial-gradient(circle at 20% 10%,rgba(57,217,138,.18),transparent 28%),radial-gradient(circle at 90% 80%,rgba(19,138,91,.2),transparent 34%),#061b12!important}
.auth-card,.sidebar,.main,.chat-head,.composer,.modal,.chat-menu,.message-menu,.reaction-picker,.emoji-panel,.sticker-panel{background:#0d2d20!important;color:#ecfff5!important;border-color:#245641!important}
.main,.messages{background:linear-gradient(145deg,#071f16,#0b2b1e,#08251a)!important}
input,textarea,.search-wrap input,.composer textarea,.settings-card{background:#0a2419!important;color:#ecfff5!important;border-color:#245641!important}
.tab.active,.theme-choice,.choice-row,.notification-row,.profile-mini,.file-card,.media-card{background:#103625!important;color:#ecfff5!important;border-color:#245641!important}
.tab,.filter-tab,.ghost{color:#a9d8bd!important}
.secondary,.icon-btn,.tool-round{background:#123f2c!important;color:#55e69a!important}
.primary,.send{background:linear-gradient(135deg,#25c978,#0f8b58)!important;color:#f2fff8!important;box-shadow:0 10px 28px rgba(37,201,120,.25)!important}
.mine .bubble{background:linear-gradient(135deg,#159f63,#0b7448)!important;color:#effff7!important}
.theirs .bubble{background:#174d37!important;color:#eafff3!important}
.conv:hover,.user-result:hover,.friend-row:hover,.chat-menu button:hover,.message-menu button:hover,.emoji-panel button:hover,.sticker-panel button:hover{background:#123f2c!important}
.conv.active,.filter-tab.active,.choice-row.selected{background:#15523a!important;color:#eafff3!important}
.reaction,.reaction-picker button{background:#123f2c!important;color:#eafff3!important;border-color:#2b654c!important}
.profile-avatar-wrap{background:#0d2d20!important}.icon-badge{border-color:#0d2d20!important}.switch:after{background:#c9f6dc!important}
button{transition:transform .12s ease,filter .12s ease,box-shadow .12s ease}button:hover{filter:brightness(1.08)}button:active{transform:scale(.96)!important}button:focus-visible{outline:3px solid #39d98a!important;outline-offset:2px!important}

/* Tevlo calling experience */
.call-actions{display:flex;gap:6px;align-items:center}
.call-action{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#123f2c;color:#55e69a;font-size:18px;border:1px solid #245641}
.call-action:hover{background:#18563b;box-shadow:0 5px 16px rgba(37,201,120,.14)}
.call-overlay{position:fixed;inset:0;z-index:120;background:rgba(2,12,8,.82);backdrop-filter:blur(18px);display:grid;place-items:center;padding:18px;color:#effff6}
.call-card{width:min(460px,100%);border:1px solid #286247;background:linear-gradient(155deg,#103b29,#071b12);border-radius:30px;padding:30px 24px;text-align:center;box-shadow:0 30px 100px rgba(0,0,0,.45)}
.call-avatar{width:94px;height:94px;border-radius:30px;background:linear-gradient(135deg,#29d681,#087448);display:grid;place-items:center;margin:8px auto 18px;font-size:30px;font-weight:850;color:#f2fff8;box-shadow:0 12px 38px rgba(37,201,120,.22)}
.call-status{color:#a7d7bb;font-size:14px;margin:8px 0 22px}
.call-video-stage{position:relative;overflow:hidden;background:#06150e;border-radius:22px;min-height:220px;aspect-ratio:4/5;margin:18px 0}
.call-video-stage video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.call-video-stage .call-local-video{width:94px;height:128px;left:auto;top:12px;right:12px;border:1px solid #6ce8a5;border-radius:14px;box-shadow:0 5px 20px #0008}
.call-controls{display:flex;justify-content:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.call-control{min-width:58px;height:58px;padding:0 16px;border-radius:20px;background:#174b35;color:#edfff5;font-size:20px;border:1px solid #286247}
.call-control small{display:block;font-size:10px;margin-top:2px}
.call-control.danger{background:#d94351;border-color:#f26a76;color:white}
.call-control.accept{background:#1cb76b;border-color:#40db8b;color:#042b19}
.call-control.active{background:#d5f9e5;color:#07512e}
.call-video-toggle{position:absolute;right:12px;bottom:12px;background:#123f2c;color:#ecfff5;border:1px solid #357756;border-radius:12px;padding:10px}
.call-error{color:#ffd1d7;font-size:12px;margin-top:12px}
@media(max-width:800px){.call-actions{gap:2px}.call-action{width:36px;height:36px}.call-card{padding:24px 18px}.call-video-stage{aspect-ratio:3/4}}


/* Tevlo Messages-inspired redesign: real layout, calmer iconography, lively green accents */
:root{--teal:#087f50;--teal-dark:#075f3d;--teal-2:#e4f8ed;--teal-3:#c4efd8;--bg:#edf3ef;--card:#fff;--text:#172820;--muted:#718078;--line:#dce7e0;--shadow:0 18px 55px rgba(15,55,35,.12);--radius:22px}

async function toggleRecorder(){if(recorder&&recorder.state==='recording'){recorder.stop();return}if(!navigator.mediaDevices?.getUserMedia)return toast('Voice messages are not supported in this browser.');try{recordStream=await navigator.mediaDevices.getUserMedia({audio:true});recordChunks=[];recorder=new MediaRecorder(recordStream);recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};recorder.onstop=async()=>{try{const blob=new Blob(recordChunks,{type:'audio/webm'});pendingFiles.push(new File([blob],`voice-${Date.now()}.webm`,{type:'audio/webm'}));previewFiles(pendingFiles)}finally{recordStream?.getTracks().forEach(t=>t.stop());recordStream=null;$('#recordBtn')?.classList.remove('recording')}};recorder.start();$('#recordBtn').classList.add('recording');toast('Recording voice message… tap 🎙 again to stop.')}catch(e){toast('Microphone permission was not granted.')}}

async function renderMessages(){const wrap=$('#messages');if(!wrap)return;const q=($('#chatSearchInput')?.value||'').toLowerCase();const visible=state.messages.filter(m=>!q||String(m.body||'').toLowerCase().includes(q));if(!visible.length){wrap.innerHTML='<div class="empty" style="height:100%"><div><div class="empty-icon">🩵</div><h3>Start the conversation</h3><p>Say hi and send your first message.</p></div></div>';return}const rows=[];for(const m of visible){const mine=m.sender_id===state.user?.id||m.sender_id==='me';let content=esc(m.body);if(m.media_url){const url=await getMediaUrl(m.media_url);if(url&&m.type==='image')content=`<div class="media-card"><img src="${esc(url)}" alt="Attachment"></div>${content?`<div style="margin-top:6px">${content}</div>`:''}`;else if(url&&m.type==='video')content=`<div class="media-card"><video src="${esc(url)}" controls playsinline></video>${content?`<div style="margin-top:6px">${content}</div>`:''}`;else if(url&&m.type==='audio')content=`<div class="media-card audio-card"><audio src="${esc(url)}" controls></audio></div>${content?`<div style="margin-top:6px">${content}</div>`:''}`;else if(url)content=`<a class="media-card file-card" href="${esc(url)}" target="_blank" rel="noopener"><span class="file-icon">↧</span><span>${esc(m.body||'File')}</span></a>`}rows.push(`<div class="row ${mine?'mine':'theirs'}" data-msg="${esc(m.id)}"><div class="message-stack"><div class="bubble">${m.reply_to_id?'<div class="reply-chip">Replying to a message</div>':''}${content}</div><div class="message-actions"><button class="mini-action" data-react-msg="${esc(m.id)}">☺</button><button class="mini-action" data-reply-msg="${esc(m.id)}">↩</button>${mine?`<button class="mini-action" data-more-msg="${esc(m.id)}">•••</button>`:''}</div><div class="meta">${fmtTime(m.created_at)}${m.edited_at?' · edited':''}${m.read_at?' · Read':''}</div></div></div>`)}wrap.innerHTML=rows.join('');wrap.scrollTop=wrap.scrollHeight}
async function sendCurrent(){const input=$('#composerText'),body=input?.value.trim(),c=state.conversations.find(x=>x.id===state.active);if(!c)return;if(!body&&!pendingFiles.length)return;if(body.length>4000)return toast('Message is too long.');if(!SUPABASE_READY||c.is_self){const msg={id:'note-'+Date.now(),sender_id:state.user?.id||'me',body:body||pendingFiles.map(f=>`📎 ${f.name}`).join(' · '),created_at:new Date().toISOString(),type:pendingFiles.length?'file':'text'};if(c.is_self){const key='tevlo_self_notes_'+state.user.id;const saved=JSON.parse(localStorage.getItem(key)||'[]');saved.push(msg);localStorage.setItem(key,JSON.stringify(saved));}else{(demoData.messages[c.id] ||= []).push(msg)}c.last_message=msg.body;c.updated_at=msg.created_at;state.messages.push(msg);input.value='';pendingFiles=[];$('#attachmentPreview').innerHTML='';delete state.drafts[c.id];localStorage.setItem('tevlo_drafts',JSON.stringify(state.drafts));autoSize();await renderMessages();renderConversationList();return}try{const ttl=state.disappear[c.id]||0;if(body){const {error}=await sb.from('tevlo_messages').insert({conversation_id:c.id,sender_id:state.user.id,body,type:'text',reply_to_id:state.replyTo||null,expires_at:ttl?new Date(Date.now()+ttl*1000).toISOString():null});if(error)throw error}for(const file of pendingFiles){const path=await uploadFile(file,c.id),type=file.type.startsWith('image/')?'image':file.type.startsWith('video/')?'video':file.type.startsWith('audio/')?'audio':'file';const {error}=await sb.from('tevlo_messages').insert({conversation_id:c.id,sender_id:state.user.id,body:file.name,type,media_url:path,reply_to_id:state.replyTo||null,expires_at:ttl?new Date(Date.now()+ttl*1000).toISOString():null});if(error)throw error}input.value='';delete state.drafts[c.id];localStorage.setItem('tevlo_drafts',JSON.stringify(state.drafts));pendingFiles=[];$('#attachmentPreview').innerHTML='';$('#mediaInput').value='';state.replyTo=null;autoSize();await openConversation(c.id)}catch(e){console.error(e);toast(e?.message||'Could not send the message.')}}

function subscribeRealtime(){if(!SUPABASE_READY)return;if(state.channel)sb.removeChannel(state.channel);state.channel=sb.channel('tevlo-global',{config:{broadcast:{self:false}}});state.channel.on('postgres_changes',{event:'INSERT',schema:'public',table:'tevlo_messages'},payload=>{if(payload.new.sender_id===state.user.id)return;const c=state.conversations.find(x=>x.id===payload.new.conversation_id);if(c){c.last_message=payload.new.body;c.updated_at=payload.new.created_at;if(state.active===payload.new.conversation_id){state.messages.push(payload.new);renderMessages();markRead(state.active)}else{state.unread.add(payload.new.conversation_id);pushNotification('New message','You received a new Tevlo message.')}renderConversationList()}}).on('broadcast',{event:'typing'},payload=>{if(payload.payload?.user_id!==state.user.id&&state.active){$('#typingLabel').textContent='Typing…';setTimeout(()=>$('#typingLabel').textContent='',1200)}}).subscribe()}

let tevloCallChannel=null,tevloCall=null,tevloPendingCall=null;
function callSignalChannelName(){return 'tevlo-calls'}
function callSignalSend(to,payload){if(!tevloCallChannel||!to)return Promise.resolve();return tevloCallChannel.send({type:'broadcast',event:'signal',payload:{...payload,to,from:state.user.id}})}
function setupCallSignaling(){
 if(!SUPABASE_READY||!state.user?.id||!sb?.channel)return;
 if(tevloCallChannel){try{sb.removeChannel(tevloCallChannel)}catch(e){}}
 tevloCallChannel=sb.channel(callSignalChannelName(),{config:{private:true,broadcast:{self:false}}});
 tevloCallChannel.on('broadcast',{event:'signal'},({payload})=>handleCallSignal(payload)).subscribe(status=>{if(status==='CHANNEL_ERROR')console.warn('Tevlo call signaling channel error')});
}
function showCallOverlay({name,mode,status='Connecting…',incoming=false,video=false}){
 document.querySelector('.call-overlay')?.remove();
 const overlay=document.createElement('div');overlay.className='call-overlay';overlay.id='callOverlay';
 overlay.innerHTML=`<section class="call-card"><div class="stat" style="color:#7de8ad;letter-spacing:.16em;text-transform:uppercase;font-weight:800;font-size:10px">TEVLO · ${mode==='video'?'VIDEO CALL':'VOICE CALL'}</div><div class="call-avatar" id="callAvatar">${esc(initials(name))}</div><h2 id="callName" style="margin:0;font-size:27px;letter-spacing:-.04em">${esc(name)}</h2><div class="call-status" id="callStatus">${esc(status)}</div><div class="call-video-stage ${mode==='video'?'':'hidden'}" id="callVideoStage"><video id="remoteCallVideo" autoplay playsinline></video><video id="localCallVideo" class="call-local-video" autoplay muted playsinline></video><button class="call-video-toggle" id="callVideoToggle">▣ Camera off</button></div><div class="call-controls" id="callControls">${incoming?'<button class="call-control danger" id="declineCall">✕<small>Decline</small></button><button class="call-control accept" id="acceptCall">☎<small>Accept</small></button>':`<button class="call-control" id="muteCall">🎙<small>Mute</small></button>${mode==='video'?'<button class="call-control" id="cameraCall">▣<small>Camera</small></button>':''}<button class="call-control danger" id="endCall">☎<small>End call</small></button>`}</div><div class="call-error hidden" id="callError"></div></section>`;
 document.body.appendChild(overlay);
 $('#declineCall')?.addEventListener('click',()=>finishCall(true,'Call declined'));
 $('#acceptCall')?.addEventListener('click',acceptIncomingCall);
 $('#endCall')?.addEventListener('click',()=>finishCall(true,'Call ended'));
 $('#muteCall')?.addEventListener('click',toggleCallMute);
 $('#cameraCall')?.addEventListener('click',toggleCallCamera);
 $('#callVideoToggle')?.addEventListener('click',toggleCallCamera);
}
function callStatus(s){const el=$('#callStatus');if(el)el.textContent=s}
function callError(s){const el=$('#callError');if(el){el.textContent=s;el.classList.remove('hidden')}}
function attachCallMedia(){
 if(!tevloCall)return;
 const local=$('#localCallVideo'),remote=$('#remoteCallVideo');
 if(local&&tevloCall.localStream){local.srcObject=tevloCall.localStream}
 if(remote&&tevloCall.remoteStream){remote.srcObject=tevloCall.remoteStream}
 const stage=$('#callVideoStage');if(stage)stage.classList.toggle('hidden',tevloCall.mode!=='video');
}
async function createCallPeer(){
 if(!tevloCall)throw new Error('Call is no longer active.');
 const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]});
 tevloCall.pc=pc;tevloCall.remoteStream=new MediaStream();
 pc.ontrack=e=>{for(const track of e.streams[0]?.getTracks?.()||[e.track])if(!tevloCall.remoteStream.getTracks().some(t=>t.id===track.id))tevloCall.remoteStream.addTrack(track);attachCallMedia();callStatus('Connected')};
 pc.onicecandidate=e=>{if(e.candidate&&tevloCall)callSignalSend(tevloCall.peerId,{kind:'ice',callId:tevloCall.callId,conversationId:tevloCall.conversationId,mode:tevloCall.mode,data:e.candidate.toJSON()})};
 pc.onconnectionstatechange=()=>{if(!tevloCall)return;if(pc.connectionState==='connected')callStatus('Connected');if(['failed','disconnected'].includes(pc.connectionState))callStatus('Connection interrupted');if(pc.connectionState==='closed')callStatus('Call ended')};
 for(const track of tevloCall.localStream.getTracks())pc.addTrack(track,tevloCall.localStream);
 return pc;
}
async function startCall(mode){
 const c=state.conversations.find(x=>x.id===state.active);
 if(!c||c.is_group)return toast('Calling is available in one-to-one conversations.');
  if(!c.other_user_id&&SUPABASE_READY&&state.user?.id){try{const {data:member}=await sb.from('tevlo_conversation_members').select('user_id').eq('conversation_id',c.id).neq('user_id',state.user.id).maybeSingle();if(member?.user_id)c.other_user_id=member.user_id}catch(err){console.warn('Could not resolve call recipient',err)}}
  if(!c.other_user_id)return toast('Could not find the other person in this conversation.');
 if(!SUPABASE_READY)return toast('Sign in with a real Tevlo account to call. Preview mode cannot connect calls.');
 if(!navigator.mediaDevices?.getUserMedia||!window.RTCPeerConnection)return toast('Calling needs a recent browser with microphone/camera support.');
 if(tevloCall)return toast('Finish your current call first.');
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:mode==='video'});
  tevloCall={mode,peerId:c.other_user_id,conversationId:c.id,callId:crypto.randomUUID?.()||String(Date.now())+'-'+Math.random().toString(36).slice(2),localStream:stream,remoteStream:new MediaStream(),incoming:false,muted:false,cameraOff:false};
  showCallOverlay({name:c.name,mode,status:'Calling…',video:mode==='video'});attachCallMedia();
  const pc=await createCallPeer();
  await new Promise(resolve=>{if(tevloCallChannel?.state==='joined')resolve();else{const until=Date.now()+5000;const check=()=>{if(!tevloCall||Date.now()>until)return resolve();if(tevloCallChannel?.state==='joined')return resolve();setTimeout(check,100)};check()}});
  const offer=await pc.createOffer();await pc.setLocalDescription(offer);
  await callSignalSend(tevloCall.peerId,{kind:'offer',callId:tevloCall.callId,conversationId:c.id,mode,data:pc.localDescription.toJSON(),name:state.profile?.name||state.profile?.real_name||'Tevlo user'});
 }catch(err){console.error(err);callError(err?.message||'Could not start the call. Check microphone and camera permissions.');callStatus('Unable to connect');if(tevloCall?.localStream){tevloCall.localStream.getTracks().forEach(t=>t.stop());}}
}
async function handleCallSignal(p){
 if(!p||p.to!==state.user?.id||p.from===state.user?.id)return;
 if(p.kind==='offer'){
  if(tevloCall){callSignalSend(p.from,{kind:'busy',callId:p.callId,conversationId:p.conversationId});return}
  const c=state.conversations.find(x=>x.id===p.conversationId);const name=p.name||c?.name||'Tevlo user';
  tevloPendingCall={...p,name};
  showCallOverlay({name,mode:p.mode||'audio',status:'Incoming call',incoming:true,video:p.mode==='video'});
  return;
 }
 if(p.kind==='ice'&&!tevloCall&&tevloPendingCall?.callId===p.callId){(tevloPendingCall.queuedIce||=[]).push(p.data);return}
 if(!tevloCall||p.callId!==tevloCall.callId)return;
 try{
  if(p.kind==='answer'){await tevloCall.pc.setRemoteDescription(new RTCSessionDescription(p.data));callStatus('Connecting…');for(const candidate of tevloCall.queuedIce||[])await tevloCall.pc.addIceCandidate(new RTCIceCandidate(candidate));tevloCall.queuedIce=[]}
  if(p.kind==='ice'){if(tevloCall?.callId===p.callId){if(tevloCall.pc?.remoteDescription)await tevloCall.pc.addIceCandidate(new RTCIceCandidate(p.data));else(tevloCall.queuedIce||=[]).push(p.data)}else if(tevloPendingCall?.callId===p.callId)(tevloPendingCall.queuedIce||=[]).push(p.data);}
  if(p.kind==='hangup'||p.kind==='decline'||p.kind==='busy'){const msg=p.kind==='busy'?'User is busy':p.kind==='decline'?'Call declined':'Call ended';finishCall(false,msg)}
 }catch(err){console.error('Call signaling error',err);callError('Connection error. Please end the call and try again.')}
}
async function acceptIncomingCall(){
 const p=tevloPendingCall;if(!p)return;
 if(!navigator.mediaDevices?.getUserMedia)return callError('This browser does not support microphone or camera access.');
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:p.mode==='video'});
  tevloCall={mode:p.mode||'audio',peerId:p.from,conversationId:p.conversationId,callId:p.callId,localStream:stream,remoteStream:new MediaStream(),incoming:true,muted:false,cameraOff:false,queuedIce:p.queuedIce||[]};tevloPendingCall=null;
  showCallOverlay({name:p.name,mode:tevloCall.mode,status:'Connecting…',video:tevloCall.mode==='video'});attachCallMedia();
  const pc=await createCallPeer();await pc.setRemoteDescription(new RTCSessionDescription(p.data));
  for(const candidate of tevloCall.queuedIce||[])await pc.addIceCandidate(new RTCIceCandidate(candidate));tevloCall.queuedIce=[];
  const answer=await pc.createAnswer();await pc.setLocalDescription(answer);
  await callSignalSend(tevloCall.peerId,{kind:'answer',callId:tevloCall.callId,conversationId:tevloCall.conversationId,mode:tevloCall.mode,data:pc.localDescription.toJSON()});
 }catch(err){console.error(err);callError(err?.message||'Could not accept call. Check microphone/camera permissions.');callStatus('Unable to connect')}
}
async function finishCall(notify=true,message='Call ended'){
 const call=tevloCall,pending=tevloPendingCall;
 if(notify&&call)await callSignalSend(call.peerId,{kind:'hangup',callId:call.callId,conversationId:call.conversationId});
 if(notify&&pending)await callSignalSend(pending.from,{kind:'decline',callId:pending.callId,conversationId:pending.conversationId});
 if(call?.pc){call.pc.onicecandidate=null;call.pc.close()}
 if(call?.localStream)call.localStream.getTracks().forEach(t=>t.stop());
 if(call?.remoteStream)call.remoteStream.getTracks().forEach(t=>t.stop());
 tevloCall=null;tevloPendingCall=null;document.querySelector('.call-overlay')?.remove();
 if(message)toast(message);
}
function toggleCallMute(){
 if(!tevloCall)return;tevloCall.muted=!tevloCall.muted;
 for(const t of tevloCall.localStream.getAudioTracks())t.enabled=!tevloCall.muted;
 const b=$('#muteCall');if(b){b.classList.toggle('active',tevloCall.muted);b.innerHTML=tevloCall.muted?'🔇<small>Unmute</small>':'🎙<small>Mute</small>'}
}
function toggleCallCamera(){
 if(!tevloCall)return;tevloCall.cameraOff=!tevloCall.cameraOff;
 for(const t of tevloCall.localStream.getVideoTracks())t.enabled=!tevloCall.cameraOff;
 const b=$('#cameraCall')||$('#callVideoToggle');if(b){b.classList.toggle('active',tevloCall.cameraOff);b.innerHTML=tevloCall.cameraOff?'▧<small>Camera off</small>':'▣<small>Camera</small>'}
}

async function setup(){if(localStorage.getItem('tevlo_dark')==='true')document.body.classList.add('dark');if(!SUPABASE_READY){renderAuth('login','Login service is unavailable right now. Please refresh and try again.');return}root.innerHTML='<div class="auth-wrap"><div class="auth-card"><div class="logo">Tevlo</div><div class="tagline">Restoring your session…</div><div class="loading-dots" aria-label="Loading"></div></div></div>';try{const {data,error}=await sb.auth.getSession();if(error)throw error;if(data.session)await afterAuth(data.session.user);else renderAuth('login')}catch(e){console.error('Session restore failed',e);renderAuth('login','Could not restore your session. Please log in again.')}sb.auth.onAuthStateChange(async(event,session)=>{if(event==='SIGNED_IN'&&session)await afterAuth(session.user);if(event==='SIGNED_OUT'){state.user=null;state.profile=null;state.active=null;renderAuth('login')}})}
setup();
let tevloSending=false;
async function tevloReliableSend(){
 if(tevloSending)return;
 if(!SUPABASE_READY){if(typeof sendCurrent==='function')return sendCurrent();return;}
 const input=$("#composerText"),c=state.conversations?.find(x=>x.id===state.active),body=(input?.value||"").trim();
 if(!input||!c||!body)return;
 if(c.is_self)return sendCurrent();
 tevloSending=true;const btn=$("#sendBtn");if(btn){btn.disabled=true;btn.textContent="…";}
 try{const ttl=state.disappear?.[c.id]||0;const {error}=await sb.from("tevlo_messages").insert({conversation_id:c.id,sender_id:state.user.id,body,type:"text",reply_to_id:state.replyTo||null,expires_at:ttl?new Date(Date.now()+ttl*1000).toISOString():null});if(error)throw error;input.value="";if(state.drafts){delete state.drafts[c.id];localStorage.setItem("tevlo_drafts",JSON.stringify(state.drafts));}state.replyTo=null;input.placeholder="Message";if(typeof autoSize==='function')autoSize();await openConversation(c.id)}catch(err){console.error(err);toast("Could not send: "+(err?.message||"Please try again."))}finally{tevloSending=false;if(btn){btn.disabled=false;btn.textContent="↑";}}}

document.addEventListener("click",async e=>{const b=e.target.closest("button,[data-conv],[data-person],[data-filter]");if(!b)return;const id=b.id;
 if(id==="sendBtn"){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();await sendCurrent();return}
 if(id==="newChat"||id==="emptyNew"){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();newChatModal();return}
 if(id==="peopleBtn"){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();peopleModal();return}
 if(id==="profileBtn"){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();profileModal();return}
 if(id==="settingsBtn"){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();settingsModal();return}
 if(id==="notificationsBtn"){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();notificationsModal();return}
 if(id==="requestsBtn"){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();requestsModal();return}
 const callButton=b.closest("[data-call-mode]");if(callButton){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();startCall(callButton.dataset.callMode);return}
 const conv=b.closest("[data-conv]");if(conv){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();openConversation(conv.dataset.conv);return}
 const person=b.closest("[data-person]");if(person){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();startConversation(person.dataset.person);return}
 const filter=b.closest("[data-filter]");if(filter){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();state.filter=filter.dataset.filter;document.querySelectorAll('.filter-tab').forEach(x=>x.classList.toggle('active',x===filter));renderConversationList();return}
 const call={
 backBtn:()=>document.querySelector('.shell')?.classList.remove('chat-open'),
 searchChatBtn:()=>{$('#chatSearchBar')?.classList.remove('hidden');$('#chatSearchInput')?.focus()},
 closeChatSearch:()=>{$('#chatSearchBar')?.classList.add('hidden');if($('#chatSearchInput'))$('#chatSearchInput').value='';renderMessages()},
 plusBtn:()=>{$('#emojiPanel')?.classList.toggle('hidden');$('#stickerPanel')?.classList.add('hidden')},
 stickerBtn:()=>{$('#stickerPanel')?.classList.toggle('hidden');$('#emojiPanel')?.classList.add('hidden')},
 mediaBtn:()=>$('#mediaInput')?.click(),recordBtn:()=>toggleRecorder(),chatMenuBtn:()=>$('#chatMenu')?.classList.toggle('hidden'),favoriteBtn:()=>toggleFavorite(state.active),pinBtn:()=>togglePin(state.active),
 themeBtn:()=>{const c=state.conversations?.find(x=>x.id===state.active);if(c)themeModal(c)},disappearBtn:()=>{const c=state.conversations?.find(x=>x.id===state.active);if(c)disappearModal(c)},
 clearDraft:()=>{const c=state.conversations?.find(x=>x.id===state.active);if(c){delete state.drafts[c.id];localStorage.setItem('tevlo_drafts',JSON.stringify(state.drafts));if($('#composerText'))$('#composerText').value='';autoSize();toast('Draft cleared.')}},
 muteChat:()=>toast('Conversation muted.'),removeFriend:()=>{const c=state.conversations?.find(x=>x.id===state.active);if(c)removeFriend(c)},blockUser:()=>{const c=state.conversations?.find(x=>x.id===state.active);if(c)blockUser(c)},reportUser:()=>{const c=state.conversations?.find(x=>x.id===state.active);if(c)reportUser(c)}};
 if(call[id]){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();call[id]();return}
},true);
document.addEventListener("keydown",e=>{if(e.target?.id==="composerText"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation();tevloReliableSend()}},true);

})();
</script>

<script id="tevlo-upgrade-patch">
(()=>{
  const upgradeDefaults={theme:'dark-green',wallpaper:'forest',bubble:'#159f63',accent:'#25c978',sound:'soft',lastSeen:'friends',allowCalls:true,allowMessages:'friends',quietStart:'22:00',quietEnd:'07:00',quietEnabled:false,notifications:true,readReceipts:true,statusText:'',statusVisibility:'friends',pinnedMessages:[],mutedChats:[]};
  let upgradePrefs={...upgradeDefaults},callChannels=new Map(),callDurations=null,callStartedAt=0;
  const oldAfterAuth=afterAuth,oldRenderChat=renderChat,oldSettingsModal=settingsModal,oldRenderMessages=renderMessages;
  async function loadUpgradePrefs(){
    upgradePrefs={...upgradeDefaults,...JSON.parse(localStorage.getItem('tevlo_preferences')||'{}')};
    if(SUPABASE_READY&&state.user?.id){
      try{const {data}=await sb.from('tevlo_user_settings').select('preferences').eq('user_id',state.user.id).maybeSingle();if(data?.preferences)upgradePrefs={...upgradePrefs,...data.preferences};}catch(e){console.warn('Preferences load issue',e)}
    }
    localStorage.setItem('tevlo_preferences',JSON.stringify(upgradePrefs));applyUpgradePrefs();
  }
  async function saveUpgradePrefs(patch){
    upgradePrefs={...upgradePrefs,...patch};localStorage.setItem('tevlo_preferences',JSON.stringify(upgradePrefs));applyUpgradePrefs();
    if(SUPABASE_READY&&state.user?.id){const {error}=await sb.from('tevlo_user_settings').upsert({user_id:state.user.id,preferences:upgradePrefs,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)toast('Saved on this device; cloud sync failed.');}
  }
  function applyUpgradePrefs(){
    const rootStyle=document.documentElement.style;
    if(/^#[0-9a-f]{6}$/i.test(upgradePrefs.accent||'')){rootStyle.setProperty('--teal',upgradePrefs.accent);rootStyle.setProperty('--teal-dark',upgradePrefs.accent)}
    if(/^#[0-9a-f]{6}$/i.test(upgradePrefs.bubble||''))rootStyle.setProperty('--bubble-custom',upgradePrefs.bubble);
    document.body.classList.toggle('dark',upgradePrefs.theme==='dark-green'||upgradePrefs.theme==='dark');
    document.body.dataset.wallpaper=upgradePrefs.wallpaper||'forest';
    const msg=document.querySelector('.messages');if(msg){msg.style.backgroundImage=upgradePrefs.wallpaper==='ocean'?'linear-gradient(135deg,#082a39,#0a302a)':upgradePrefs.wallpaper==='sunset'?'linear-gradient(135deg,#352038,#492b2c)':upgradePrefs.wallpaper==='stars'?'radial-gradient(circle at 20% 20%,#24402e 1px,transparent 2px),linear-gradient(135deg,#071b14,#102a24)':upgradePrefs.wallpaper==='plain'?'none':'linear-gradient(145deg,#071f16,#0b2b1e,#08251a)';}
  }
  afterAuth=async function(user){await oldAfterAuth(user);await loadUpgradePrefs();setupCallSignaling();};
  callSignalChannelName=function(conversationId){return 'tevlo-call-'+conversationId};
  setupCallSignaling=function(){
    if(!SUPABASE_READY||!state.user?.id||!sb?.channel)return;
    for(const ch of callChannels.values()){try{sb.removeChannel(ch)}catch(e){}}
    callChannels.clear();
    for(const c of (state.conversations||[]).filter(x=>!x.is_self)){
      const topic=callSignalChannelName(c.id);
      const ch=sb.channel(topic,{config:{private:true,broadcast:{self:false}}});
      ch.on('broadcast',{event:'signal'},({payload})=>handleCallSignal(payload));
      ch.subscribe(status=>{if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')console.warn('Tevlo call channel issue',topic,status);});
      callChannels.set(c.id,ch);
    }
  };
  callSignalSend=async function(to,payload){
    if(!to||!state.user?.id||!payload?.conversationId)return {status:'error',error:'Missing call recipient or conversation.'};
    const ch=callChannels.get(payload.conversationId);
    if(!ch)throw new Error('Call channel is not ready for this conversation. Reopen the chat and try again.');
    if(ch.state!=='joined')await new Promise((resolve,reject)=>{const end=Date.now()+6000;const check=()=>{if(ch.state==='joined')return resolve();if(Date.now()>end)return reject(new Error('Secure call channel could not connect. Refresh Tevlo and try again.'));setTimeout(check,120)};check()});
    const result=await ch.send({type:'broadcast',event:'signal',payload:{...payload,to,from:state.user.id}});
    if(result?.status&&result.status!=='ok')throw new Error('Call signal could not be delivered ('+result.status+').');
    return result;
  };
  renderChat=async function(c){
    await oldRenderChat(c);
    if(c?.is_group){
      const tools=document.createElement('div');tools.className='upgrade-tools';tools.innerHTML='<button id="tevloGroupPoll">＋ Create poll</button><button id="tevloGroupEvent">＋ Plan event</button><button id="tevloGroupDetails">Group details</button>';
      const head=$('#mainPane .chat-head');if(head)head.insertAdjacentElement('afterend',tools);
      $('#tevloGroupPoll')?.addEventListener('click',()=>groupPollModal(c));
      $('#tevloGroupEvent')?.addEventListener('click',()=>groupEventModal(c));
      $('#tevloGroupDetails')?.addEventListener('click',()=>groupDetailsModal(c));
    }
  };
  settingsModal=function(){
    showModal('<div class="modal-head"><h2>Tevlo settings</h2><button class="ghost" data-close>✕</button></div><p class="upgrade-note">Your preferences sync to your Tevlo account when connected.</p><div class="upgrade-field"><label>Interface theme</label><select id="prefTheme"><option value="dark-green">Forest dark</option><option value="light">Light</option><option value="dark">Dark</option></select></div><div class="upgrade-field"><label>Chat wallpaper</label><select id="prefWallpaper"><option value="forest">Forest glow</option><option value="plain">Plain</option><option value="ocean">Ocean</option><option value="sunset">Sunset</option><option value="stars">Star field</option></select></div><div class="upgrade-field"><label>Accent color</label><input id="prefAccent" type="color" value="#25c978"></div><div class="upgrade-field"><label>Message bubble color</label><input id="prefBubble" type="color" value="#159f63"></div><div class="upgrade-field"><label>Who can call you?</label><select id="prefCalls"><option value="true">Friends and people I chat with</option><option value="false">Nobody</option></select></div><div class="upgrade-field"><label>Who can message you?</label><select id="prefMessages"><option value="friends">Friends</option><option value="everyone">Everyone on Tevlo</option></select></div><div class="upgrade-field"><label>Last seen visibility</label><select id="prefSeen"><option value="friends">Friends</option><option value="nobody">Nobody</option><option value="everyone">Everyone</option></select></div><div class="upgrade-field"><label>Profile status</label><input id="prefStatus" maxlength="80" placeholder="What are you up to?"></div><div class="upgrade-field"><label>Status visibility</label><select id="prefStatusVisibility"><option value="friends">Friends</option><option value="everyone">Everyone</option><option value="nobody">Nobody</option></select></div><div class="upgrade-field"><label>Quiet hours start</label><input id="prefQuietStart" type="time"></div><div class="upgrade-field"><label>Quiet hours end</label><input id="prefQuietEnd" type="time"></div><div class="settings-row"><b>Enable quiet hours</b><button class="switch" id="prefQuietEnabled" aria-label="Enable quiet hours"></button></div><div class="settings-row"><b>Browser notifications</b><button class="switch" id="prefNotifications" aria-label="Browser notifications"></button></div><div class="settings-row"><b>Read receipts</b><button class="switch" id="prefReadReceipts" aria-label="Read receipts"></button></div><button class="primary" id="saveUpgradePrefs">Save preferences</button><button class="secondary" id="openProfileUpgrade">Edit profile</button><button class="ghost" id="settingsSignout">Sign out</button>');
    const set=(id,v)=>{const el=$('#'+id);if(el)el.value=String(v)};
    set('prefTheme',upgradePrefs.theme);set('prefWallpaper',upgradePrefs.wallpaper);set('prefAccent',upgradePrefs.accent);set('prefBubble',upgradePrefs.bubble);set('prefCalls',upgradePrefs.allowCalls);set('prefMessages',upgradePrefs.allowMessages);set('prefSeen',upgradePrefs.lastSeen);set('prefStatus',upgradePrefs.statusText);set('prefStatusVisibility',upgradePrefs.statusVisibility);set('prefQuietStart',upgradePrefs.quietStart);set('prefQuietEnd',upgradePrefs.quietEnd);
    for(const [id,key] of [['prefQuietEnabled','quietEnabled'],['prefNotifications','notifications'],['prefReadReceipts','readReceipts']]){$('#'+id)?.classList.toggle('on',!!upgradePrefs[key]);$('#'+id).onclick=()=>$('#'+id).classList.toggle('on')}
    $('#saveUpgradePrefs').onclick=async()=>{await saveUpgradePrefs({theme:$('#prefTheme').value,wallpaper:$('#prefWallpaper').value,accent:$('#prefAccent').value,bubble:$('#prefBubble').value,allowCalls:$('#prefCalls').value==='true',allowMessages:$('#prefMessages').value,lastSeen:$('#prefSeen').value,statusText:$('#prefStatus').value.trim(),statusVisibility:$('#prefStatusVisibility').value,quietStart:$('#prefQuietStart').value||'22:00',quietEnd:$('#prefQuietEnd').value||'07:00',quietEnabled:$('#prefQuietEnabled').classList.contains('on'),notifications:$('#prefNotifications').classList.contains('on'),readReceipts:$('#prefReadReceipts').classList.contains('on')});state.notifications=upgradePrefs.notifications;state.readReceipts=upgradePrefs.readReceipts;closeModal();toast('Preferences saved.');renderApp()};
    $('#openProfileUpgrade').onclick=()=>{closeModal();profileModal()};
    $('#settingsSignout').onclick=async()=>{if(SUPABASE_READY)await sb.auth.signOut();location.reload()};
  };
  renderMessages=async function(){
    await oldRenderMessages();
    const wrap=$('#messages');if(!wrap||!SUPABASE_READY||!state.messages?.length)return;
    const ids=state.messages.map(m=>m.id).filter(id=>/^[0-9a-f-]{36}$/i.test(id));if(!ids.length)return;
    try{const {data,error}=await sb.from('tevlo_message_reactions').select('message_id,user_id,reaction').in('message_id',ids);if(error||!data?.length)return;
      const by={};for(const r of data)(by[r.message_id]||=[]).push(r);
      for(const [id,reactions] of Object.entries(by)){const row=wrap.querySelector('[data-msg="'+CSS.escape(id)+'"] .message-stack');if(!row)continue;const strip=document.createElement('div');strip.className='upgrade-reactions';strip.innerHTML=[...new Set(reactions.map(r=>r.reaction))].map(emoji=>'<button class="upgrade-reaction" data-reaction-msg="'+id+'" data-reaction="'+esc(emoji)+'">'+esc(emoji)+' '+reactions.filter(r=>r.reaction===emoji).length+'</button>').join('');row.appendChild(strip)}
    }catch(e){console.warn('Could not load message reactions',e)}
  };
  function groupPollModal(c){
    showModal('<div class="modal-head"><h2>Group poll</h2><button class="ghost" data-close>✕</button></div><label>Question</label><input id="pollQuestion" maxlength="300" placeholder="What should we do?"><label>Options (one per line)</label><textarea id="pollOptions" rows="4" placeholder="Go bowling&#10;Movie night"></textarea><button class="primary" id="createPollNow">Create poll</button><div id="pollList" class="settings-card">Loading polls…</div>');
    const refresh=async()=>{const {data,error}=await sb.from('tevlo_group_polls').select('*').eq('conversation_id',c.id).order('created_at',{ascending:false});const el=$('#pollList');if(!el)return;if(error){el.textContent='Polls could not load: '+error.message;return}if(!data?.length){el.textContent='No polls yet.';return}el.innerHTML=data.map(p=>'<div class="settings-card"><b>'+esc(p.question)+'</b><div class="choice-list">'+p.options.map((o,i)=>'<button class="choice-row" data-vote-poll="'+p.id+'" data-vote-index="'+i+'">'+esc(o)+'</button>').join('')+'</div></div>').join('')};
    $('#createPollNow').onclick=async()=>{const question=$('#pollQuestion').value.trim(),options=$('#pollOptions').value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,8);if(!question||options.length<2)return toast('Add a question and at least two options.');const {error}=await sb.from('tevlo_group_polls').insert({conversation_id:c.id,created_by:state.user.id,question,options});if(error)return toast('Could not create poll: '+error.message);$('#pollQuestion').value='';$('#pollOptions').value='';await refresh();toast('Poll created.')};
    $('#pollList').onclick=async e=>{const b=e.target.closest('[data-vote-poll]');if(!b)return;const {error}=await sb.from('tevlo_group_poll_votes').upsert({poll_id:b.dataset.votePoll,user_id:state.user.id,option_index:Number(b.dataset.voteIndex)},{onConflict:'poll_id,user_id'});if(error)return toast('Could not vote: '+error.message);toast('Vote saved.')};refresh();
  }
  function groupEventModal(c){
    showModal('<div class="modal-head"><h2>Plan a group event</h2><button class="ghost" data-close>✕</button></div><label>Event title</label><input id="eventTitle" maxlength="180" placeholder="Game night"><label>When?</label><input id="eventDate" type="datetime-local"><label>Details</label><textarea id="eventDetails" rows="3" placeholder="Place, plans, or what to bring"></textarea><button class="primary" id="saveGroupEvent">Create event</button><div id="eventList" class="settings-card">Loading events…</div>');
    const refresh=async()=>{const {data,error}=await sb.from('tevlo_group_events').select('*').eq('conversation_id',c.id).order('starts_at',{ascending:true});const el=$('#eventList');if(!el)return;if(error){el.textContent='Events could not load: '+error.message;return}el.innerHTML=data?.length?data.map(x=>'<div class="settings-card"><b>'+esc(x.title)+'</b><div class="stat">'+esc(x.starts_at?new Date(x.starts_at).toLocaleString():'Time not set')+'</div><p>'+esc(x.details||'')+'</p></div>').join(''):'No events planned yet.'};
    $('#saveGroupEvent').onclick=async()=>{const title=$('#eventTitle').value.trim();if(!title)return toast('Enter an event title.');const dt=$('#eventDate').value;const {error}=await sb.from('tevlo_group_events').insert({conversation_id:c.id,created_by:state.user.id,title,details:$('#eventDetails').value.trim(),starts_at:dt?new Date(dt).toISOString():null});if(error)return toast('Could not create event: '+error.message);$('#eventTitle').value='';await refresh();toast('Event added.')};refresh();
  }
  function groupDetailsModal(c){
    showModal('<div class="modal-head"><h2>Group details</h2><button class="ghost" data-close>✕</button></div><label>Group name</label><input id="groupEditName" maxlength="100"><label>Description</label><textarea id="groupEditDescription" maxlength="500" rows="3" placeholder="What is this group for?"></textarea><button class="primary" id="saveGroupDetails">Save group details</button>');
    $('#groupEditName').value=c.name||'';$('#groupEditDescription').value=c.description||'';
    $('#saveGroupDetails').onclick=async()=>{const name=$('#groupEditName').value.trim()||'Group chat',description=$('#groupEditDescription').value.trim();const {error}=await sb.from('tevlo_conversations').update({name,description}).eq('id',c.id);if(error)return toast('Could not save group details: '+error.message);c.name=name;c.description=description;closeModal();renderApp();toast('Group details saved.')};
  }
  document.addEventListener('click',async e=>{
    const reaction=e.target.closest('[data-reaction-msg]');if(reaction){e.preventDefault();const {error}=await sb.from('tevlo_message_reactions').upsert({message_id:reaction.dataset.reactionMsg,user_id:state.user.id,reaction:reaction.dataset.reaction},{onConflict:'message_id,user_id'});if(error)return toast('Reaction failed.');await renderMessages();return}
    const pin=e.target.closest('[data-more-msg]');if(pin){const id=pin.dataset.moreMsg;const action=prompt('Type edit, delete, pin, or cancel');if(action==='pin'){const pinned=new Set(upgradePrefs.pinnedMessages||[]);pinned.has(id)?pinned.delete(id):pinned.add(id);await saveUpgradePrefs({pinnedMessages:[...pinned]});toast(pinned.has(id)?'Message pinned on your account.':'Message unpinned.');return}}
  },true);
  const oldStartCall=startCall;
  startCall=async function(mode){
    if(!upgradePrefs.allowCalls)return toast('Calls are disabled in your privacy settings.');
    if(tevloCall)return toast('Finish your current call first.');
    await oldStartCall(mode);
    if(tevloCall){callStartedAt=Date.now();clearInterval(callDurations);callDurations=setInterval(()=>{if(!tevloCall){clearInterval(callDurations);return}const el=$('#callStatus');if(el&&tevloCall.pc?.connectionState==='connected'){const sec=Math.floor((Date.now()-callStartedAt)/1000);el.textContent='Connected · '+String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}},1000)}
  };
  const oldFinishCall=finishCall;
  finishCall=async function(notify=true,message='Call ended'){clearInterval(callDurations);callDurations=null;return oldFinishCall(notify,message)};
  // Ensure the call panel is always wired to conversation-specific private channels after conversations refresh.
  const oldLoadConversations=loadConversations;
  loadConversations=async function(){await oldLoadConversations();if(state.user?.id)setupCallSignaling()};
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state.user?.id)setupCallSignaling()});
})();
</script>
</body>
</html>
