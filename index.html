/* Keep the base interface light; live customization is applied by customApplyPrefs(). */
html,body{background:#edf3ef;color:#172820}
.auth-wrap{background:radial-gradient(circle at 20% 10%,rgba(37,153,94,.10),transparent 28%),radial-gradient(circle at 90% 80%,rgba(19,138,91,.08),transparent 34%),#edf3ef}
.auth-card,.sidebar,.main,.chat-head,.composer,.modal,.chat-menu,.message-menu,.reaction-picker,.emoji-panel,.sticker-panel{background:#fff;color:#172820;border-color:#dce7e0}
.main,.messages{background:#fff}
input,textarea,.search-wrap input,.composer textarea,.settings-card{background:#fbfdfc;color:#172820;border-color:#dce7e0}
.tab.active,.theme-choice,.choice-row,.notification-row,.profile-mini,.file-card,.media-card{background:#eef7f1;color:#172820;border-color:#dce7e0}
.tab,.filter-tab,.ghost{color:#64746b}
.secondary,.icon-btn,.tool-round{background:#eef5f0;color:#087f50}
.primary,.send{background:linear-gradient(135deg,#16965d,#087f50);color:#fff}
.mine .bubble{background:linear-gradient(135deg,#16965d,#087f50);color:#fff}
.theirs .bubble{background:#eef3ef;color:#172820}
.conv:hover,.user-result:hover,.friend-row:hover,.chat-menu button:hover,.message-menu button:hover,.emoji-panel button:hover,.sticker-panel button:hover{background:#f1f7f3}
.conv.active,.filter-tab.active,.choice-row.selected{background:#e1f5e8;color:#075f3d}
.reaction,.reaction-picker button{background:#eef5f0;color:#172820;border-color:#dce7e0}
.profile-avatar-wrap{background:#fff}.icon-badge{border-color:#fff}.switch:after{background:#fff}
button{transition:transform .12s ease,filter .12s ease,box-shadow .12s ease}button:hover{filter:brightness(.98)}button:active{transform:scale(.98)}button:focus-visible{outline:3px solid #39b77c;outline-offset:2px}
/* Tevlo calling experience */
.call-actions{display:flex;gap:6px;align-items:center}
.call-action{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:#123f2c;color:#55e69a;font-size:18px;border:1px solid #245641}
.call-action:hover{background:#18563b;box-shadow:0 5px 16px rgba(37,201,120,.14)}
.call-overlay{position:fixed;inset:0;z-index:120;background:rgba(2,12,8,.82);backdrop-filter:blur(18px);display:grid;place-items:center;padding:18px;color:#effff6}
.call-card{width:min(460px,100%);border:1px solid #286247;background:linear-gradient(155deg,#103b29,#071b12);border-radius:30px;padding:30px 24px;text-align:center;box-shadow:0 30px 100px rgba(0,0,0,.45)}
.call-avatar{width:94px;height:94px;border-radius:30px;background:linear-gradient(135deg,#29d681,#087448);display:grid;place-items:center;margin:8px auto 18px;font-size:30px;font-weight:850;color:#f2fff8;box-shadow:0 12px 38px rgba(37,201,120,.22)}
.call-status{color:#a7d7bb;font-size:14px;margin:8px 0 22px}
.call-video-stage{position:relative;overflow:hidden;background:#06150e;border-radius:22px;min-height:220px;aspect-ratio:4/5;margin:18px 0}
.call-video-stage video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.call-video-stage .call-local-video{width:94px;height:128px;left:auto;top:12px;right:12px;border:1px solid #6ce8a5;border-radius:14px;box-shadow:0 5px 20px #0008}
.call-controls{display:flex;justify-content:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.call-control{min-width:58px;height:58px;padding:0 16px;border-radius:20px;background:#174b35;color:#edfff5;font-size:20px;border:1px solid #286247}
.call-control small{display:block;font-size:10px;margin-top:2px}
.call-control.danger{background:#d94351;border-color:#f26a76;color:white}
.call-control.accept{background:#1cb76b;border-color:#40db8b;color:#042b19}
.call-control.active{background:#d5f9e5;color:#07512e}
.call-video-toggle{position:absolute;right:12px;bottom:12px;background:#123f2c;color:#ecfff5;border:1px solid #357756;border-radius:12px;padding:10px}
.call-error{color:#ffd1d7;font-size:12px;margin-top:12px}
@media(max-width:800px){.call-actions{gap:2px}.call-action{width:36px;height:36px}.call-card{padding:24px 18px}.call-video-stage{aspect-ratio:3/4}}


/* Tevlo Messages-inspired redesign: real layout, calmer iconography, lively green accents */
:root{--teal:#087f50;--teal-dark:#075f3d;--teal-2:#e4f8ed;--teal-3:#c4efd8;--bg:#edf3ef;--card:#fff;--text:#172820;--muted:#718078;--line:#dce7e0;--shadow:0 18px 55px rgba(15,55,35,.12);--radius:22px}
html,body{background:#edf3ef!important;color:#172820!important}
body{background:radial-gradient(ellipse at 80% 0%,#e0f8e9 0,transparent 36%),#edf3ef!important}
.app{padding:0}
.shell{height:100dvh;min-height:520px;background:#fff;overflow:hidden}
.sidebar{width:340px;min-width:300px;background:#f8fbf9!important;color:#172820!important;border-right:1px solid #dce7e0!important;box-shadow:8px 0 30px rgba(16,64,40,.035)!important}
.side-head{padding:25px 20px 16px}
.side-title{font-size:31px;letter-spacing:-1.6px;color:#087f50!important}

.head-icon-group{gap:7px}

.icon-btn:hover{background:#d8f4e3!important;transform:translateY(-2px)}
.search-wrap{padding:4px 18px 15px}

.filter-tabs{padding:0 18px 13px;gap:5px}
.filter-tab{padding:8px 12px;border-radius:10px;background:transparent!important;color:#6f8076!important;border:1px solid transparent;font-size:12px}
.filter-tab.active{background:#dff5e7!important;color:#087f50!important;border-color:#c8ecd5;font-weight:800}
.requests{padding:5px 18px 10px}
.request-banner{border:1px solid #c7ecd4;background:#e1f7e9!important;color:#087f50!important;border-radius:13px}
.conversation-list{padding:5px 10px 14px}
.conv{padding:12px 10px;margin:2px 0;border-radius:14px;gap:11px}
.conv:hover{background:#edf5f0!important;transform:none}
.conv.active{background:#e0f5e8!important;box-shadow:inset 3px 0 #0b9b5c}
.conv.active .conv-name{color:#075f3d}
.avatar{width:47px;height:47px;border-radius:16px;background:linear-gradient(145deg,#d9f5e4,#bde9cf)!important;color:#087f50!important;border:0!important}
.online-dot{border-color:#f8fbf9}
.conv-name{font-size:14px;font-weight:750;color:#23362b}
.conv-time{font-size:11px;color:#87958c}
.conv-preview{font-size:12px;color:#7a8980;margin-top:5px}
.unread-dot{width:8px;height:8px;background:#10a765}
.sidebar-foot{padding:13px 14px;border-color:#e1eae4!important}
.profile-mini{background:#eef5f0!important;color:#20372a!important;border:1px solid #e1ebe4;border-radius:14px}
.profile-mini small{color:#819087!important}
.main{background:#fff!important;min-width:0}
.empty{background:radial-gradient(ellipse at 50% 35%,#f1fcf5 0,#fff 58%)!important;color:#7b8c81}
.empty-card{max-width:400px}
.empty-icon{width:70px;height:70px;border-radius:22px;background:linear-gradient(145deg,#dff8e8,#c8f0d8)!important;color:#087f50!important;font-size:29px}
.empty-card h2{font-size:27px;letter-spacing:-.8px;color:#1c3326!important}
.empty-card p{font-size:14px;line-height:1.65;color:#829188}
.chat-head{height:78px;flex:0 0 78px;padding:12px 25px;background:rgba(255,255,255,.94)!important;border-bottom:1px solid #e4ece7!important;box-shadow:0 5px 22px rgba(18,60,38,.025)!important;gap:12px}
.chat-head>.avatar{width:44px;height:44px;border-radius:15px}
.chat-title{font-size:15px;color:#1a3023}
.chat-sub{font-size:12px;color:#7f9085}
.head-actions{gap:8px}
.head-actions .ghost{width:37px;height:37px;border-radius:12px;background:#f0f5f1!important;color:#4d6958!important;font-size:16px;padding:0}

async function renderChat(c){const profile=c.profile,theme=state.chatThemes[c.id]||'mint';$('#mainPane').innerHTML=`<div style="position:relative;height:100%;display:flex;flex-direction:column"><header class="chat-head"><button class="icon-btn mobile-only" id="backBtn">‹</button>${profile?avatarHtml(profile,false,profile.online):avatarHtml({name:c.name})}<div><div class="chat-title">${esc(c.name)}</div><div class="chat-sub">${c.is_group?'Group chat':'Tevlo conversation'}</div></div><div class="head-actions call-actions">${!c.is_group?`<button class="call-action" data-call-mode="audio" title="Start voice call" aria-label="Start voice call"><span class="call-symbol" aria-hidden="true">☎</span><span>Call</span></button><button class="call-action" data-call-mode="video" title="Start video call" aria-label="Start video call"><span class="call-symbol" aria-hidden="true">▣</span><span>Video</span></button>`:'' }<button class="ghost" id="searchChatBtn" title="Search messages">⌕</button><button class="ghost" id="chatMenuBtn" title="Chat options">•••</button></div><div class="chat-menu hidden" id="chatMenu"><button id="favoriteBtn">★ ${state.favorites.includes(c.id)?'Remove favorite':'Add to favorites'}</button><button id="pinBtn">⌖ ${state.pinned.includes(c.id)?'Unpin conversation':'Pin conversation'}</button><button id="themeBtn">Chat appearance</button><button id="disappearBtn">Disappearing messages</button><button id="clearDraft">Clear draft</button><button id="muteChat">Mute conversation</button><button id="removeFriend">Remove friend</button><button id="blockUser">Block</button><button id="reportUser">Report</button></div></header><div class="chat-search-bar hidden" id="chatSearchBar"><input id="chatSearchInput" placeholder="Search in this chat"><button class="ghost" id="closeChatSearch">✕</button></div><div class="messages theme-${theme}" id="messages"></div><div class="typing" id="typingLabel"></div><div id="attachmentPreview"></div><div class="composer"><div class="composer-tools"><input id="mediaInput" class="media-input" type="file" accept="image/*,video/*,audio/*,.pdf,.txt,.doc,.docx" multiple><button class="tool-round" id="mediaBtn" title="Photo, video or file">＋</button><button class="tool-round" id="recordBtn" title="Voice message">◖</button><div class="picker-wrap"><button class="tool-round" id="plusBtn" title="Emoji">☺</button><div class="emoji-panel hidden" id="emojiPanel">${['😀','😂','😍','🥹','👍','❤️','😭','😮','🎉','✨','😊','🙌','🔥','👏','💙','🩵','😎','🤗'].map(x=>`<button data-emoji="${x}">${x}</button>`).join('')}</div></div></div><textarea id="composerText" rows="1" placeholder="Message"></textarea><div class="picker-wrap"><button class="tool-round" id="stickerBtn" title="Stickers">＋</button><div class="sticker-panel hidden" id="stickerPanel">${['🩵','💬','✨','😊','😂','🙌','🌟','🎉','🫶','👍','💫','🐶'].map(x=>`<button data-sticker="${x}">${x}</button>`).join('')}</div></div><button class="round send" id="sendBtn">↑</button></div></div>`;await renderMessages();$('#searchChatBtn').onclick=()=>{$('#chatSearchBar').classList.remove('hidden');$('#chatSearchInput').focus()};$('#closeChatSearch').onclick=()=>{$('#chatSearchBar').classList.add('hidden');$('#chatSearchInput').value='';renderMessages()};$('#chatSearchInput').oninput=renderMessages;$('#backBtn')?.addEventListener('click',()=>$('.shell').classList.remove('chat-open'));$('#composerText').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendCurrent()}});$('#composerText').value=state.drafts[c.id]||'';autoSize();$('#composerText').addEventListener('input',()=>{autoSize();state.drafts[c.id]=$('#composerText').value;localStorage.setItem('tevlo_drafts',JSON.stringify(state.drafts));sendTyping()});$('#plusBtn').onclick=()=>{$('#emojiPanel').classList.toggle('hidden');$('#stickerPanel').classList.add('hidden')};$('#stickerBtn').onclick=()=>{$('#stickerPanel').classList.toggle('hidden');$('#emojiPanel').classList.add('hidden')};$('#emojiPanel').onclick=e=>{const x=e.target.dataset.emoji;if(x){insertText(x);$('#emojiPanel').classList.add('hidden')}};$('#stickerPanel').onclick=e=>{const x=e.target.dataset.sticker;if(x){insertText(x);$('#stickerPanel').classList.add('hidden')}};$('#mediaBtn').onclick=()=>$('#mediaInput').click();$('#mediaInput').onchange=e=>previewFiles([...e.target.files]);$('#recordBtn').onclick=toggleRecorder;$('#chatMenuBtn').onclick=()=>$('#chatMenu').classList.toggle('hidden');$('#favoriteBtn').onclick=()=>toggleFavorite(c.id);$('#pinBtn').onclick=()=>togglePin(c.id);$('#themeBtn').onclick=()=>themeModal(c);$('#disappearBtn').onclick=()=>disappearModal(c);$('#clearDraft').onclick=()=>{delete state.drafts[c.id];localStorage.setItem('tevlo_drafts',JSON.stringify(state.drafts));$('#composerText').value='';autoSize();toast('Draft cleared.')};$('#muteChat').onclick=()=>toast('Conversation muted.');$('#removeFriend').onclick=()=>removeFriend(c);$('#blockUser').onclick=()=>blockUser(c);$('#reportUser').onclick=()=>reportUser(c);$('#messages').onclick=e=>{const r=e.target.closest('[data-react-msg]'),rp=e.target.closest('[data-reply-msg]'),more=e.target.closest('[data-more-msg]'),m=e.target.closest('[data-msg]');if(!m)return;if(r){e.stopPropagation();showReactionPicker(r.dataset.reactMsg);return}if(rp){e.stopPropagation();setReplyTo(rp.dataset.replyMsg);return}if(more){e.stopPropagation();messageActions(more.dataset.moreMsg);return}if(e.target.closest('.bubble'))showReactionPicker(m.dataset.msg)}}
function previewFiles(files){pendingFiles=files.slice(0,6);const el=$('#attachmentPreview');if(!el)return;el.innerHTML=pendingFiles.length?`<div class="attachment-preview"><b>${pendingFiles.length} attachment${pendingFiles.length>1?'s':''}</b><span>${pendingFiles.map(f=>esc(f.name)).join(', ')}</span><button class="ghost" id="clearAttachments">Clear</button></div>`:'';$('#clearAttachments')?.addEventListener('click',()=>{pendingFiles=[];$('#mediaInput').value='';$('#attachmentPreview').innerHTML=''})}
async function uploadFile(file,conversationId){if(!SUPABASE_READY)return null;const ext=(file.name.split('.').pop()||'bin').toLowerCase(),path=`${conversationId}/${state.user.id}/${crypto.randomUUID()}.${ext}`;const {error}=await sb.storage.from('tevlo-media').upload(path,file,{upsert:false,contentType:file.type||undefined});if(error)throw error;return path}
async function toggleRecorder(){if(recorder&&recorder.state==='recording'){recorder.stop();return}if(!navigator.mediaDevices?.getUserMedia)return toast('Voice messages are not supported in this browser.');try{const prefs=JSON.parse(localStorage.getItem('tevlo_preferences')||'{}');recordStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:prefs.echoCancellation!==false,noiseSuppression:prefs.noiseSuppression!==false,autoGainControl:prefs.autoGainControl!==false}});recordChunks=[];const bitrate=prefs.voiceMessageQuality==='compact'?32000:prefs.voiceMessageQuality==='high-quality'?128000:64000;recorder=new MediaRecorder(recordStream,{audioBitsPerSecond:bitrate});recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};recorder.onstop=async()=>{try{const blob=new Blob(recordChunks,{type:'audio/webm'});pendingFiles.push(new File([blob],`voice-${Date.now()}.webm`,{type:'audio/webm'}));previewFiles(pendingFiles)}finally{recordStream?.getTracks().forEach(t=>t.stop());recordStream=null;$('#recordBtn')?.classList.remove('recording')}};recorder.start();$('#recordBtn').classList.add('recording');toast('Recording voice message… tap 🎙 again to stop.')}catch(e){toast('Microphone permission was not granted.')}}
function autoSize(){const t=$('#composerText');if(!t)return;t.style.height='auto';t.style.height=Math.min(140,t.scrollHeight)+'px'}
function insertText(x){const t=$('#composerText');if(!t)return;t.value+=x;t.focus();autoSize()}
async function getMediaUrl(path){if(!path||!SUPABASE_READY)return null;if(/^https?:\/\//i.test(path))return path;const {data,error}=await sb.storage.from('tevlo-media').createSignedUrl(path,3600);return error?null:data?.signedUrl||null}
async function renderMessages(){const wrap=$('#messages');if(!wrap)return;const q=($('#chatSearchInput')?.value||'').toLowerCase();const visible=state.messages.filter(m=>!q||String(m.body||'').toLowerCase().includes(q));if(!visible.length){wrap.innerHTML='<div class="empty" style="height:100%"><div><div class="empty-icon">🩵</div><h3>Start the conversation</h3><p>Say hi and send your first message.</p></div></div>';return}const rows=[];for(const m of visible){const mine=m.sender_id===state.user?.id||m.sender_id==='me';let content=esc(m.body);if(m.media_url){const url=await getMediaUrl(m.media_url);if(url&&m.type==='image')content=`<div class="media-card"><img src="${esc(url)}" alt="Attachment"></div>${content?`<div style="margin-top:6px">${content}</div>`:''}`;else if(url&&m.type==='video')content=`<div class="media-card"><video src="${esc(url)}" controls playsinline></video>${content?`<div style="margin-top:6px">${content}</div>`:''}`;else if(url&&m.type==='audio')content=`<div class="media-card audio-card"><audio src="${esc(url)}" controls></audio></div>${content?`<div style="margin-top:6px">${content}</div>`:''}`;else if(url)content=`<a class="media-card file-card" href="${esc(url)}" target="_blank" rel="noopener"><span class="file-icon">↧</span><span>${esc(m.body||'File')}</span></a>`}rows.push(`<div class="row ${mine?'mine':'theirs'}" data-msg="${esc(m.id)}"><div class="message-stack"><div class="bubble">${m.reply_to_id?'<div class="reply-chip">Replying to a message</div>':''}${content}</div><div class="message-actions"><button class="mini-action" data-react-msg="${esc(m.id)}">☺</button><button class="mini-action" data-reply-msg="${esc(m.id)}">↩</button>${mine?`<button class="mini-action" data-more-msg="${esc(m.id)}">•••</button>`:''}</div><div class="meta">${fmtTime(m.created_at)}${m.edited_at?' · edited':''}${m.read_at?' · Read':''}</div></div></div>`)}wrap.innerHTML=rows.join('');wrap.scrollTop=wrap.scrollHeight}
async function sendCurrent(){const input=$('#composerText'),body=input?.value.trim(),c=state.conversations.find(x=>x.id===state.active);if(!c)return;if(!body&&!pendingFiles.length)return;if(body.length>4000)return toast('Message is too long.');if(!SUPABASE_READY||c.is_self){const msg={id:'note-'+Date.now(),sender_id:state.user?.id||'me',body:body||pendingFiles.map(f=>`📎 ${f.name}`).join(' · '),created_at:new Date().toISOString(),type:pendingFiles.length?'file':'text'};if(c.is_self){const key='tevlo_self_notes_'+state.user.id;const saved=JSON.parse(localStorage.getItem(key)||'[]');saved.push(msg);localStorage.setItem(key,JSON.stringify(saved));}else{(demoData.messages[c.id] ||= []).push(msg)}c.last_message=msg.body;c.updated_at=msg.created_at;state.messages.push(msg);input.value='';pendingFiles=[];$('#attachmentPreview').innerHTML='';delete state.drafts[c.id];localStorage.setItem('tevlo_drafts',JSON.stringify(state.drafts));autoSize();await renderMessages();renderConversationList();return}try{const ttl=state.disappear[c.id]||0;if(body){const {error}=await sb.from('tevlo_messages').insert({conversation_id:c.id,sender_id:state.user.id,body,type:'text',reply_to_id:state.replyTo||null,expires_at:ttl?new Date(Date.now()+ttl*1000).toISOString():null});if(error)throw error}for(const file of pendingFiles){const path=await uploadFile(file,c.id),type=file.type.startsWith('image/')?'image':file.type.startsWith('video/')?'video':file.type.startsWith('audio/')?'audio':'file';const {error}=await sb.from('tevlo_messages').insert({conversation_id:c.id,sender_id:state.user.id,body:file.name,type,media_url:path,reply_to_id:state.replyTo||null,expires_at:ttl?new Date(Date.now()+ttl*1000).toISOString():null});if(error)throw error}input.value='';delete state.drafts[c.id];localStorage.setItem('tevlo_drafts',JSON.stringify(state.drafts));pendingFiles=[];$('#attachmentPreview').innerHTML='';$('#mediaInput').value='';state.replyTo=null;autoSize();await openConversation(c.id)}catch(e){console.error(e);toast(e?.message||'Could not send the message.')}}
function sendTyping(){if(!SUPABASE_READY||!state.channel||!state.active)return;clearTimeout(typingTimer);state.channel.send({type:'broadcast',event:'typing',payload:{user_id:state.user.id}}).catch(()=>{})}
function subscribeRealtime(){if(!SUPABASE_READY)return;if(state.channel)sb.removeChannel(state.channel);state.channel=sb.channel('tevlo-global',{config:{broadcast:{self:false}}});state.channel.on('postgres_changes',{event:'INSERT',schema:'public',table:'tevlo_messages'},payload=>{if(payload.new.sender_id===state.user.id)return;const c=state.conversations.find(x=>x.id===payload.new.conversation_id);if(c){c.last_message=payload.new.body;c.updated_at=payload.new.created_at;if(state.active===payload.new.conversation_id){state.messages.push(payload.new);renderMessages();markRead(state.active)}else{state.unread.add(payload.new.conversation_id);pushNotification('New message','You received a new Tevlo message.')}renderConversationList()}}).on('broadcast',{event:'typing'},payload=>{if(payload.payload?.user_id!==state.user.id&&state.active){$('#typingLabel').textContent='Typing…';setTimeout(()=>$('#typingLabel').textContent='',1200)}}).subscribe()}

function settingsModal(){showModal(`<div class="modal-head"><h2>Settings</h2><button class="ghost" data-close>✕</button></div><div class="settings-card"><div class="settings-row"><div><b>Online status</b><div class="stat">Show when you are online.</div></div><button class="switch ${state.online?'on':''}" id="setOnline"></button></div><div class="settings-row"><div><b>Browser notifications</b><div class="stat">Get alerts for new messages.</div></div><button class="switch ${state.notifications?'on':''}" id="setNotify"></button></div><div class="settings-row"><div><b>Dark mode</b><div class="stat">Use a darker interface.</div></div><button class="switch ${document.body.classList.contains('dark')?'on':''}" id="setDark"></button></div><div class="settings-row"><div><b>Read receipts</b><div class="stat">Let friends know when you have read messages.</div></div><button class="switch ${state.readReceipts?'on':''}" id="setRead"></button></div><div class="settings-row"><div><b>Friend requests</b><div class="stat">Allow people to send you requests.</div></div><button class="switch ${state.allowRequests?'on':''}" id="setRequests"></button></div></div><button class="primary" id="settingsProfile">Open profile</button><button class="ghost" id="settingsSignout">Sign out</button>`);$('#setOnline').onclick=()=>{state.online=!state.online;localStorage.setItem('tevlo_online',String(state.online));closeModal();renderApp()};$('#setNotify').onclick=async()=>{state.notifications=!state.notifications;localStorage.setItem('tevlo_notifications',String(state.notifications));if(state.notifications&&window.Notification?.permission==='default')await Notification.requestPermission();closeModal();toast(state.notifications?'Notifications enabled.':'Notifications disabled.')};$('#setDark').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('tevlo_dark',String(document.body.classList.contains('dark')));closeModal()};$('#setRead').onclick=()=>{state.readReceipts=!state.readReceipts function notificationsModal(){showModal(`<div class="modal-head"><h2>Notifications</h2><button class="ghost" data-close>✕</button></div>${state.notificationsList.length?state.notificationsList.map(n=>`<div class="settings-section"><b>${esc(n.title)}</b><div class="stat">${esc(n.body)}</div><div class="stat">${fmtTime(n.created_at)}</div></div>`).join(''):'<p class="stat">No notifications yet.</p>'}`)}

let tevloCallChannel=null,tevloCall=null,tevloPendingCall=null;
function callSignalChannelName(){return 'tevlo-calls'}
function callSignalSend(to,payload){if(!tevloCallChannel||!to)return Promise.resolve();return tevloCallChannel.send({type:'broadcast',event:'signal',payload:{...payload,to,from:state.user.id}})}
function setupCallSignaling(){
 if(!SUPABASE_READY||!state.user?.id||!sb?.channel)return;
 if(tevloCallChannel){try{sb.removeChannel(tevloCallChannel)}catch(e){}}
 tevloCallChannel=sb.channel(callSignalChannelName(),{config:{private:true,broadcast:{self:false}}});
 tevloCallChannel.on('broadcast',{event:'signal'},({payload})=>handleCallSignal(payload)).subscribe(status=>{if(status==='CHANNEL_ERROR')console.warn('Tevlo call signaling channel error')});
}
let tevloIncomingAlertTimer=null,tevloCallAudioContext=null,tevloRingtoneStep=0;
function tevloPrefs(){try{return JSON.parse(localStorage.getItem('tevlo_preferences')||'{}')}catch(e){return {}}}
function tevloQuietNow(p=tevloPrefs()){
 if(!p.quietEnabled)return false;
 const now=new Date(),cur=now.getHours()*60+now.getMinutes(),toMin=v=>{const a=String(v||'').split(':').map(Number);return (a[0]||0)*60+(a[1]||0)};
 const start=toMin(p.quietStart||'22:00'),end=toMin(p.quietEnd||'07:00');
 return start===end?true:start<end?(cur>=start&&cur<end):(cur>=start||cur<end);
}
function stopIncomingCallAlert(){if(tevloIncomingAlertTimer){clearInterval(tevloIncomingAlertTimer);tevloIncomingAlertTimer=null}tevloRingtoneStep=0;try{tevloCallAudioContext?.close()}catch(e){}tevloCallAudioContext=null}
function playTevloTone(frequency=900,duration=.13){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=new AC(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=frequency;gain.gain.setValueAtTime(.025,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+duration);osc.onended=()=>ctx.close()}catch(e){}}
function playTevloRingtone(preview=false){
 const p=tevloPrefs(),style=p.ringtoneStyle||'gentle',volume=Math.max(0,Math.min(100,Number(p.ringtoneVolume??55)))/100,pitch=Math.max(200,Math.min(1400,Number(p.ringtonePitch??740)));
 if(style==='off'||volume<=0){if(preview)toast('Ringtone is turned off or volume is zero.');return}
 try{
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC){if(preview)toast('This browser cannot preview the ringtone.');return}
  if(!tevloCallAudioContext||tevloCallAudioContext.state==='closed')tevloCallAudioContext=new AC();
  const ctx=tevloCallAudioContext;const patterns={gentle:[0,1],classic:[0,1,2], 'double-chime':[0,1],digital:[0,2,1,2],pulse:[0,0,1],bell:[0,2]};
  const notes=(patterns[style]||patterns.gentle),step=tevloRingtoneStep++%notes.length;
  const frequencies=style==='digital'?[pitch,pitch*1.25,pitch*.9]:style==='bell'?[pitch*1.15,pitch*.75,pitch]:style==='pulse'?[pitch*.8,pitch,pitch*1.1]:[pitch,pitch*1.12,pitch*.88];
  const osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=style==='digital'?'square':style==='bell'?'triangle':'sine';
  osc.frequency.value=frequencies[notes[step]%frequencies.length];gain.gain.setValueAtTime(Math.max(.001,volume*.075),ctx.currentTime);gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.22);
  osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.23);
 }catch(e){console.warn('Ringtone audio unavailable',e);if(preview)toast('Your browser blocked ringtone preview. Try clicking Preview ringtone again.')}
}
function startIncomingCallAlert(name,mode){
 stopIncomingCallAlert();const p=tevloPrefs();
 if(p.notifyCalls===false||p.notifications===false||tevloQuietNow(p))return;
 try{if(p.notifyDesktop!==false&&window.Notification&&Notification.permission==='granted'){const n=new Notification('Incoming '+(mode==='video'?'video':'voice')+' call',{body:name+' is calling you on Tevlo.',tag:'tevlo-incoming-call',renotify:true});n.onclick=()=>{window.focus();n.close()}}}catch(e){}
 const interval=Math.max(700,Math.min(3500,Number(p.ringtoneInterval??1800)));
 if(p.ringtoneStyle!=='off'&&Number(p.ringtoneVolume??55)>0){playTevloRingtone(false);tevloIncomingAlertTimer=setInterval(()=>playTevloRingtone(false),interval)}
 if(p.callVibration&&navigator.vibrate){try{navigator.vibrate([180,90,180])}catch(e){}}
}
function showCallOverlay({name,mode,status='Connecting…',incoming=false,video=false}){
 document.querySelector('.call-overlay')?.remove();
 const overlay=document.createElement('div');overlay.className='call-overlay';overlay.id='callOverlay';overlay.dataset.layout=tevloPrefs().callLayout||'classic';
 overlay.innerHTML=`<section class="call-card"><div class="stat" style="color:#7de8ad;letter-spacing:.16em;text-transform:uppercase;font-weight:800;font-size:10px">TEVLO · ${mode==='video'?'VIDEO CALL':'VOICE CALL'}</div><div class="call-avatar" id="callAvatar">${esc(initials(name))}</div><h2 id="callName" style="margin:0;font-size:27px;letter-spacing:-.04em">${esc(name)}</h2><div class="call-status" id="callStatus">${esc(status)}</div><div class="call-video-stage ${mode==='video'?'':'hidden'}" id="callVideoStage"><video id="remoteCallVideo" autoplay playsinline></video><video id="localCallVideo" class="call-local-video" autoplay muted playsinline></video><button class="call-video-toggle" id="callVideoToggle">▣ Camera off</button></div><div class="call-controls" id="callControls">${incoming?'<button class="call-control danger" id="declineCall">✕<small>Decline</small></button><button class="call-control accept" id="acceptCall">☎<small>Accept</small></button>':`<button class="call-control" id="muteCall">🎙<small>Mute</small></button>${mode==='video'?'<button class="call-control" id="cameraCall">▣<small>Camera</small></button>':''}<button class="call-control danger" id="endCall">☎<small>End call</small></button>`}</div><div class="call-error hidden" id="callError"></div></section>`;
 document.body.appendChild(overlay);
 $('#declineCall')?.addEventListener('click',()=>finishCall(true,'Call declined'));
 $('#acceptCall')?.addEventListener('click',acceptIncomingCall);
 $('#endCall')?.addEventListener('click',()=>finishCall(true,'Call ended'));
 $('#muteCall')?.addEventListener('click',toggleCallMute);
 $('#cameraCall')?.addEventListener('click',toggleCallCamera);
 $('#callVideoToggle')?.addEventListener('click',toggleCallCamera);
}
function callStatus(s){const el=$('#callStatus');if(el)el.textContent=s}
function callError(s){const el=$('#callError');if(el){el.textContent=s;el.classList.remove('hidden')}}
function attachCallMedia(){
 if(!tevloCall)return;
 const local=$('#localCallVideo'),remote=$('#remoteCallVideo');
 if(local&&tevloCall.localStream){local.srcObject=tevloCall.localStream;local.style.transform=tevloPrefs().callCameraMirror===false?'none':'scaleX(-1)'}
 if(remote&&tevloCall.remoteStream){remote.srcObject=tevloCall.remoteStream;remote.autoplay=true;remote.playsInline=true;const playRemote=()=>remote.play().catch(err=>console.warn('Remote media autoplay needs a user gesture',err));if(tevloCall.remoteStream.getTracks().length)playRemote();else tevloCall.remoteStream.addEventListener?.('addtrack',playRemote,{once:true})}
 const stage=$('#callVideoStage');if(stage)stage.classList.toggle('hidden',tevloCall.mode!=='video');
}
async function createCallPeer(){
 if(!tevloCall)throw new Error('Call is no longer active.');
 const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},{urls:'turns:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}],iceCandidatePoolSize:10});
 tevloCall.pc=pc;tevloCall.remoteStream=new MediaStream();
 pc.ontrack=e=>{if(!tevloCall)return;for(const track of e.streams[0]?.getTracks?.()||[e.track])if(!tevloCall.remoteStream.getTracks().some(t=>t.id===track.id))tevloCall.remoteStream.addTrack(track);attachCallMedia();callStatus('Connected');if(!tevloCall.connectedTonePlayed&&tevloPrefs().callConnectTone!==false){tevloCall.connectedTonePlayed=true;playTevloTone(940,.12)}};
 pc.onicecandidate=e=>{if(e.candidate&&tevloCall)callSignalSend(tevloCall.peerId,{kind:'ice',callId:tevloCall.callId,conversationId:tevloCall.conversationId,mode:tevloCall.mode,data:e.candidate.toJSON()})};
 pc.onconnectionstatechange=()=>{if(!tevloCall)return;if(pc.connectionState==='connected'){callStatus('Connected');if(!tevloCall.connectedTonePlayed&&tevloPrefs().callConnectTone!==false){tevloCall.connectedTonePlayed=true;playTevloTone(940,.12)}}if(['failed','disconnected'].includes(pc.connectionState))callStatus('Connection interrupted');if(pc.connectionState==='closed')callStatus('Call ended')};
 for(const track of tevloCall.localStream.getTracks())pc.addTrack(track,tevloCall.localStream);
 return pc;
}
async function startCall(mode){
 if(window.Notification&&Notification.permission==='default'){try{await Notification.requestPermission()}catch(e){}}
 const c=state.conversations.find(x=>x.id===state.active);
 if(!c||c.is_group)return toast('Calling is available in one-to-one conversations.');
  if(!c.other_user_id&&SUPABASE_READY&&state.user?.id){try{const {data:member}=await sb.from('tevlo_conversation_members').select('user_id').eq('conversation_id',c.id).neq('user_id',state.user.id).maybeSingle();if(member?.user_id)c.other_user_id=member.user_id}catch(err){console.warn('Could not resolve call recipient',err)}}
  if(!c.other_user_id)return toast('Could not find the other person in this conversation.');
 if(!SUPABASE_READY)return toast('Sign in with a real Tevlo account to call. Preview mode cannot connect calls.');
 if(!navigator.mediaDevices?.getUserMedia||!window.RTCPeerConnection)return toast('Calling needs a recent browser with microphone/camera support.');
 if(tevloCall)return toast('Finish your current call first.');
 try{
  const prefs=tevloPrefs();const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:prefs.echoCancellation!==false,noiseSuppression:prefs.noiseSuppression!==false,autoGainControl:prefs.autoGainControl!==false},video:mode==='video'?{width:{ideal:prefs.callAudioQuality==='high-quality'?1280:640},height:{ideal:prefs.callAudioQuality==='high-quality'?720:480}}:false});
  tevloCall={mode,peerId:c.other_user_id,conversationId:c.id,callId:crypto.randomUUID?.()||String(Date.now())+'-'+Math.random().toString(36).slice(2),localStream:stream,remoteStream:new MediaStream(),incoming:false,muted:false,cameraOff:false};
  showCallOverlay({name:c.name,mode,status:'Calling…',video:mode==='video'});attachCallMedia();
  const pc=await createCallPeer();
  /* The database call inbox is the reliable signaling path; do not block the offer on an unrelated legacy realtime channel. */
  const offer=await pc.createOffer();await pc.setLocalDescription(offer);
  await callSignalSend(tevloCall.peerId,{kind:'offer',callId:tevloCall.callId,conversationId:c.id,mode,data:pc.localDescription.toJSON(),name:state.profile?.name||state.profile?.real_name||'Tevlo user'});
 }catch(err){console.error(err);callError(err?.message||'Could not start the call. Check microphone and camera permissions.');callStatus('Unable to connect');if(tevloCall?.localStream){tevloCall.localStream.getTracks().forEach(t=>t.stop());}await finishCall(false,'Call could not start. Please try again.');}
}
async function handleCallSignal(p){
 if(!p||p.to!==state.user?.id||p.from===state.user?.id)return;
 if(p.kind==='offer'){
  if(tevloCall){callSignalSend(p.from,{kind:'busy',callId:p.callId,conversationId:p.conversationId});return}
  const c=state.conversations.find(x=>x.id===p.conversationId);const name=p.name||c?.name||'Tevlo user';
  tevloPendingCall={...p,name};
  showCallOverlay({name,mode:p.mode||'audio',status:'Incoming call',incoming:true,video:p.mode==='video'});startIncomingCallAlert(name,p.mode||'audio');
  return;
 }
 if(p.kind==='ice'&&!tevloCall&&tevloPendingCall?.callId===p.callId){(tevloPendingCall.queuedIce||=[]).push(p.data);return}
 if(!tevloCall||p.callId!==tevloCall.callId)return;
 try{
  if(p.kind==='answer'){await tevloCall.pc.setRemoteDescription(new RTCSessionDescription(p.data));callStatus('Connecting…');for(const candidate of tevloCall.queuedIce||[])await tevloCall.pc.addIceCandidate(new RTCIceCandidate(candidate));tevloCall.queuedIce=[]}
  if(p.kind==='ice'){if(tevloCall?.callId===p.callId){if(tevloCall.pc?.remoteDescription)await tevloCall.pc.addIceCandidate(new RTCIceCandidate(p.data));else(tevloCall.queuedIce||=[]).push(p.data)}else if(tevloPendingCall?.callId===p.callId)(tevloPendingCall.queuedIce||=[]).push(p.data);}
  if(p.kind==='hangup'||p.kind==='decline'||p.kind==='busy'){const msg=p.kind==='busy'?'User is busy':p.kind==='decline'?'Call declined':'Call ended';finishCall(false,msg)}
 }catch(err){console.error('Call signaling error',err);callError('Connection error. Please end the call and try again.')}
}
async function acceptIncomingCall(){
 const p=tevloPendingCall;if(!p)return;stopIncomingCallAlert();
 if(!navigator.mediaDevices?.getUserMedia)return callError('This browser does not support microphone or camera access.');
 try{
  const prefs=tevloPrefs();const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:prefs.echoCancellation!==false,noiseSuppression:prefs.noiseSuppression!==false,autoGainControl:prefs.autoGainControl!==false},video:p.mode==='video'?{width:{ideal:prefs.callAudioQuality==='high-quality'?1280:640},height:{ideal:prefs.callAudioQuality==='high-quality'?720:480}}:false});
  tevloCall={mode:p.mode||'audio',peerId:p.from,conversationId:p.conversationId,callId:p.callId,localStream:stream,remoteStream:new MediaStream(),incoming:true,muted:false,cameraOff:false,queuedIce:p.queuedIce||[]};tevloPendingCall=null;
  showCallOverlay({name:p.name,mode:tevloCall.mode,status:'Connecting…',video:tevloCall.mode==='video'});attachCallMedia();
  const pc=await createCallPeer();await pc.setRemoteDescription(new RTCSessionDescription(p.data));
  for(const candidate of tevloCall.queuedIce||[])await pc.addIceCandidate(new RTCIceCandidate(candidate));tevloCall.queuedIce=[];
  const answer=await pc.createAnswer();await pc.setLocalDescription(answer);
  await callSignalSend(tevloCall.peerId,{kind:'answer',callId:tevloCall.callId,conversationId:tevloCall.conversationId,mode:tevloCall.mode,data:pc.localDescription.toJSON()});
 }catch(err){console.error(err);callError(err?.message||'Could not accept call. Check microphone/camera permissions.');callStatus('Unable to connect')}
}

 stopIncomingCallAlert();const call=tevloCall,pending=tevloPendingCall;if((call||pending)&&tevloPrefs().callEndTone!==false)playTevloTone(520,.16);

}

document.addEventListener("click",async e=>{const b=e.target.closest("button,[data-conv],[data-person],[data-filter]");if(!b)return;const id=b.id;

 themeBtn:()=>{const c=state.conversations?.find(x=>x.id===state.active);if(c)themeModal(c)},disappearBtn:()=>{const c=state.conversations?.find(x=>x.id===state.active);if(c)disappearModal(c)},

<script id="tevlo-upgrade-patch">
(()=>{
  const upgradeDefaults={theme:'light',wallpaper:'forest',bubble:'#159f63',accent:'#25c978',sound:'soft',lastSeen:'friends',allowCalls:true,allowMessages:'friends',quietStart:'22:00',quietEnd:'07:00',quietEnabled:false,notifications:true,readReceipts:true,statusText:'',statusVisibility:'friends',pinnedMessages:[],mutedChats:[]};
  let upgradePrefs={...upgradeDefaults},callChannels=new Map(),callDurations=null,callStartedAt=0,callOfferRetryTimers=new Map(),callOrphanIce=new Map(),callSignalPollTimer=null,callSignalPollBusy=false;
  const oldAfterAuth=afterAuth,oldRenderChat=renderChat,oldSettingsModal=settingsModal,oldRenderMessages=renderMessages,baseStartCall=startCall,baseHandleCallSignal=handleCallSignal;
  async function loadUpgradePrefs(){
    upgradePrefs={...upgradeDefaults,...visualDefaults,...JSON.parse(localStorage.getItem('tevlo_preferences')||'{}')};
    if(SUPABASE_READY&&state.user?.id){
      try{const {data}=await sb.from('tevlo_user_settings').select('preferences').eq('user_id',state.user.id).maybeSingle();if(data?.preferences)upgradePrefs={...upgradePrefs,...data.preferences};}catch(e){console.warn('Preferences load issue',e)}
    }
    if(upgradePrefs.theme==='dark-green'&&!localStorage.getItem('tevlo_user_chose_dark_theme'))upgradePrefs.theme='light';
    const legacyDarkDefaults={pageBg:'#061b12',sidebarBg:'#0d2d20',panelBg:'#0d2d20',chatBg:'#08251a',textColor:'#ecfff5',mutedColor:'#a9d8bd',lineColor:'#245641',searchBg:'#0a2419',composerBg:'#0a2419',selectedColor:'#15523a',incoming:'#174d37',accent:'#25c978',bubble:'#159f63'};
    let migratedLegacyColors=false;
    if(upgradePrefs.theme==='light')for(const [key,oldValue] of Object.entries(legacyDarkDefaults)){if(upgradePrefs[key]===oldValue){upgradePrefs[key]=visualDefaults[key]??({'accent':'#087f50','bubble':'#239b6a','incoming':'#f0edf2','selectedColor':'#e1f5e8'}[key]??oldValue);migratedLegacyColors=true}}
    if(migratedLegacyColors)localStorage.setItem('tevlo_preferences',JSON.stringify(upgradePrefs));
    localStorage.setItem('tevlo_preferences',JSON.stringify(upgradePrefs));applyUpgradePrefs();customApplyPrefs();
  }
  async function saveUpgradePrefs(patch){
    upgradePrefs={...upgradePrefs,...patch};
    if(Object.prototype.hasOwnProperty.call(patch,'notifications'))state.notifications=!!upgradePrefs.notifications;
    if(Object.prototype.hasOwnProperty.call(patch,'readReceipts'))state.readReceipts=!!upgradePrefs.readReceipts;
    localStorage.setItem('tevlo_preferences',JSON.stringify(upgradePrefs));applyUpgradePrefs();customApplyPrefs();
    if(SUPABASE_READY&&state.user?.id&&upgradePrefs.syncPreferences!==false){const {error}=await sb.from('tevlo_user_settings').upsert({user_id:state.user.id,preferences:upgradePrefs,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)toast('Saved on this device; cloud sync failed.');}
  }
  function applyUpgradePrefs(){
    const rootStyle=document.documentElement.style;
    document.body.dataset.tevlTheme=upgradePrefs.theme==='light'?'light':'dark';
    if(/^#[0-9a-f]{6}$/i.test(upgradePrefs.accent||'')){rootStyle.setProperty('--teal',upgradePrefs.accent);rootStyle.setProperty('--teal-dark',upgradePrefs.accent)}
    if(/^#[0-9a-f]{6}$/i.test(upgradePrefs.bubble||''))rootStyle.setProperty('--bubble-custom',upgradePrefs.bubble);
    document.body.classList.toggle('dark',upgradePrefs.theme==='dark-green'||upgradePrefs.theme==='dark');
    document.body.dataset.wallpaper=upgradePrefs.wallpaper||'forest';
    const msg=document.querySelector('.messages');if(msg){msg.style.backgroundImage=upgradePrefs.wallpaper==='ocean'?'linear-gradient(135deg,#082a39,#0a302a)':upgradePrefs.wallpaper==='sunset'?'linear-gradient(135deg,#352038,#492b2c)':upgradePrefs.wallpaper==='stars'?'radial-gradient(circle at 20% 20%,#24402e 1px,transparent 2px),linear-gradient(135deg,#071b14,#102a24)':upgradePrefs.wallpaper==='plain'?'none':'linear-gradient(145deg,#071f16,#0b2b1e,#08251a)';}
  }
  afterAuth=async function(user){await oldAfterAuth(user);await loadUpgradePrefs();setupCallSignaling();};
  callSignalChannelName=function(conversationId){return 'tevlo-call-'+conversationId};
  setupCallSignaling=function(){
    if(!SUPABASE_READY||!state.user?.id||!sb?.channel)return;
    for(const ch of callChannels.values()){try{sb.removeChannel(ch)}catch(e){}}
    callChannels.clear();
    for(const c of (state.conversations||[]).filter(x=>!x.is_self)){
      const topic=callSignalChannelName(c.id);
      const ch=sb.channel(topic,{config:{private:true,broadcast:{self:false}}});
      ch.on('broadcast',{event:'signal'},({payload})=>handleCallSignal(payload));
      ch.subscribe(status=>{if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED')console.warn('Tevlo call channel issue',topic,status);});
      callChannels.set(c.id,ch);
    }
    startCallSignalPolling();
  };
  async function startCallSignalPolling(){
    if(callSignalPollTimer)clearInterval(callSignalPollTimer);
    const poll=async()=>{
      if(callSignalPollBusy||!SUPABASE_READY||!state.user?.id)return;
      callSignalPollBusy=true;
      try{
        const cutoff=new Date(Date.now()-120000).toISOString();
        const {data,error}=await sb.from('tevlo_call_signals').select('id,payload,created_at,conversation_id,sender_id,recipient_id').eq('recipient_id',state.user.id).gte('created_at',cutoff).order('id',{ascending:true}).limit(100);
        if(error)throw error;
        for(const row of data||[]){
          let handled=false;
          try{
            const payload=row.payload&&typeof row.payload==='object'?row.payload:{};
            const signal={...payload,to:row.recipient_id,from:row.sender_id,conversationId:row.conversation_id};
            if(!signal.kind||!signal.callId||!signal.from||!signal.to)throw new Error('Call inbox row is missing required signal fields.');
            await handleCallSignal(signal);
            handled=true;
          }catch(err){console.warn('Call signal handling failed; keeping it in the inbox for retry',row.id,err)}
          if(handled){
            const {error:deleteError}=await sb.from('tevlo_call_signals').delete().eq('id',row.id).eq('recipient_id',state.user.id);
            if(deleteError)console.warn('Could not acknowledge call signal',row.id,deleteError);
          }
        }
        await sb.from('tevlo_call_signals').delete().eq('recipient_id',state.user.id).lt('created_at',cutoff);
      }catch(err){console.warn('Tevlo call inbox polling issue',err)}
      finally{callSignalPollBusy=false}
    };
    await poll();
    callSignalPollTimer=setInterval(poll,900);
  }
  callSignalSend=async function(to,payload){
    if(!to||!state.user?.id||!payload?.conversationId)throw new Error('Missing call recipient or conversation.');
    const signal={...payload,to,from:state.user.id};
    const {error}=await sb.from('tevlo_call_signals').insert({conversation_id:payload.conversationId,sender_id:state.user.id,recipient_id:to,payload:signal});
    if(error)throw new Error('Call signal could not be sent: '+error.message);
    return {status:'ok'};
  };
  function showTevloIncomingBanner(p){
    document.querySelector('[data-tevlo-incoming-banner]')?.remove();
    const name=p.name||state.conversations.find(c=>c.id===p.conversationId)?.name||'Tevlo user';
    const banner=document.createElement('div');banner.dataset.tevloIncomingBanner='true';
    banner.style.cssText='position:fixed;top:14px;left:50%;transform:translateX(-50%);width:min(520px,calc(100vw - 24px));z-index:10000;background:#103b29;color:#f2fff8;border:1px solid #42d58a;border-radius:18px;padding:16px 18px;box-shadow:0 16px 60px #0007;display:flex;align-items:center;gap:12px;font:500 14px system-ui,sans-serif';

  function clearCallOfferRetry(callId){const entry=callOfferRetryTimers.get(callId);if(entry){clearInterval(entry.timer);callOfferRetryTimers.delete(callId)}}
  handleCallSignal=async function(p){
    if(!p)return;
    if(p.kind==='received'){clearCallOfferRetry(p.callId);return}
    if(p.kind==='offer'){
      const currentId=tevloCall?.callId||tevloPendingCall?.callId;
      if(currentId===p.callId){try{await callSignalSend(p.from,{kind:'received',callId:p.callId,conversationId:p.conversationId})}catch(e){}return}
      const early=callOrphanIce.get(p.callId)||[];
      if(early.length){p={...p,queuedIce:[...(p.queuedIce||[]),...early]};callOrphanIce.delete(p.callId)}
      await baseHandleCallSignal(p);
      if(tevloPendingCall?.callId===p.callId){showTevloIncomingBanner(p);try{await callSignalSend(p.from,{kind:'received',callId:p.callId,conversationId:p.conversationId})}catch(e){console.warn('Call receipt could not be sent',e)}}
      return;
    }
    if(p.kind==='ice'&&!tevloCall&&tevloPendingCall?.callId!==p.callId){const list=callOrphanIce.get(p.callId)||[];if(list.length<80)list.push(p.data);callOrphanIce.set(p.callId,list);return}
    if(['answer','hangup','decline','busy'].includes(p.kind))clearCallOfferRetry(p.callId);
    return baseHandleCallSignal(p);
  };
  startCall=async function(mode){
    await baseStartCall(mode);
    const call=tevloCall;if(!call||call.incoming||!call.pc?.localDescription)return;
    clearCallOfferRetry(call.callId);
    const entry={attempts:0,timer:null};
    entry.timer=setInterval(async()=>{
      if(!tevloCall||tevloCall.callId!==call.callId||tevloCall.pc?.remoteDescription?.type==='answer'||entry.attempts>=7){clearCallOfferRetry(call.callId);return}
      entry.attempts++;
      try{await callSignalSend(call.peerId,{kind:'offer',callId:call.callId,conversationId:call.conversationId,mode:call.mode,data:call.pc.localDescription.toJSON(),name:state.profile?.name||state.profile?.real_name||'Tevlo user'})}catch(err){console.warn('Call offer retry failed',err)}
    },1400);
    callOfferRetryTimers.set(call.callId,entry);
  };

  settingsModal=function(){
    customActiveCategory='Appearance';
    showModal('<div class="custom-settings-modal"><div class="modal-head"><div><h2>Customize Tevlo</h2><div class="stat">Personalize colors, chats, layout, privacy preferences, and more.</div></div><button class="ghost" data-close aria-label="Close settings">✕</button></div><div class="custom-settings-toolbar"><input id="customSettingsSearch" class="custom-settings-search" type="search" placeholder="Search hundreds of settings…"><button class="secondary" id="customResetView">Reset view</button></div><div class="custom-settings-layout" id="customSettingsLayout"><nav class="custom-settings-categories" id="customSettingsCategories" aria-label="Settings categories"></nav><section class="custom-settings-list" id="customSettingsList" aria-live="polite"></section></div><div class="custom-settings-footer"><span id="customSettingsCount" class="custom-settings-count"></span><div style="display:flex;gap:8px"><button class="secondary" id="customExportSettings">Export</button><button class="primary" id="customSaveClose">Done</button></div></div></div>');
    $('#modal .modal')?.classList.add('custom-settings-shell');
    const search=$('#customSettingsSearch');search.oninput=()=>{if(search.value.trim())customActiveCategory='All';customRenderSettings(search.value)};
    $('#customResetView').onclick=()=>{search.value='';customActiveCategory='Appearance';customRenderSettings('')};
    $('#customExportSettings').onclick=()=>{const blob=new Blob([JSON.stringify(upgradePrefs,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tevlo-settings.json';a.click();URL.revokeObjectURL(url);toast('Settings exported.')};
    $('#customSaveClose').onclick=()=>{customApplyPrefs();closeModal();toast('Your Tevlo customizations are applied.')};
    customRenderSettings('');
  };
    renderMessages=async function(){
    await oldRenderMessages();
    const wrap=$('#messages');if(!wrap||!SUPABASE_READY||!state.messages?.length)return;
    const ids=state.messages.map(m=>m.id).filter(id=>/^[0-9a-f-]{36}$/i.test(id));if(!ids.length)return;
    try{const {data,error}=await sb.from('tevlo_message_reactions').select('message_id,user_id,reaction').in('message_id',ids);if(error||!data?.length)return;
      const by={};for(const r of data)(by[r.message_id]||=[]).push(r);
      for(const [id,reactions] of Object.entries(by)){const row=wrap.querySelector('[data-msg="'+CSS.escape(id)+'"] .message-stack');if(!row)continue;const strip=document.createElement('div');strip.className='upgrade-reactions';strip.innerHTML=[...new Set(reactions.map(r=>r.reaction))].map(emoji=>'<button class="upgrade-reaction" data-reaction-msg="'+id+'" data-reaction="'+esc(emoji)+'">'+esc(emoji)+' '+reactions.filter(r=>r.reaction===emoji).length+'</button>').join('');row.appendChild(strip)}
    }catch(e){console.warn('Could not load message reactions',e)}
  };
  function groupPollModal(c){
    showModal('<div class="modal-head"><h2>Group poll</h2><button class="ghost" data-close>✕</button></div><label>Question</label><input id="pollQuestion" maxlength="300" placeholder="What should we do?"><label>Options (one per line)</label><textarea id="pollOptions" rows="4" placeholder="Go bowling&#10;Movie night"></textarea><button class="primary" id="createPollNow">Create poll</button><div id="pollList" class="settings-card">Loading polls…</div>');
    const refresh=async()=>{const {data,error}=await sb.from('tevlo_group_polls').select('*').eq('conversation_id',c.id).order('created_at',{ascending:false});const el=$('#pollList');if(!el)return;if(error){el.textContent='Polls could not load: '+error.message;return}if(!data?.length){el.textContent='No polls yet.';return}el.innerHTML=data.map(p=>'<div class="settings-card"><b>'+esc(p.question)+'</b><div class="choice-list">'+p.options.map((o,i)=>'<button class="choice-row" data-vote-poll="'+p.id+'" data-vote-index="'+i+'">'+esc(o)+'</button>').join('')+'</div></div>').join('')};
    $('#createPollNow').onclick=async()=>{const question=$('#pollQuestion').value.trim(),options=$('#pollOptions').value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,8);if(!question||options.length<2)return toast('Add a question and at least two options.');const {error}=await sb.from('tevlo_group_polls').insert({conversation_id:c.id,created_by:state.user.id,question,options});if(error)return toast('Could not create poll: '+error.message);$('#pollQuestion').value='';$('#pollOptions').value='';await refresh();toast('Poll created.')};
    $('#pollList').onclick=async e=>{const b=e.target.closest('[data-vote-poll]');if(!b)return;const {error}=await sb.from('tevlo_group_poll_votes').upsert({poll_id:b.dataset.votePoll,user_id:state.user.id,option_index:Number(b.dataset.voteIndex)},{onConflict:'poll_id,user_id'});if(error)return toast('Could not vote: '+error.message);toast('Vote saved.')};refresh();
  }
  function groupEventModal(c){
    showModal('<div class="modal-head"><h2>Plan a group event</h2><button class="ghost" data-close>✕</button></div><label>Event title</label><input id="eventTitle" maxlength="180" placeholder="Game night"><label>When?</label><input id="eventDate" type="datetime-local"><label>Details</label><textarea id="eventDetails" rows="3" placeholder="Place, plans, or what to bring"></textarea><button class="primary" id="saveGroupEvent">Create event</button><div id="eventList" class="settings-card">Loading events…</div>');
    const refresh=async()=>{const {data,error}=await sb.from('tevlo_group_events').select('*').eq('conversation_id',c.id).order('starts_at',{ascending:true});const el=$('#eventList');if(!el)return;if(error){el.textContent='Events could not load: '+error.message;return}el.innerHTML=data?.length?data.map(x=>'<div class="settings-card"><b>'+esc(x.title)+'</b><div class="stat">'+esc(x.starts_at?new Date(x.starts_at).toLocaleString():'Time not set')+'</div><p>'+esc(x.details||'')+'</p></div>').join(''):'No events planned yet.'};
    $('#saveGroupEvent').onclick=async()=>{const title=$('#eventTitle').value.trim();if(!title)return toast('Enter an event title.');const dt=$('#eventDate').value;const {error}=await sb.from('tevlo_group_events').insert({conversation_id:c.id,created_by:state.user.id,title,details:$('#eventDetails').value.trim(),starts_at:dt?new Date(dt).toISOString():null});if(error)return toast('Could not create event: '+error.message);$('#eventTitle').value='';await refresh();toast('Event added.')};refresh();
  }
  function groupDetailsModal(c){
    showModal('<div class="modal-head"><h2>Group details</h2><button class="ghost" data-close>✕</button></div><label>Group name</label><input id="groupEditName" maxlength="100"><label>Description</label><textarea id="groupEditDescription" maxlength="500" rows="3" placeholder="What is this group for?"></textarea><button class="primary" id="saveGroupDetails">Save group details</button>');
    $('#groupEditName').value=c.name||'';$('#groupEditDescription').value=c.description||'';
    $('#saveGroupDetails').onclick=async()=>{const name=$('#groupEditName').value.trim()||'Group chat',description=$('#groupEditDescription').value.trim();const {error}=await sb.from('tevlo_conversations').update({name,description}).eq('id',c.id);if(error)return toast('Could not save group details: '+error.message);c.name=name;c.description=description;closeModal();renderApp();toast('Group details saved.')};
  }
  document.addEventListener('click',async e=>{
    const reaction=e.target.closest('[data-reaction-msg]');if(reaction){e.preventDefault();const {error}=await sb.from('tevlo_message_reactions').upsert({message_id:reaction.dataset.reactionMsg,user_id:state.user.id,reaction:reaction.dataset.reaction},{onConflict:'message_id,user_id'});if(error)return toast('Reaction failed.');await renderMessages();return}
    const pin=e.target.closest('[data-more-msg]');if(pin){const id=pin.dataset.moreMsg;const action=prompt('Type edit, delete, pin, or cancel');if(action==='pin'){const pinned=new Set(upgradePrefs.pinnedMessages||[]);pinned.has(id)?pinned.delete(id):pinned.add(id);await saveUpgradePrefs({pinnedMessages:[...pinned]});toast(pinned.has(id)?'Message pinned on your account.':'Message unpinned.');return}}
  },true);
  const oldHandleCallSignal=handleCallSignal;
  handleCallSignal=async function(p){
    if(p?.kind==='offer'){
      if(!upgradePrefs.allowCalls){try{await callSignalSend(p.from,{kind:'decline',callId:p.callId,conversationId:p.conversationId});}catch(e){}return;}
      if(SUPABASE_READY&&state.user?.id){
        try{const {data:blocked}=await sb.from('tevlo_blocks').select('blocker_id').or('and(blocker_id.eq.'+state.user.id+',blocked_id.eq.'+p.from+'),and(blocker_id.eq.'+p.from+',blocked_id.eq.'+state.user.id+')').limit(1);if(blocked?.length){await callSignalSend(p.from,{kind:'decline',callId:p.callId,conversationId:p.conversationId});return;}}catch(e){console.warn('Could not verify call block status',e)}
      }
    }
    return oldHandleCallSignal(p);
  };
  const oldStartCall=startCall;
  startCall=async function(mode){
    if(!upgradePrefs.allowCalls)return toast('Calls are disabled in your privacy settings.');
    if(tevloCall)return toast('Finish your current call first.');
    await oldStartCall(mode);
    if(tevloCall){callStartedAt=Date.now();clearInterval(callDurations);callDurations=setInterval(()=>{if(!tevloCall){clearInterval(callDurations);return}const el=$('#callStatus');if(el&&tevloCall.pc?.connectionState==='connected'){const sec=Math.floor((Date.now()-callStartedAt)/1000);el.textContent='Connected · '+String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0')}},1000)}
  };
  const oldFinishCall=finishCall;
  finishCall=async function(notify=true,message='Call ended'){clearInterval(callDurations);callDurations=null;return oldFinishCall(notify,message)};
  const oldPushNotification=pushNotification;
  pushNotification=function(title,body){
    const now=new Date(),toMinutes=t=>{const [h,m]=String(t||'00:00').split(':').map(Number);return h*60+m},mins=now.getHours()*60+now.getMinutes();
    const start=toMinutes(upgradePrefs.quietStart),end=toMinutes(upgradePrefs.quietEnd);
    const quiet=upgradePrefs.quietEnabled&&(start<=end?(mins>=start&&mins<end):(mins>=start||mins<end));
    const noticeTitle=String(title||'').toLowerCase();
    if(quiet||upgradePrefs.notifications===false)return;
    if(noticeTitle.includes('call')&&upgradePrefs.notifyCalls===false)return;
    if((noticeTitle.includes('message')||noticeTitle.includes('chat'))&&upgradePrefs.notifyMessages===false)return;
    if(noticeTitle.includes('request')&&upgradePrefs.notifyFriendRequests===false)return;
    if((noticeTitle.includes('group')||noticeTitle.includes('event'))&&upgradePrefs.notifyGroupEvents===false)return;
    if(state.active&&upgradePrefs.mutedChats?.includes(state.active))return;
    if(upgradePrefs.sound!=='off'&&Number(upgradePrefs.notifySoundVolume??35)>0&&window.AudioContext){try{const ctx=new AudioContext(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type='sine';osc.frequency.value=upgradePrefs.sound==='pop'?740:upgradePrefs.sound==='bell'?880:upgradePrefs.sound==='digital'?660:520;gain.gain.setValueAtTime(.0001,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(Math.max(.0001,Math.min(.08,Number(upgradePrefs.notifySoundVolume??35)/100*.08)),ctx.currentTime+.02);gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.16);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+.18);osc.onended=()=>ctx.close()}catch(e){}}
    const priorNotificationSetting=state.notifications;
    if(upgradePrefs.notifyDesktop===false)state.notifications=false;
    try{return oldPushNotification(title,upgradePrefs.notifyPreviews===false?'New Tevlo activity':body)}
    finally{state.notifications=priorNotificationSetting}
  };
  document.addEventListener('click',async e=>{
    const mute=e.target.closest('#muteChat');if(!mute)return;
    e.preventDefault();e.stopImmediatePropagation();
    const c=state.conversations?.find(x=>x.id===state.active);if(!c)return;
    const muted=new Set(upgradePrefs.mutedChats||[]);const nowMuted=!muted.has(c.id);nowMuted?muted.add(c.id):muted.delete(c.id);
    await saveUpgradePrefs({mutedChats:[...muted]});toast(nowMuted?'Conversation muted.':'Conversation unmuted.');
  },true);
  const priorRenderMessages=renderMessages;
  renderMessages=async function(){
    await priorRenderMessages();
    const wrap=$('#messages');if(!wrap)return;
    wrap.querySelectorAll('audio').forEach(audio=>{audio.playbackRate=Number(String(upgradePrefs.voiceMessagePlaybackSpeed||'1x').replace('x',''))||1;audio.autoplay=!!upgradePrefs.voiceMessageAutoPlay;const card=audio.closest('.audio-card');if(card){card.classList.toggle('voice-waveform-enabled',upgradePrefs.voiceMessageWaveform!==false);card.dataset.quality=upgradePrefs.voiceMessageQuality||'standard'}});
    for(const id of upgradePrefs.pinnedMessages||[]){const row=wrap.querySelector('[data-msg="'+CSS.escape(id)+'"] .message-stack');if(row&&!row.querySelector('.upgrade-pin')){const label=document.createElement('div');label.className='upgrade-pin';label.textContent='⌖ Pinned on your account';row.prepend(label)}}
  };
  // Ensure the call panel is always wired to conversation-specific private channels after conversations refresh.
  const oldLoadConversations=loadConversations;
  loadConversations=async function(){await oldLoadConversations();if(state.user?.id)setupCallSignaling()};
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&state.user?.id)setupCallSignaling()});
})();
</script>
